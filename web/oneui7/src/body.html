<body>
<div class="desktop-bg">
<div class="phone" id="phone">
<div class="side-btn-power" id="power-btn" title="Кнопка питания: блокировка"></div>
<div class="side-btn-vol-up"></div>
<div class="side-btn-vol-down"></div>
<div class="screen" id="screen">
<div id="torch"></div>
<div id="dim"></div>

<!-- ЭКРАН БЛОКИРОВКИ -->
<div class="layer lockscreen" id="lockscreen">
  <div class="lockscreen-wallpaper" id="lock-wall"></div>
  <div class="lock-unlock-area" id="unlock-area"></div>
  <div class="statusbar"><div class="left" data-time></div><div class="right" data-status></div></div>
  <div class="lock-clock" id="lock-clock"></div>
  <div class="lock-date" id="lock-date"></div>
  <div class="lock-now-bar idle" id="lock-now" data-a="music"><div class="dot"></div><span id="lock-now-text">Музыка на паузе</span></div>
  <div class="lock-shortcuts">
    <div class="lock-shortcut" data-lockapp="camera" role="button" aria-label="Камера"><svg viewBox="0 0 24 24" fill-rule="evenodd"><path d="M9 2L7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" clip-rule="evenodd"/></svg></div>
    <div class="lock-shortcut" data-lockapp="phone" role="button" aria-label="Телефон"><svg viewBox="0 0 24 24"><path d="M20 15.5l-2.5-.3c-.6-.1-1.2.1-1.6.5l-1.8 1.8a15.1 15.1 0 0 1-6.6-6.6l1.8-1.8c.4-.4.6-1 .5-1.6L9.5 4c-.1-1-1-1.7-2-1.5C5.4 2.7 3 5.4 3 8.5 3 16 8 21 15.5 21c3.1 0 5.8-2.4 6-4.5.2-1-.5-1.9-1.5-2z"/></svg></div>
  </div>
  <div class="lock-hint">Нажмите или смахните вверх, чтобы разблокировать</div>
</div>

<!-- ДОМАШНИЙ ЭКРАН -->
<div class="layer homescreen hidden" id="homescreen">
  <div class="statusbar"><div class="left" data-time></div><div class="right" data-status></div></div>
  <div class="now-bar-pill idle" id="now-pill" data-open="music" role="button" aria-label="Музыка">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="text" id="now-pill-text">Музыка</div>
    <div class="bars"><span></span><span></span><span></span></div>
  </div>
  <div class="home-page-container" id="home-pages"></div>
  <div class="page-indicator" id="page-indicator"></div>
  <div class="dock" id="dock"></div>
  <div class="nav-bar"><div class="nav-pill" id="home-pill" title="Все приложения" role="button" aria-label="Все приложения"></div></div>
</div>

<!-- ШТОРКА -->
<div class="shade" id="shade">
  <div class="shade-tabs">
    <div class="shade-tab active" data-shade="notif" role="button">Уведомления</div>
    <div class="shade-tab" data-shade="qs" role="button">Быстрые настройки</div>
  </div>
  <div class="shade-info"><span id="shade-date"></span><span style="cursor:pointer" id="clear-notifs" role="button">Очистить</span></div>
  <div id="qs-panel" style="display:none">
    <div class="qs-grid" id="qs-grid"></div>
    <div class="brightness-slider">
      <svg viewBox="0 0 24 24"><path d="M12 7c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5z"/></svg>
      <div class="bar-track" id="bright-track" role="slider" aria-label="Яркость"><div class="bar-fill" id="bright-fill"></div></div>
    </div>
  </div>
  <div class="notif-section" id="notif-section"></div>
  <div class="nav-bar"><div class="nav-pill" id="shade-pill" title="Закрыть шторку"></div></div>
</div>

<!-- ВСЕ ПРИЛОЖЕНИЯ -->
<div class="app-drawer" id="app-drawer">
  <div class="statusbar"><div class="left" data-time></div><div class="right" data-status></div></div>
  <div class="drawer-search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    <input type="text" placeholder="Найти приложение" id="drawer-input" aria-label="Поиск приложений">
  </div>
  <div class="drawer-grid" id="drawer-grid"></div>
  <div class="nav-bar"><div class="nav-pill" id="drawer-pill" title="Закрыть"></div></div>
</div>

<!-- ОТКРЫТОЕ ПРИЛОЖЕНИЕ -->
<div class="app-container" id="app-container"></div>
</div>
</div>
</div>

<script>
'use strict';
// ================================================================
// Телефон «Волна»: фан-концепт интерфейса, не связан с Microsoft/Apple/Samsung.
// Работает без сети; состояние хранится в localStorage под префиксом «oneui7.».
// ================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('oneui7.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('oneui7.' + k, JSON.stringify(v)); } catch (e) { /* нет хранилища */ } },
  clear() { try { Object.keys(localStorage).filter(k => k.startsWith('oneui7.')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* нет доступа */ } },
};
const DAYS = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const dayKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const hhmm = d => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
const tempAt = h => Math.round(17 + 3 * Math.sin((h - 9) / 24 * Math.PI * 2));

// ===== Настройки =====
const WALLS = {
  night: { name: 'Ночь', lock: 'radial-gradient(circle at 20% 30%, rgba(120,80,200,0.4) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(80,140,220,0.35) 0%, transparent 50%), linear-gradient(160deg, #0a1530 0%, #1a0f3a 50%, #2a0f2a 100%)', home: 'radial-gradient(circle at 30% 20%, rgba(100,80,180,0.35) 0%, transparent 50%), radial-gradient(circle at 70% 80%, rgba(60,120,200,0.3) 0%, transparent 55%), linear-gradient(170deg, #1a1a2e 0%, #16213e 50%, #0f1828 100%)' },
  sea: { name: 'Море', lock: 'radial-gradient(circle at 50% 30%, rgba(34,211,238,0.45), transparent 50%), linear-gradient(180deg, #0c4a6e, #082f49)', home: 'radial-gradient(circle at 20% 80%, rgba(34,211,238,0.35), transparent 50%), linear-gradient(180deg, #075985, #0c1a33)' },
  berry: { name: 'Ягоды', lock: 'radial-gradient(circle at 70% 20%, rgba(244,114,182,0.5), transparent 50%), linear-gradient(160deg, #4a044e, #1e1b4b)', home: 'radial-gradient(circle at 30% 70%, rgba(244,114,182,0.35), transparent 50%), linear-gradient(170deg, #3b0764, #111827)' },
  mint: { name: 'Мята', lock: 'radial-gradient(circle at 30% 30%, rgba(74,222,128,0.4), transparent 50%), linear-gradient(160deg, #064e3b, #022c22)', home: 'radial-gradient(circle at 70% 30%, rgba(74,222,128,0.3), transparent 50%), linear-gradient(170deg, #14532d, #052e16)' },
};
const DEF = { wifi: true, mobile: true, bt: false, dnd: false, torch: false, rotate: true, airplane: false, brightness: 100, volume: 60, wall: 'night' };
const S = Object.assign({}, DEF, store.get('settings', {}));
function applySettings() {
  const w = WALLS[S.wall] || WALLS.night;
  $('lock-wall').style.background = w.lock;
  $('homescreen').style.background = w.home;
  $('dim').style.opacity = String((100 - S.brightness) / 100 * 0.7);
  $('torch').style.display = S.torch ? 'block' : 'none';
  $('bright-fill').style.width = S.brightness + '%';
  renderQS(); renderStatus();
  if (state.app === 'settings' || state.app === 'music') renderApp();
}
function setS(k, v) {
  S[k] = v;
  if (k === 'airplane' && v) { S.wifi = false; S.bt = false; S.mobile = false; }
  if (['wifi', 'bt', 'mobile'].includes(k) && v) S.airplane = false;
  store.set('settings', S); applySettings();
}

// ===== Значки и список приложений =====
const ICONS = {
  phone: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M20 15.5l-2.5-.3c-.6-.1-1.2.1-1.6.5l-1.8 1.8a15.1 15.1 0 0 1-6.6-6.6l1.8-1.8c.4-.4.6-1 .5-1.6L9.5 4c-.1-1-1-1.7-2-1.5C5.4 2.7 3 5.4 3 8.5 3 16 8 21 15.5 21c3.1 0 5.8-2.4 6-4.5.2-1-.5-1.9-1.5-2z"/></svg>',
  messages: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h10v2H7V9zm6 5H7v-2h6v2zm4-6H7V6h10v2z"/></svg>',
  contacts: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>',
  camera: '<svg viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M9 2L7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" clip-rule="evenodd"/></svg>',
  gallery: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.9 13.98l2.1 2.53 3.1-3.99L18 17.5H6l2.9-3.52z"/></svg>',
  calculator: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM8 19H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V9h2v2zm5 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm5 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4H6V5h12v2z"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><path fill="#fff" d="M12.5 7H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13c.04-.3.06-.6.06-1s-.02-.7-.06-1l2.1-1.6c.2-.15.25-.4.12-.62l-2-3.46a.5.5 0 0 0-.6-.22l-2.5 1c-.5-.4-1-.7-1.6-.95l-.4-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42L9.1 5.07c-.6.25-1.15.6-1.65.95l-2.5-1a.5.5 0 0 0-.6.22l-2 3.46c-.13.22-.07.47.12.62L4.55 11c-.04.3-.06.6-.06 1s.02.7.06 1l-2.1 1.6c-.2.15-.25.4-.12.62l2 3.46c.13.22.4.3.6.22l2.5-1c.5.4 1.05.7 1.65.95l.4 2.65c.06.24.27.42.5.42h4c.23 0 .43-.18.5-.42l.4-2.65c.6-.25 1.15-.6 1.65-.95l2.5 1c.22.08.47 0 .6-.22l2-3.46c.13-.22.07-.47-.12-.62L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>',
  weather: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M19.35 10.04A7.49 7.49 0 0 0 12 4 7.5 7.5 0 0 0 5 8.5 6 6 0 0 0 6 20.5h13a5 5 0 0 0 .35-10.46z"/></svg>',
  calendar: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V8h14v11z"/></svg>',
  notes: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>',
  music: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3v10.55c-.6-.34-1.3-.55-2-.55a4 4 0 1 0 4 4V7h4V3h-6z"/></svg>',
  browser: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18" fill="none" stroke="#fff" stroke-width="1.6"/></svg>',
  files: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>',
  mail: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>',
};
const APP_LIST = [
  { id: 'phone', name: 'Телефон', bg: 'linear-gradient(135deg, #34d399, #10b981)' },
  { id: 'messages', name: 'Сообщения', bg: 'linear-gradient(135deg, #60a5fa, #3b82f6)' },
  { id: 'contacts', name: 'Контакты', bg: 'linear-gradient(135deg, #fbbf24, #f59e0b)' },
  { id: 'camera', name: 'Камера', bg: 'linear-gradient(135deg, #6b7280, #374151)' },
  { id: 'gallery', name: 'Галерея', bg: 'linear-gradient(135deg, #f472b6, #ec4899)' },
  { id: 'calculator', name: 'Калькулятор', bg: 'linear-gradient(135deg, #fb923c, #ea580c)' },
  { id: 'clock', name: 'Часы', bg: 'linear-gradient(135deg, #1e293b, #0f172a)' },
  { id: 'settings', name: 'Настройки', bg: 'linear-gradient(135deg, #94a3b8, #475569)' },
  { id: 'weather', name: 'Погода', bg: 'linear-gradient(135deg, #38bdf8, #0284c7)' },
  { id: 'calendar', name: 'Календарь', bg: 'linear-gradient(135deg, #fb7185, #e11d48)' },
  { id: 'notes', name: 'Заметки', bg: 'linear-gradient(135deg, #facc15, #ca8a04)' },
  { id: 'music', name: 'Музыка', bg: 'linear-gradient(135deg, #c084fc, #9333ea)' },
  { id: 'browser', name: 'Интернет', bg: 'linear-gradient(135deg, #818cf8, #4f46e5)' },
  { id: 'files', name: 'Мои файлы', bg: 'linear-gradient(135deg, #67e8f9, #06b6d4)' },
  { id: 'mail', name: 'Почта', bg: 'linear-gradient(135deg, #f87171, #dc2626)' },
];
const PAGE1 = ['phone', 'messages', 'contacts', 'camera', 'gallery', 'calculator', 'clock', 'settings'];
const PAGE2 = ['weather', 'calendar', 'notes', 'music', 'browser', 'files', 'mail'];
const DOCK = ['phone', 'messages', 'browser', 'camera'];
const appName = id => APP_LIST.find(a => a.id === id).name;
function iconHTML(id, label = true) {
  const a = APP_LIST.find(x => x.id === id);
  return '<div class="app-icon" data-open="' + id + '" tabindex="0" role="button" aria-label="' + a.name + '"><div class="app-icon-img" style="background:' + a.bg + '">' + ICONS[id] + '</div>' + (label ? '<div class="app-icon-label">' + a.name + '</div>' : '') + '</div>';
}

// ===== Состояние оболочки =====
const state = { unlocked: false, app: null, shade: false, drawer: false };

// ===== Строка состояния и время =====
function renderStatus() {
  const html = (S.airplane ? '<span>✈</span>' : (S.mobile ? '<span style="font-size:11px">5G</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22z"/></svg>' : '') +
    (S.wifi ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.07 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4l2 2a7.07 7.07 0 0 1 10 0l2-2C16.07 9.07 7.93 9.07 5 13z"/></svg>' : '')) +
    (S.dnd ? '<span>⊖</span>' : '') + '<span style="display:inline-flex;align-items:center;font-size:11px"><svg viewBox="0 0 24 24" width="20" height="12"><rect x="1" y="6" width="20" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="8" width="14" height="8" rx="1" fill="currentColor"/></svg>72</span>';
  document.querySelectorAll('[data-status]').forEach(el => { if (el.innerHTML !== html) el.innerHTML = html; });
}
function tick() {
  const d = new Date(), t = hhmm(d);
  if ($('lock-clock').textContent !== t) {
    $('lock-clock').textContent = t;
    document.querySelectorAll('[data-time]').forEach(el => el.textContent = t);
    const wt = $('widget-time'); if (wt) wt.textContent = t;
  }
  $('lock-date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
  $('shade-date').textContent = DAYS[d.getDay()].slice(0, 2) + ', ' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()].slice(0, 3);
}
setInterval(tick, 1000);

// ===== Домашний экран =====
function renderHome() {
  const today = (loadEvents()[dayKey(new Date())] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
  const d = new Date();
  $('home-pages').innerHTML = '<div class="home-page"><div class="widget-group"><div class="widget widget-clock" data-open="clock" role="button"><div class="time" id="widget-time">' + hhmm(d) + '</div><div class="city">Местное время</div></div>' +
    '<div class="widget widget-weather" data-open="weather" role="button"><div class="temp">' + tempAt(d.getHours()) + '°</div><div class="desc">Лиссабон · облачно</div></div></div>' +
    '<div class="widget-large widget-calendar" data-open="calendar" role="button"><div class="month">' + MONTHS[d.getMonth()] + '</div><div class="day">' + d.getDate() + '</div>' +
    (today.length ? today.slice(0, 2).map(e => '<div class="event">' + e.time + ' - ' + esc(e.title) + '</div>').join('') : '<div class="event">Событий нет</div>') + '</div>' +
    '<div class="app-grid">' + PAGE1.map(id => iconHTML(id)).join('') + '</div></div>' +
    '<div class="home-page"><div class="app-grid" style="margin-top:20px">' + PAGE2.map(id => iconHTML(id)).join('') + '</div></div>';
  $('page-indicator').innerHTML = '<div class="page-dot active" data-page="0" role="button" aria-label="Страница 1"></div><div class="page-dot" data-page="1" role="button" aria-label="Страница 2"></div>';
  $('dock').innerHTML = DOCK.map(id => iconHTML(id, false)).join('');
}
$('home-pages').addEventListener('scroll', () => {
  const idx = Math.round($('home-pages').scrollLeft / $('home-pages').clientWidth);
  [...$('page-indicator').children].forEach((d, i) => d.classList.toggle('active', i === idx));
});
$('page-indicator').addEventListener('click', e => { const d = e.target.closest('[data-page]'); if (d) $('home-pages').scrollTo({ left: d.dataset.page * $('home-pages').clientWidth, behavior: 'smooth' }); });

// ===== Блокировка =====
function unlock(app) {
  state.unlocked = true;
  $('lockscreen').classList.add('hidden');
  $('homescreen').classList.remove('hidden');
  renderHome();
  if (app) openApp(app);
}
function lock() {
  closeApp(); closeShade(); closeDrawer();
  state.unlocked = false;
  $('lockscreen').classList.remove('hidden');
  $('homescreen').classList.add('hidden');
}
$('unlock-area').addEventListener('click', () => unlock());
document.querySelectorAll('[data-lockapp]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); unlock(b.dataset.lockapp); }));
$('lock-now').addEventListener('click', e => { e.stopPropagation(); unlock('music'); });
$('power-btn').addEventListener('click', () => state.unlocked ? lock() : unlock());

// ===== Шторка и быстрые настройки =====
const QS = [
  { k: 'wifi', name: 'Wi-Fi', on: 'Подключено', icon: '<svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.07 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4l2 2a7.07 7.07 0 0 1 10 0l2-2C16.07 9.07 7.93 9.07 5 13z"/></svg>' },
  { k: 'mobile', name: 'Моб. данные', on: '5G', icon: '<svg viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>' },

$('phone').addEventListener('pointerup', e => {
  if (!g) return;
  const k = $('phone').getBoundingClientRect().height / $('phone').offsetHeight, H = $('phone').offsetHeight;
  const dy = (e.clientY - g.y) / k, dx = Math.abs(e.clientX - g.x) / k, s = g; g = null;
  if (dx > Math.abs(dy) || Math.abs(dy) < 60 || s.t.closest('input, textarea, .bar-track, .app-content, .drawer-grid, .notif-section')) return;
  if (!state.unlocked) { if (dy < -80) unlock(); return; }
  if (dy > 0 && s.ly < 80 && !state.shade) openShade();
  else if (dy < 0 && state.shade) closeShade();
  else if (dy < 0 && state.app && s.ly > H - 90) closeApp();

  else if (dy > 0 && state.drawer) closeDrawer();
});

});

APPS.calculator = {
  enter() { views.calc = views.calc || { cur: '0', prev: null, op: null, fresh: false, err: false, hist: '' }; },
  view() {
    const v = views.calc;
    const btns = [['C', 1], ['±', 1], ['%', 1], ['÷', 1], ['7'], ['8'], ['9'], ['×', 1], ['4'], ['5'], ['6'], ['−', 1], ['1'], ['2'], ['3'], ['+', 1], ['0', 0, 1], [','], ['=', 1]];
    const fmt = s => { if (v.err) return 'Ошибка'; const n = parseFloat(s); if (Math.abs(n) >= 1e9 || (n !== 0 && Math.abs(n) < 1e-7)) return n.toExponential(4).replace('.', ','); const [x, y] = s.split('.'); return x.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (y !== undefined ? ',' + y : ''); };
    const shown = fmt(v.cur);
    return shell('Калькулятор', '<div style="display:flex;flex-direction:column;height:100%"><div style="flex:1;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end">' +
      '<div style="color:rgba(255,255,255,0.5);font-size:18px;min-height:22px">' + esc(v.hist) + '</div><div id="calc-display" style="color:#fff;font-size:' + Math.min(56, Math.floor(330 / Math.max(5, shown.length * 0.6))) + 'px;font-weight:200;white-space:nowrap">' + shown + '</div></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 18px">' + btns.map(([t2, op, wide]) => '<button data-a="k" data-k="' + t2 + '" style="' + (wide ? 'grid-column:span 2;' : '') + 'aspect-ratio:' + (wide ? '2.2/1' : '1') + ';border-radius:999px;border:none;background:' + (op ? '#fbbf24' : 'rgba(255,255,255,0.08)') + ';color:' + (op ? '#000' : '#fff') + ';font-size:26px;cursor:pointer">' + t2 + '</button>').join('') + '</div></div>');
  },
  press(k) {
    const v = views.calc, num = x => String(parseFloat(x.toPrecision(10)));
    const compute = () => { const a = parseFloat(v.prev), b = parseFloat(v.cur); const r = v.op === '+' ? a + b : v.op === '−' ? a - b : v.op === '×' ? a * b : b === 0 ? NaN : a / b; if (!isFinite(r)) { v.err = true; return '0'; } return num(r); };
    if (v.err && k !== 'C') { v.err = false; v.cur = '0'; v.prev = null; v.op = null; v.hist = ''; }
    if (/^\d$/.test(k)) { if (v.fresh || v.cur === '0') { v.cur = k; v.fresh = false; } else if (v.cur.replace(/[-.]/g, '').length < 9) v.cur += k; }
    else if (k === ',') { if (v.fresh) { v.cur = '0.'; v.fresh = false; } else if (!v.cur.includes('.')) v.cur += '.'; }
    else if (k === 'C') { Object.assign(v, { cur: '0', prev: null, op: null, fresh: false, err: false, hist: '' }); }
    else if (k === '±') { if (v.cur !== '0') v.cur = v.cur.startsWith('-') ? v.cur.slice(1) : '-' + v.cur; }
    else if (k === '%') v.cur = num(parseFloat(v.cur) / 100);
    else if (k === 'back') { if (!v.fresh) v.cur = v.cur.length > 1 && !/^-\d$/.test(v.cur) ? v.cur.slice(0, -1) : '0'; }
    else if ('+−×÷'.includes(k)) { if (v.op && !v.fresh) v.cur = compute(); v.prev = v.cur; v.op = k; v.fresh = true; v.hist = v.prev.replace('.', ',') + ' ' + k; }
    else if (k === '=') { if (v.op) { v.hist = v.prev.replace('.', ',') + ' ' + v.op + ' ' + v.cur.replace('.', ',') + ' ='; v.cur = compute(); v.op = null; v.prev = null; v.fresh = true; } }
    renderApp();
  },
  act(a, t) { if (a === 'k') this.press(t.dataset.k); },
  key(e) { const m = { Enter: '=', '=': '=', Backspace: 'back', Delete: 'C', '.': ',', ',': ',', '+': '+', '-': '−', '*': '×', '/': '÷', '%': '%' }; const k = /^\d$/.test(e.key) ? e.key : m[e.key]; if (k) { e.preventDefault(); this.press(k); } },
};

  enter() { views.mail = { open: -1 }; },
  view() {
    const read = store.get('mailRead', []), v = views.mail;
    if (v.open >= 0) { const l = this.LETTERS[v.open]; return shell('Письмо', '<div class="b-page"><h2>' + esc(l.subj) + '</h2><div class="o-sub" style="margin-bottom:14px">' + esc(l.from) + '</div>' + l.body.map(p => '<p style="margin-bottom:10px">' + esc(p) + '</p>').join('') + '</div>'); }
    const unread = this.LETTERS.filter((_, i) => !read.includes(i)).length;
    return shell('Почта', '<div style="padding:0 20px 10px;color:rgba(255,255,255,0.7);font-size:12px">' + (unread ? 'Непрочитанных: ' + unread : 'Все письма прочитаны') + '</div>' +
      this.LETTERS.map((l, i) => '<div class="o-list-row" data-a="open" data-i="' + i + '"><div class="o-av" style="background:' + l.color + '">' + esc(l.from[0]) + '</div><div class="o-main"><div class="o-title" style="font-weight:' + (read.includes(i) ? 400 : 600) + '">' + esc(l.from) + '</div><div class="o-sub">' + esc(l.subj) + '</div></div>' + (read.includes(i) ? '' : '<div style="width:8px;height:8px;border-radius:50%;background:#60a5fa"></div>') + '</div>').join(''));
  },
  act(a, t) { if (a === 'open') { const i = +t.dataset.i, read = store.get('mailRead', []); if (!read.includes(i)) { read.push(i); store.set('mailRead', read); } views.mail.open = i; renderApp(); } },
  back() { if (views.mail.open >= 0) { views.mail.open = -1; renderApp(); return true; } },
};

// ===== Масштаб: телефон целиком помещается в окно =====
function fit() {
  const p = $('phone');
  if (innerWidth <= 430) { p.style.transform = ''; return; }
  p.style.transform = 'scale(' + Math.min(1, (innerHeight - 40) / (820 + 22), (innerWidth - 40) / (380 + 22)) + ')';
}
addEventListener('resize', fit);

// ===== Запуск =====
renderHome();
renderNotifs();
applySettings();
tick();
mStatus();
fit();
</script>
</body>
</html>
