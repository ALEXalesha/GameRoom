<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космический стрелок</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05060f; }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; user-select: none; }
  #game { display: block; touch-action: none; }
  #game.playing { cursor: none; }
  .shop-row { display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .shop-row small { color: var(--kit-dim); display: block; }
  .pips { letter-spacing: 3px; color: #00e5ff; }
  .pips i { font-style: normal; color: rgba(255,255,255,.2); }
  .credits { font-size: 18px; color: #7dffb2; font-weight: 700; }
</style>
</head>
<body>
<div id="app"><canvas id="game" aria-label="Игровое поле"></canvas></div>
<script src="kit.js"></script>
<script>
'use strict';
const W = 1280, H = 720, STEP_MS = 1000 / 60;
const params = new URLSearchParams(location.search);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = params.has('seed') ? mulberry32(Number(params.get('seed')) || 1) : Math.random;
const pick = (a) => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

// ================= Кампания: 8 секторов, в каждом 3 волны и в конце босс или элитное звено =================
const SECTORS = [
  { name: 'Пояс Ориона', neb: ['#1a2a6c', '#3b1d5e'], planet: '#6a8dff', waves: [{ scout: 6 }, { scout: 8 }, { scout: 8, fighter: 2 }], asteroids: 4, end: 'elite' },
  { name: 'Туманность Стражей', neb: ['#5e1d4f', '#1d2a5e'], planet: '#ff6b9d', waves: [{ scout: 6, fighter: 2 }, { scout: 6, fighter: 4 }, { fighter: 6 }], asteroids: 2, end: 'guardian' },
  { name: 'Красный рукав', neb: ['#6c1a1a', '#3d1d5e'], planet: '#ff8c42', waves: [{ fighter: 4, kamikaze: 4 }, { kamikaze: 8, scout: 4 }, { fighter: 5, kamikaze: 6 }], asteroids: 5, end: 'elite' },
  { name: 'Гнездо роя', neb: ['#1d4d1a', '#1a2d5e'], planet: '#9dff4d', waves: [{ tank: 2, scout: 8 }, { tank: 3, kamikaze: 6 }, { tank: 3, fighter: 4 }], asteroids: 0, end: 'hive' },
  { name: 'Ледяное облако', neb: ['#1a4d6c', '#2d1d5e'], planet: '#8ff0ff', waves: [{ sniper: 3, scout: 6 }, { sniper: 4, fighter: 4 }, { sniper: 4, kamikaze: 6 }], asteroids: 6, end: 'elite' },
  { name: 'Верфь крейсеров', neb: ['#1a1a4d', '#4d3a1a'], planet: '#4db8ff', waves: [{ tank: 3, sniper: 3 }, { fighter: 7, kamikaze: 6 }, { tank: 3, sniper: 3, fighter: 3 }], asteroids: 0, end: 'cruiser' },
  { name: 'Мёртвая звезда', neb: ['#3a0d0d', '#0d0d3a'], planet: '#c2c2c2', waves: [{ fighter: 5, sniper: 3, kamikaze: 4 }, { tank: 4, kamikaze: 8 }, { elite: 1, fighter: 5, sniper: 3 }], asteroids: 8, end: 'elite' },
  { name: 'Ядро', neb: ['#4d3a00', '#4d0033'], planet: '#ffcc33', waves: [{ fighter: 6, sniper: 4 }, { tank: 4, kamikaze: 8, scout: 6 }], asteroids: 0, end: 'core' },
];

const ETYPES = {
  scout: { hp: 20, speed: 2.2, r: 14, dmg: 8, color: '#ff5a5a', score: 50, credits: 8 },
  fighter: { hp: 40, speed: 1.6, r: 18, dmg: 12, color: '#ff9a3c', score: 100, credits: 14, shoot: 95, keep: 260 },
  tank: { hp: 110, speed: 0.8, r: 26, dmg: 16, color: '#b45cff', score: 200, credits: 28, shoot: 130, spread: 3, keep: 330 },
  kamikaze: { hp: 14, speed: 1.2, r: 12, dmg: 22, color: '#ffe14d', score: 60, credits: 10 },
  sniper: { hp: 35, speed: 1.2, r: 16, dmg: 20, color: '#4de1ff', score: 150, credits: 22, keep: 470 },
  elite: { hp: 260, speed: 1.4, r: 28, dmg: 16, color: '#ff4dd2', score: 400, credits: 60, shoot: 42, keep: 300 },
};
const BOSSES = {
  guardian: { name: 'Страж', hp: 900, r: 62, color: '#ff0066', credits: 300 },
  hive: { name: 'Рой-матка', hp: 1300, r: 72, color: '#9dff4d', credits: 450 },
  cruiser: { name: 'Крейсер «Гроза»', hp: 1700, r: 60, w: 440, h: 90, color: '#4db8ff', credits: 600 },
  core: { name: 'Ядро', hp: 2600, r: 82, color: '#ffcc33', credits: 1000 },
};

// ================= Магазин =================
const WEAPONS = [
  { name: 'Одиночный', cd: 12, dmg: 10, shots: [[0, 0]] },
  { name: 'Двойной', cd: 11, dmg: 10, shots: [[-0.06, 0], [0.06, 0]] },
  { name: 'Тройной', cd: 11, dmg: 10, shots: [[-0.14, 0], [0, 0], [0.14, 0]] },
  { name: 'Веер', cd: 14, dmg: 9, shots: [[-0.36, 0], [-0.18, 0], [0, 0], [0.18, 0], [0.36, 0]] },
  { name: 'Лазер-спарка', cd: 6, dmg: 12, shots: [[0, -7], [0, 7]] },
];
const UPGRADES = {
  weapon: { name: 'Оружие', desc: (l) => WEAPONS[Math.min(l + 1, 4)].name, prices: [150, 300, 500, 800] },
  damage: { name: 'Урон', desc: () => '+15% к урону каждого выстрела', prices: [120, 240, 400] },
  shield: { name: 'Броня', desc: () => '+25 к запасу прочности', prices: [100, 200, 350, 550] },
  speed: { name: 'Двигатели', desc: () => '+12% к скорости и манёвру', prices: [80, 160, 300] },
  rate: { name: 'Скорострельность', desc: () => '-10% к паузе между выстрелами', prices: [120, 250, 420] },
};
const REPAIR_PRICE = 40, BOMB_PRICE = 60, MAX_BOMBS = 3;
const HUD_BOTTOM = 72;          // ниже полос прочности, кредитов и полосы босса

// ================= Состояние =================
const S = {
  mode: 'demo', phase: 'fight', sector: 0, wave: 0, queue: [], spawnT: 0, banner: null, bossName: '',
  credits: 0, bombs: 1, up: { weapon: 0, damage: 0, shield: 0, speed: 0, rate: 0 },
  stats: { kills: 0, shots: 0, hits: 0, dmgTaken: 0, steps: 0, credits: 0 },
  frame: 0, shake: 0, flash: 0, sectorDamage: 0, survivalWave: 0, clearedT: 0,
};
const P = { x: W / 2, y: H * 0.7, vx: 0, vy: 0, r: 16, hp: 100, maxHp: 100, angle: -Math.PI / 2, cd: 0, invuln: 0, overdrive: 0 };
let bullets = [], ebullets = [], enemies = [], asteroids = [], particles = [], pickups = [], beams = [];
let boss = null;
let kit;
let progress = { sector: 0, maxSector: 0, done: false, up: null, credits: 0, bombs: 1, hp: 100 };
let records = { survival: 0, survivalScore: 0, bestTime: {}, kills: 0 };
let mouse = { x: W / 2, y: H / 3, held: false, lastMove: -1e9 };

function maxHp() { return 100 + 25 * S.up.shield; }
function dmgMul() { return 1 + 0.15 * S.up.damage; }
function takenMul() { return kit.diff({ easy: 0.6, normal: 1, hard: 1.4 }); }
function enemyHpMul() { return kit.diff({ easy: 0.8, normal: 1, hard: 1.25 }) * (1 + 0.08 * S.sector); }
function enemyFireMul() { return kit.diff({ easy: 1.35, normal: 1, hard: 0.8 }); }

// ================= Звуки =================
let lastShotSnd = 0;
const SFX = {
  shot() { const n = performance.now(); if (n - lastShotSnd > 70) { lastShotSnd = n; kit.tone(880, 0.05, { vol: 0.03, slide: 440 }); } },
  hit() { kit.tone(300, 0.05, { type: 'square', vol: 0.04, slide: 200 }); },
  boom(big) { kit.noise(big ? 0.7 : 0.3, { vol: big ? 0.35 : 0.18, freq: big ? 500 : 900 }); },
  hurt() { kit.tone(160, 0.2, { type: 'sawtooth', vol: 0.1, slide: 70 }); },
  pickup() { kit.tone(660, 0.07, { type: 'triangle', vol: 0.08 }); kit.tone(990, 0.1, { type: 'triangle', vol: 0.08, delay: 0.06 }); },
  bomb() { kit.noise(1.0, { vol: 0.4, freq: 300 }); kit.tone(80, 0.8, { type: 'sine', vol: 0.3, slide: 30 }); },
  laser() { kit.tone(120, 0.6, { type: 'sawtooth', vol: 0.06, slide: 90 }); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => kit.tone(f, 0.18, { type: 'triangle', vol: 0.1, delay: i * 0.12 })); },
};

// ================= Запуск =================
function resetArena() {
  bullets = []; ebullets = []; enemies = []; asteroids = []; particles = []; pickups = []; beams = [];
  boss = null; S.banner = null; S.shake = 0; S.flash = 0;
}
function applyUpgrades(fillHp) {
  P.maxHp = maxHp();
  if (fillHp) P.hp = P.maxHp; else P.hp = Math.min(P.hp, P.maxHp);
}
function newCampaignState() {
  S.up = { weapon: 0, damage: 0, shield: 0, speed: 0, rate: 0 };
  S.credits = 0; S.bombs = kit.diff({ easy: 2, normal: 1, hard: 1 });
  S.stats = { kills: 0, shots: 0, hits: 0, dmgTaken: 0, steps: 0, credits: 0 };
}
// Контрольная точка - начало сектора: улучшения, кредиты, бомбы и прочность на тот момент
function saveCheckpoint(sector) {
  progress.sector = sector;
  progress.maxSector = Math.max(progress.maxSector, sector);
  progress.up = { ...S.up }; progress.credits = S.credits; progress.bombs = S.bombs; progress.hp = P.hp;
  progress.stats = { ...S.stats };
  kit.save('progress', progress);
}
function startSector(i, fromCheckpoint) {
  resetArena();
  S.mode = 'campaign';
  S.sector = i; S.wave = 0; S.sectorDamage = 0;
  if (fromCheckpoint && progress.up) {
    S.up = { ...progress.up }; S.credits = progress.credits; S.bombs = progress.bombs;
    if (progress.stats) S.stats = { ...progress.stats };
    applyUpgrades(true);
  } else if (fromCheckpoint) { newCampaignState(); applyUpgrades(true); }   // мастерской ещё не было: чистый корабль, а не корабль заставки
  else applyUpgrades(false);
  Object.assign(P, { x: W / 2, y: H * 0.72, vx: 0, vy: 0, invuln: 60, cd: 0, overdrive: 0 });
  for (let k = 0; k < SECTORS[i].asteroids; k++) spawnAsteroid();
  startWave();
  kit.play();
}
function startCampaign(sector) {
  if (sector === undefined) { newCampaignState(); applyUpgrades(true); saveCheckpoint(0); startSector(0, false); return; }
  startSector(sector, true);
}
function startSurvival() {
  resetArena();
  newCampaignState(); applyUpgrades(true);
  S.mode = 'survival'; S.sector = 0; S.survivalWave = 0; S.wave = 0;
  Object.assign(P, { x: W / 2, y: H * 0.72, vx: 0, vy: 0, invuln: 60, cd: 0, overdrive: 0 });
  for (let k = 0; k < 4; k++) spawnAsteroid();
  startWave();
  kit.play();
}
function startDemo() {
  resetArena();
  newCampaignState(); S.up.weapon = 2; applyUpgrades(true);
  S.mode = 'demo'; S.sector = 0; S.wave = 0;
  for (let k = 0; k < 3; k++) spawnAsteroid();
  S.queue = []; S.phase = 'fight';
}

function waveDef() {
  if (S.mode === 'survival') {
    const n = S.survivalWave, types = ['scout', 'fighter', 'kamikaze', 'tank', 'sniper'];
    const d = {};
    for (let i = 0; i < 6 + n * 2; i++) { const t = types[Math.min(types.length - 1, Math.floor(rnd() * (2 + n / 2)))]; d[t] = (d[t] || 0) + 1; }
    return d;
  }
  return SECTORS[S.sector].waves[S.wave];
}
function startWave() {
  S.phase = 'fight';
  const d = waveDef();
  S.queue = [];
  for (const t in d) for (let i = 0; i < d[t]; i++) S.queue.push(t);
  for (let i = S.queue.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [S.queue[i], S.queue[j]] = [S.queue[j], S.queue[i]]; }
  S.spawnT = 40;
  const total = S.mode === 'survival' ? '∞' : SECTORS[S.sector].waves.length;
  S.banner = { text: S.mode === 'survival' ? `Волна ${S.survivalWave + 1}` : `Сектор ${S.sector + 1}: ${SECTORS[S.sector].name} · волна ${S.wave + 1}/${total}`, t: 130 };
}
function startFinale() {
  const end = S.mode === 'survival' ? (S.survivalWave % 4 === 3 ? pick(['guardian', 'hive']) : 'elite') : SECTORS[S.sector].end;
  S.phase = 'boss';
  if (end === 'elite') {
    for (let i = 0; i < 3; i++) spawnEnemy('elite', 200 + i * 440, -60 - i * 30);
    S.bossName = 'Элитное звено';
    S.banner = { text: 'Элитное звено!', t: 120 };
  } else {
    spawnBoss(end);
    S.banner = { text: 'Внимание: ' + BOSSES[end].name + '!', t: 140 };
  }
}

// ================= Порождение =================
function edgePoint(m) {
  const s = Math.floor(rnd() * 3);            // сверху и с боков: снизу - в спину игроку нечестно
  if (s === 0) return { x: rnd() * W, y: -m };
  if (s === 1) return { x: W + m, y: rnd() * H * 0.6 };
  return { x: -m, y: rnd() * H * 0.6 };
}
function spawnEnemy(type, x, y) {
  const d = ETYPES[type], p = x === undefined ? edgePoint(40) : { x, y };
  const hp = Math.round(d.hp * enemyHpMul());
  enemies.push({ type, x: p.x, y: p.y, vx: 0, vy: 0, hp, maxHp: hp, r: d.r, angle: Math.PI / 2, t: Math.floor(rnd() * 60), strafe: rnd() < 0.5 ? 1 : -1, aim: 0, aimDir: 0, flash: 0 });
}
function spawnBoss(kind) {
  const d = BOSSES[kind], hp = Math.round(d.hp * kit.diff({ easy: 0.8, normal: 1, hard: 1.2 }));
  boss = { kind, name: d.name, x: W / 2, y: -140, targetY: kind === 'cruiser' ? 110 : 170, hp, maxHp: hp, r: d.r, w: d.w || 0, h: d.h || 0, color: d.color, t: 0, pattern: 0, dir: 1, angle: 0, flash: 0 };
  S.bossName = d.name;
}
function asteroidShape(size) {
  const pts = [], n = 8 + Math.floor(rnd() * 5);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = size * (0.72 + rnd() * 0.36); pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
  return pts;
}
function spawnAsteroid(x, y, size) {
  if (asteroids.length >= 14) return;
  const p = x === undefined ? edgePoint(60) : { x, y };
  size = size || 22 + rnd() * 36;
  asteroids.push({ x: p.x, y: p.y, vx: (rnd() - 0.5) * 1.6, vy: 0.3 + rnd() * 0.9, size, hp: size * 1.5, maxHp: size * 1.5, rot: 0, rs: (rnd() - 0.5) * 0.05, pts: asteroidShape(size) });
}
function burst(x, y, color, n, speed = 4, life = 40) {
  if (!kit.settings.effects) return;
  if (particles.length > 700) return;
  for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, v = rnd() * speed + 0.5; particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.5 + rnd() * 0.5), max: life, color, r: 1 + rnd() * 2.5 }); }
}
function shake(v) { if (kit.settings.shake) S.shake = Math.max(S.shake, v); }

// ================= Игрок =================
function aimAngle() {
  const pad = kit.pad();
  if (pad && Math.hypot(pad.axes[2] || 0, pad.axes[3] || 0) > 0.35) return Math.atan2(pad.axes[3], pad.axes[2]);
  const mouseActive = performance.now() - mouse.lastMove < 2500 && !kit.settings.autoAim;
  if (S.mode === 'demo' || kit.settings.autoAim || !mouseActive && pad) {
    const t = nearestTarget();
    if (t) return Math.atan2(t.y - P.y, t.x - P.x);
    return P.angle;
  }
  return Math.atan2(mouse.y - P.y, mouse.x - P.x);
}
function nearestTarget() {
  let best = null, bd = Infinity;
  for (const e of enemies) { const d = dist2(e, P); if (d < bd && e.y > -20) { bd = d; best = e; } }
  if (boss && boss.y > 0) { const d = dist2(boss, P) * 0.6; if (d < bd) best = boss; }
  return best;
}
function fire() {
  const wp = WEAPONS[S.up.weapon];
  const rate = (1 - 0.1 * S.up.rate) * (P.overdrive > 0 ? 0.5 : 1);
  P.cd = Math.max(3, Math.round(wp.cd * rate));
  const dmg = wp.dmg * dmgMul();
  for (const [da, off] of wp.shots) {
    const a = P.angle + da, nx = -Math.sin(P.angle), ny = Math.cos(P.angle);
    bullets.push({ x: P.x + Math.cos(a) * 22 + nx * off, y: P.y + Math.sin(a) * 22 + ny * off, vx: Math.cos(a) * 13, vy: Math.sin(a) * 13, dmg, life: 70, color: S.up.weapon === 4 ? '#ff4dff' : '#00e5ff' });
  }
  S.stats.shots++;
  if (S.mode !== 'demo') SFX.shot();
}
function useBomb() {
  if (S.bombs <= 0) return false;
  S.bombs--;
  ebullets = []; beams = beams.filter((b) => b.t > 0 && false);
  for (const e of enemies) e.hp -= 60 * dmgMul();
  for (const a of asteroids) a.hp -= 80;
  if (boss) boss.hp -= 150 * dmgMul();
  S.flash = 20; shake(18);
  burst(P.x, P.y, '#ffffff', 60, 9, 50);
  SFX.bomb();
  return true;
}
function damagePlayer(amount, color) {
  if (P.invuln > 0 || S.mode === 'demo') return;
  const dmg = amount * takenMul();
  P.hp -= dmg; S.stats.dmgTaken += dmg; S.sectorDamage += dmg;
  P.invuln = 36;
  burst(P.x, P.y, color || '#ff3355', 14, 5);
  shake(8);
  SFX.hurt();
}

function updatePlayer() {
  let mx = 0, my = 0;
  if (S.mode === 'demo') {
    const t = S.frame / 90;
    const tx = W / 2 + Math.cos(t) * 360, ty = H * 0.62 + Math.sin(t * 2) * 110;
    mx = clamp((tx - P.x) / 60, -1, 1); my = clamp((ty - P.y) / 60, -1, 1);
  } else {
    mx = (kit.isDown('right') ? 1 : 0) - (kit.isDown('left') ? 1 : 0);
    my = (kit.isDown('down') ? 1 : 0) - (kit.isDown('up') ? 1 : 0);
    const pad = kit.pad();
    if (pad && Math.hypot(pad.axes[0], pad.axes[1]) > 0.25) { mx = pad.axes[0]; my = pad.axes[1]; }
  }
  const acc = 0.55 * (1 + 0.12 * S.up.speed);
  P.vx = (P.vx + mx * acc) * 0.88; P.vy = (P.vy + my * acc) * 0.88;
  P.x = clamp(P.x + P.vx, P.r, W - P.r); P.y = clamp(P.y + P.vy, HUD_BOTTOM + P.r, H - P.r);
  P.angle = aimAngle();
  if (P.cd > 0) P.cd--;
  if (P.invuln > 0) P.invuln--;
  if (P.overdrive > 0) P.overdrive--;
  const firing = S.mode === 'demo' ? enemies.length > 0 || !!boss : kit.isDown('fire') || mouse.held;
  if (firing && P.cd === 0) fire();
  if (S.mode !== 'demo' && kit.wasPressed('bomb')) useBomb();
  if (kit.settings.effects && S.frame % 2 === 0) particles.push({ x: P.x - Math.cos(P.angle) * 16, y: P.y - Math.sin(P.angle) * 16, vx: -Math.cos(P.angle) * 2 + (rnd() - 0.5), vy: -Math.sin(P.angle) * 2 + (rnd() - 0.5), life: 14, max: 14, color: '#ff9a3c', r: 2 });
}

// ================= Враги =================
function enemyShoot(e, speed, spread, count, color) {
  const base = Math.atan2(P.y - e.y, P.x - e.x);
  for (let i = 0; i < count; i++) {
    const a = base + (count === 1 ? 0 : (i - (count - 1) / 2) * spread);
    ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, dmg: ETYPES[e.type] ? ETYPES[e.type].dmg : 14, r: 5, color, life: 240 });
  }
}
function updateEnemies() {
  for (const e of enemies) {
    const d = ETYPES[e.type];
    e.t++;
    if (e.flash > 0) e.flash--;
    const dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy) || 1;
    e.angle = Math.atan2(dy, dx);
    if (e.type === 'scout') {
      e.vx += (dx / dist * d.speed - e.vx) * 0.08; e.vy += (dy / dist * d.speed - e.vy) * 0.08;
    } else if (e.type === 'kamikaze') {
      e.vx += dx / dist * 0.14; e.vy += dy / dist * 0.14;
      const sp = Math.hypot(e.vx, e.vy), max = 6.5;
      if (sp > max) { e.vx *= max / sp; e.vy *= max / sp; }
    } else {
      let tvx = 0, tvy = 0;
      if (dist > d.keep + 40) { tvx = dx / dist * d.speed; tvy = dy / dist * d.speed; }
      else if (dist < d.keep - 40) { tvx = -dx / dist * d.speed; tvy = -dy / dist * d.speed; }
      else { tvx = -dy / dist * d.speed * e.strafe; tvy = dx / dist * d.speed * e.strafe; }
      e.vx += (tvx - e.vx) * 0.05; e.vy += (tvy - e.vy) * 0.05;
      if (e.x < 40 || e.x > W - 40) e.strafe *= -1;
      if (e.type === 'sniper') {
        if (e.aim > 0) {
          if (--e.aim === 0) { ebullets.push({ x: e.x, y: e.y, vx: Math.cos(e.aimDir) * 11, vy: Math.sin(e.aimDir) * 11, dmg: d.dmg, r: 5, color: '#4de1ff', life: 200 }); e.t = 0; }
        } else if (e.t > 130 * enemyFireMul() && e.y > 0) { e.aim = 60; e.aimDir = e.angle; }
      } else if (d.shoot && e.t >= d.shoot * enemyFireMul() && e.y > 0 && dist < 700) {
        e.t = 0;
        if (e.type === 'elite') enemyShoot(e, 5, 0.18, 5, d.color);
        else enemyShoot(e, e.type === 'tank' ? 4 : 5, 0.25, d.spread || 1, d.color);
      }
    }
    e.x += e.vx; e.y += e.vy;
    if (e.type !== 'kamikaze') { e.x = clamp(e.x, -80, W + 80); e.y = clamp(e.y, -120, H - 60); }
    if (dist < e.r + P.r) {
      damagePlayer(d.dmg, d.color);
      if (e.type === 'kamikaze') { e.hp = 0; burst(e.x, e.y, d.color, 20, 6); } else e.hp -= 30;
    }
  }
}

// ================= Боссы =================
function bossBullet(x, y, a, sp, color, dmg = 14, r = 6) { ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg, r, color, life: 300 }); }
function updateBoss() {
  const b = boss;
  b.t++;
  if (b.flash > 0) b.flash--;
  if (b.y < b.targetY) { b.y += 1.6; return; }
  const toP = Math.atan2(P.y - b.y, P.x - b.x);
  const fm = enemyFireMul();
  b.angle += 0.02;
  if (b.kind === 'guardian') {
    b.x += b.dir * 1.6; if (b.x > W - 140 || b.x < 140) b.dir *= -1;
    if (b.t % 240 === 0) b.pattern = (b.pattern + 1) % 3;
    if (b.pattern === 0 && b.t % Math.round(32 * fm) === 0) for (let i = -1; i <= 1; i++) bossBullet(b.x, b.y, toP + i * 0.2, 6, b.color);
    if (b.pattern === 1 && b.t % Math.round(60 * fm) === 0) for (let i = 0; i < 14; i++) bossBullet(b.x, b.y, i / 14 * Math.PI * 2 + b.angle, 4, b.color);
    if (b.pattern === 2 && b.t % Math.round(7 * fm) === 0) bossBullet(b.x, b.y, b.angle * 3, 4.5, '#ff66aa');
  } else if (b.kind === 'hive') {
    b.x = W / 2 + Math.sin(b.t / 90) * 380; b.y = b.targetY + Math.sin(b.t / 45) * 30;
    if (b.t % Math.round(150 * fm) === 0 && enemies.length < 8) { spawnEnemy('kamikaze', b.x - 50, b.y + 40); spawnEnemy('kamikaze', b.x + 50, b.y + 40); }
    if (b.t % Math.round(70 * fm) === 0) for (let i = -3; i <= 3; i++) bossBullet(b.x, b.y + 30, Math.PI / 2 + i * 0.22, 4.5, b.color);
    if (b.t % Math.round(45 * fm) === 0) bossBullet(b.x, b.y, toP, 6.5, '#d4ff8a');
  } else if (b.kind === 'cruiser') {
    b.x += b.dir * 1.2; if (b.x > W - 250 || b.x < 250) b.dir *= -1;
    if (b.t % Math.round(50 * fm) === 0) for (const side of [-1, 1]) { const cx = b.x + side * 190; bossBullet(cx, b.y + 30, Math.atan2(P.y - b.y, P.x - cx), 6, b.color); }
    if (b.t % Math.round(300 * fm) === 0) { beams.push({ x1: P.x, y1: b.y + 45, x2: P.x, y2: H + 20, t: 70, life: 40, w: 30, dmg: 18 }); SFX.laser(); }
    if (b.t % Math.round(110 * fm) === 0) for (let i = 0; i < 6; i++) bossBullet(b.x - 150 + i * 60, b.y + 40, Math.PI / 2, 3.5, '#9fdcff');
  } else if (b.kind === 'core') {
    const phase = b.hp > b.maxHp * 0.66 ? 0 : b.hp > b.maxHp * 0.33 ? 1 : 2;
    b.x = W / 2 + Math.sin(b.t / 120) * 260;
    if (b.t % Math.round((phase === 2 ? 36 : 54) * fm) === 0) for (let i = 0; i < 16; i++) bossBullet(b.x, b.y, i / 16 * Math.PI * 2 + b.angle, 3.8, b.color);
    if (phase >= 1 && b.t % Math.round(8 * fm) === 0) { bossBullet(b.x, b.y, b.angle * 2.3, 4.2, '#ff8a3d'); bossBullet(b.x, b.y, b.angle * 2.3 + Math.PI, 4.2, '#ff8a3d'); }
    if (phase === 2 && b.t % Math.round(200 * fm) === 0) { beams.push({ x1: b.x, y1: b.y, x2: b.x + Math.cos(toP) * 1600, y2: b.y + Math.sin(toP) * 1600, t: 60, life: 35, w: 26, dmg: 20 }); SFX.laser(); }
    if (phase === 2 && b.t % Math.round(260 * fm) === 0 && enemies.length < 6) spawnEnemy('kamikaze', b.x, b.y + 60);
    if (b.t % Math.round(40 * fm) === 0) bossBullet(b.x, b.y, toP, 6, '#fff3b0');
  }
  if (bossTouches(P.x, P.y, P.r)) damagePlayer(24, b.color);
}
function bossTouches(x, y, r) {
  const b = boss;
  if (b.kind === 'cruiser') return Math.abs(x - b.x) < b.w / 2 + r && Math.abs(y - b.y) < b.h / 2 + r;
  return (x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + r) ** 2;
}
function segDist(px, py, b) {
  const dx = b.x2 - b.x1, dy = b.y2 - b.y1, l2 = dx * dx + dy * dy;
  const t = clamp(((px - b.x1) * dx + (py - b.y1) * dy) / l2, 0, 1);
  return Math.hypot(px - (b.x1 + t * dx), py - (b.y1 + t * dy));
}

// ================= Шаг мира =================
function update() {
  S.frame++;
  if (S.shake > 0) S.shake *= 0.88;
  if (S.flash > 0) S.flash--;
  updateParticles();
  if (S.phase === 'dead' || S.phase === 'won' || S.phase === 'over') { if (S.phase === 'won' && S.frame % 8 === 0) fireworks(); return; }
  S.stats.steps++;
  updatePlayer();

  // пули игрока
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; }
  bullets = bullets.filter((b) => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  // пули врагов
  for (const b of ebullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    if ((b.x - P.x) ** 2 + (b.y - P.y) ** 2 < (b.r + P.r - 4) ** 2 && P.invuln === 0) { damagePlayer(b.dmg, b.color); b.life = 0; }
  }
  ebullets = ebullets.filter((b) => b.life > 0 && b.x > -40 && b.x < W + 40 && b.y > -40 && b.y < H + 40);
  // лучи: сначала предупреждение, потом урон
  for (const bm of beams) {
    if (bm.t > 0) bm.t--;
    else { bm.life--; if (segDist(P.x, P.y, bm) < bm.w / 2 + P.r - 4) damagePlayer(bm.dmg, '#8fe8ff'); }
  }
  beams = beams.filter((bm) => bm.t > 0 || bm.life > 0);

  updateEnemies();
  if (boss) updateBoss();
  for (const a of asteroids) {
    a.x += a.vx; a.y += a.vy; a.rot += a.rs;
    if (a.y > H + 80) { a.y = -60; a.x = rnd() * W; }
    if (a.x < -80) a.x = W + 60; if (a.x > W + 80) a.x = -60;
    if ((a.x - P.x) ** 2 + (a.y - P.y) ** 2 < (a.size * 0.72 + P.r) ** 2 && P.invuln === 0) {
      damagePlayer(12, '#aaaaaa');
      const ang = Math.atan2(P.y - a.y, P.x - a.x); P.vx += Math.cos(ang) * 6; P.vy += Math.sin(ang) * 6;
    }
  }

  // попадания: одна пуля - одна цель
  bullets = bullets.filter((b) => {
    for (const e of enemies) if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.r + 4) ** 2) { e.hp -= b.dmg; e.flash = 4; S.stats.hits++; burst(b.x, b.y, b.color, 3, 3, 16); return false; }
    if (boss && boss.y > -60 && bossTouches(b.x, b.y, 4)) { boss.hp -= b.dmg; boss.flash = 3; S.stats.hits++; burst(b.x, b.y, b.color, 3, 3, 16); return false; }
    for (const a of asteroids) if ((b.x - a.x) ** 2 + (b.y - a.y) ** 2 < (a.size * 0.72 + 4) ** 2) { a.hp -= b.dmg; burst(b.x, b.y, '#bbbbbb', 2, 2, 14); return false; }
    return true;
  });

  // гибель врагов, астероидов, босса
  enemies = enemies.filter((e) => {
    if (e.hp > 0) return true;
    const d = ETYPES[e.type];
    S.stats.kills++; records.kills++;
    gainCredits(d.credits); burst(e.x, e.y, d.color, 24, 5); SFX.boom(e.type === 'elite' || e.type === 'tank'); shake(e.type === 'elite' ? 8 : 3);
    dropPickup(e.x, e.y);
    return false;
  });
  const born = [];
  asteroids = asteroids.filter((a) => {
    if (a.hp > 0) return true;
    gainCredits(3); burst(a.x, a.y, '#aaaaaa', 14, 4);
    if (a.size > 32) for (let i = 0; i < 2; i++) born.push([a.x, a.y, a.size * 0.6]);
    return false;
  });
  for (const [x, y, s] of born) spawnAsteroid(x, y, s);
  if (boss && boss.hp <= 0) {
    gainCredits(BOSSES[boss.kind].credits);
    for (let i = 0; i < 6; i++) burst(boss.x + (rnd() - 0.5) * 120, boss.y + (rnd() - 0.5) * 80, boss.color, 30, 7, 60);
    SFX.boom(true); shake(24); S.flash = 14;
    if (S.mode !== 'demo') kit.unlock('boss_' + boss.kind);
    for (let i = 0; i < 3; i++) pickups.push({ x: boss.x + (rnd() - 0.5) * 120, y: boss.y, kind: 'crystal', vy: 1, t: 0 });
    boss = null; ebullets = []; beams = [];
  }

  // подбираемое: притягивается к кораблю
  for (const p of pickups) {
    p.t++;
    const d = Math.hypot(P.x - p.x, P.y - p.y);
    if (d < 130) { p.x += (P.x - p.x) / d * 5; p.y += (P.y - p.y) / d * 5; } else p.y += p.vy;
    if (d < P.r + 12) {
      p.t = 1e9;
      if (p.kind === 'health') P.hp = Math.min(P.maxHp, P.hp + 25);
      else if (p.kind === 'crystal') gainCredits(15);
      else if (p.kind === 'overdrive') P.overdrive = 480;
      if (S.mode !== 'demo') SFX.pickup();
    }
  }
  pickups = pickups.filter((p) => p.t < 900 && p.y < H + 30);

  if (S.banner && --S.banner.t <= 0) S.banner = null;
  if (P.hp <= 0 && S.mode !== 'demo') { playerDied(); return; }
  if (S.mode === 'demo') { demoDirector(); return; }
  progressWaves();
}

function gainCredits(n) { if (S.mode === 'demo') return; S.credits += n; S.stats.credits += n; }
function dropPickup(x, y) {
  const r = rnd();
  if (r < 0.1) pickups.push({ x, y, kind: 'health', vy: 1, t: 0 });
  else if (r < 0.3) pickups.push({ x, y, kind: 'crystal', vy: 1, t: 0 });
  else if (r < 0.34) pickups.push({ x, y, kind: 'overdrive', vy: 1, t: 0 });
}

function progressWaves() {
  if (S.phase === 'fight') {
    if (S.queue.length && --S.spawnT <= 0) { spawnEnemy(S.queue.shift()); S.spawnT = Math.round((32 + rnd() * 36) * kit.diff({ easy: 1.3, normal: 1, hard: 0.85 })); }
    if (!S.queue.length && !enemies.length) {
      if (S.mode === 'survival') {
        S.survivalWave++;
        if (S.survivalWave % 3 === 0 && S.up.weapon < 4) { S.up.weapon++; S.banner = { text: 'Оружие улучшено: ' + WEAPONS[S.up.weapon].name, t: 120 }; }
        if (S.survivalWave % 4 === 3) { startFinale(); return; }
        records.survival = Math.max(records.survival, S.survivalWave); kit.save('records', records);
        if (S.survivalWave >= 10) kit.unlock('survival10');
        startWave();
      } else if (S.wave + 1 < SECTORS[S.sector].waves.length) { S.wave++; startWave(); }
      else startFinale();
    }
  } else if (S.phase === 'boss') {
    if (!boss && !enemies.some((e) => e.type === 'elite') && S.clearedT === 0) {
      if (S.mode === 'survival') { S.survivalWave++; startWave(); return; }
      if (enemies.length) return;                     // сначала добить свиту
      S.phase = 'cleared'; S.clearedT = 150;
      S.banner = { text: `Сектор ${S.sector + 1} зачищен!`, t: 150 };
      SFX.fanfare();
    }
  } else if (S.phase === 'cleared') {
    if (--S.clearedT <= 0) { S.clearedT = 0; sectorCleared(); }
  }
}

function sectorCleared() {
  if (S.sectorDamage === 0) kit.unlock('untouched');
  if (S.stats.shots > 40 && S.stats.hits / S.stats.shots >= 0.7) kit.unlock('sniper');
  P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.4);          // между секторами - частичный ремонт
  if (kit.settings.difficulty === 'hard') progress.hardSec[S.sector] = true;
  if (S.sector === SECTORS.length - 1) { winCampaign(); return; }
  saveCheckpoint(S.sector + 1);
  kit.save('records', records);
  if (records.kills >= 500) kit.unlock('kills500');
  showShop();
}

function playerDied() {
  S.phase = 'dead';
  S.banner = null;
  burst(P.x, P.y, '#00e5ff', 60, 7, 70); burst(P.x, P.y, '#ff9a3c', 40, 5, 60);
  SFX.boom(true); shake(26);
  records.kills = records.kills; kit.save('records', records);
  kit.later(() => {
    S.phase = 'over';
    kit.mode = 'menu';
    if (S.mode === 'survival') {
      records.survival = Math.max(records.survival, S.survivalWave);
      records.survivalScore = Math.max(records.survivalScore, S.stats.credits);
      kit.save('records', records);
      kit.show({ id: 'over', title: 'Корабль уничтожен', html: statsHtml() + `<p>Пережито волн: <b>${S.survivalWave}</b> · рекорд: <b>${records.survival}</b></p>`, row: true,
        buttons: [{ label: 'Ещё раз', primary: true, id: 'again', onClick: startSurvival }, { label: 'В меню', id: 'menu', onClick: () => kit.toMenu() }] });
    } else {
      kit.show({ id: 'over', title: 'Корабль уничтожен', html: statsHtml() + `<p>Контрольная точка - начало сектора ${S.sector + 1} «${SECTORS[S.sector].name}» с улучшениями на тот момент.</p>`, row: true,
        buttons: [{ label: `Повторить сектор ${S.sector + 1}`, primary: true, id: 'again', onClick: () => startCampaign(S.sector) }, { label: 'В меню', id: 'menu', onClick: () => kit.toMenu() }] });
    }
  }, params.has('fast') ? 0 : 1300);
}

function winCampaign() {
  S.phase = 'won';
  S.banner = null;
  progress.done = true; progress.sector = SECTORS.length - 1; kit.save('progress', progress);
  const d = kit.settings.difficulty, secs = Math.round(S.stats.steps / 60);
  if (!records.bestTime[d] || secs < records.bestTime[d]) records.bestTime[d] = secs;
  kit.save('records', records);
  kit.unlock('campaign');
  // «Трудная кампания» - только если все сектора пройдены на трудной, а не последний из «Выбора сектора»
  if (SECTORS.every((_, i) => progress.hardSec[i])) kit.unlock('campaignHard');
  kit.save('progress', progress);
  SFX.fanfare();
  kit.later(showVictory, params.has('fast') ? 0 : 2200);
}

function demoDirector() {
  if (enemies.length < 5 && S.frame % 50 === 0) spawnEnemy(pick(['scout', 'fighter', 'kamikaze']));
  if (!boss && S.frame % 1800 === 900) spawnBoss(pick(['guardian', 'hive']));
  if (boss && boss.hp < boss.maxHp * 0.2) { boss.hp = 0; }
}
function fireworks() {
  if (!kit.settings.effects) return;
  burst(100 + rnd() * (W - 200), 80 + rnd() * 300, pick(['#ff5a8a', '#ffd34d', '#00e5ff', '#9dff4d', '#ff4dd2']), 30, 5, 60);
}

// ================= Экраны: магазин, победа, выбор сектора =================
function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function statsHtml() {
  const s = S.stats, acc = s.shots ? Math.round(100 * s.hits / s.shots) : 0;
  return `<table><tr><td>Сбито</td><td><b>${s.kills}</b></td></tr><tr><td>Точность</td><td>${acc}%</td></tr>
    <tr><td>Заработано кредитов</td><td>${s.credits}</td></tr><tr><td>Получено урона</td><td>${Math.round(s.dmgTaken)}</td></tr>
    <tr><td>Время в бою</td><td>${fmtTime(Math.round(s.steps / 60))}</td></tr></table>`;
}
function price(key) { const u = UPGRADES[key], l = S.up[key]; return l < u.prices.length ? u.prices[l] : null; }
function buy(key) {
  if (key === 'repair') { if (S.credits < REPAIR_PRICE || P.hp >= P.maxHp) return false; S.credits -= REPAIR_PRICE; P.hp = Math.min(P.maxHp, P.hp + 50); }
  else if (key === 'bomb') { if (S.credits < BOMB_PRICE || S.bombs >= MAX_BOMBS) return false; S.credits -= BOMB_PRICE; S.bombs++; }
  else {
    const p = price(key);
    if (p === null || S.credits < p) return false;

}

    row(key, u.name, desc, pips, p, p !== null && S.credits >= p);

  const def = { id: 'shop', title: 'Мастерская', node, wide: true, row: true, back: () => {},
    buttons: [{ label: `В бой: сектор ${S.sector + 2}`, primary: true, id: 'next', onClick: () => startCampaign(S.sector + 1) }, { label: 'В меню', id: 'menu', onClick: () => kit.toMenu() }] };
  if (kit.topId() === 'shop') kit.replace(def); else kit.show(def);
}
function refreshShop() { showShop(); }
function showVictory() {

    row: true, buttons: [{ label: 'Выживание', primary: true, onClick: startSurvival }, { label: 'В меню', id: 'menu', onClick: () => kit.toMenu() }] });

function showSectorSelect() {
  const node = document.createElement('div');
  node.innerHTML = '<p>Сектор открывается, когда до него долетели. Улучшения и кредиты - как на момент последней мастерской.</p>';
  const grid = document.createElement('div');
  grid.className = 'kit-grid';
  SECTORS.forEach((sc, i) => {

  credits: `<p><b>Космический стрелок</b> - часть «Игротеки».</p><p>Корабли, взрывы и туманности нарисованы кодом, музыка и звуки синтезируются WebAudio. Ни одного файла из интернета.</p>`,
  drawLogo(g, w, h, t) {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold 46px "Segoe UI", Arial, sans-serif';
    g.shadowColor = '#00e5ff'; g.shadowBlur = 18 + Math.sin(t * 3) * 6;
    g.fillStyle = '#e8feff'; g.fillText('КОСМИЧЕСКИЙ', w / 2, h * 0.36);
    g.shadowColor = '#ff2e88'; g.fillStyle = '#ff7ab8'; g.fillText('СТРЕЛОК', w / 2, h * 0.76);
    g.shadowBlur = 0;
    const keep = ctx; ctx = g;
    const px = P.x; P.x = 0;
    drawShip(96, h * 0.76 + Math.sin(t * 2) * 6, Math.sin(t * 2) * 0.3, false);        // по бокам короткого слова «СТРЕЛОК»
    drawShip(w - 96, h * 0.76 + Math.cos(t * 2) * 6, Math.PI + Math.cos(t * 2) * 0.3, false);
    P.x = px; ctx = keep;
  },
  game: {
    menuItems() {
      const items = [];
      if (progress.up && !progress.done && progress.sector > 0) items.push({ label: `Продолжить · сектор ${progress.sector + 1}`, primary: true, id: 'continue', onClick: () => startCampaign(progress.sector) });
      items.push({ label: progress.sector > 0 ? 'Кампания заново' : 'Кампания', primary: !(progress.up && !progress.done && progress.sector > 0), id: 'campaign', onClick: () => startCampaign() });
      items.push({ label: 'Выбор сектора', id: 'sectors', onClick: showSectorSelect });
      items.push({ label: 'Выживание', id: 'survival', onClick: startSurvival });
      return items;
    },
    musicFor() { return boss ? 'boss' : 'game'; },
    onRestart() { if (S.mode === 'survival') startSurvival(); else startCampaign(S.sector); },
    onQuit() { startDemo(); },
    onResetProgress() { loadAll(); },
    recordsHtml() {
      const bt = records.bestTime;
      return `<table><tr><td>Кампания</td><td>${progress.done ? '<b>пройдена</b>' : 'дальше всего - сектор ' + (progress.maxSector + 1)}</td></tr>
        <tr><td>Лучшее время кампании</td><td>${['easy', 'normal', 'hard'].map((d) => ({ easy: 'лёгк.', normal: 'обыч.', hard: 'трудн.' })[d] + ' ' + (bt[d] ? fmtTime(bt[d]) : '—')).join(' · ')}</td></tr>
        <tr><td>Выживание, волн</td><td><b>${records.survival}</b></td></tr><tr><td>Сбито всего</td><td>${records.kills}</td></tr></table>`;
    },
  },
});
// Загрузка по схеме: испорченное хранилище (сектор 11, улучшения «x») не роняет игру
function loadAll() {
  const G = GameKit.S, N = 1e9, last = SECTORS.length - 1;
  const lvl = (k) => G.int(0, 0, UPGRADES[k].prices.length);
  progress = kit.loadSafe('progress', G.obj({
    sector: G.int(0, 0, last), maxSector: G.int(0, 0, last), done: G.bool(false),
    up: G.nul(G.obj({ weapon: lvl('weapon'), damage: lvl('damage'), shield: lvl('shield'), speed: lvl('speed'), rate: lvl('rate') })),
    credits: G.int(0, 0, N), bombs: G.int(1, 0, MAX_BOMBS), hp: G.num(100, 1, 1000),
    hardSec: G.map(G.bool(false), SECTORS.map((_, i) => String(i))),
    stats: G.nul(G.obj({ kills: G.int(0, 0, N), shots: G.int(0, 0, N), hits: G.int(0, 0, N), dmgTaken: G.num(0, 0, N), steps: G.int(0, 0, N), credits: G.int(0, 0, N) })),
  }));
  progress.maxSector = Math.max(progress.maxSector, progress.sector);
  records = kit.loadSafe('records', G.obj({ survival: G.int(0, 0, N), survivalScore: G.int(0, 0, N), bestTime: G.map(G.int(0, 1, N), ['easy', 'normal', 'hard']), kills: G.int(0, 0, N) }));
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP_MS) {
    if ((kit.mode === 'play' && S.mode !== 'demo') || (kit.mode === 'menu' && S.mode === 'demo')) update();
    else if (S.phase === 'won' || S.phase === 'over' || S.phase === 'dead') { S.frame++; updateParticles(); if (S.phase === 'won' && S.frame % 8 === 0) fireworks(); }
    kit.endStep();
    acc -= STEP_MS;
  }
  canvas.classList.toggle('playing', kit.mode === 'play');
  render();
  kit.countFrame();
  requestAnimationFrame(loop);
}
addEventListener('resize', fitCanvas);
loadAll();
fitCanvas();
startDemo();
kit.showMain();
requestAnimationFrame(loop);

// ================= Крючок для проверок =================
window.__game = {
  ready: true, W, H, SECTORS, BOSSES, UPGRADES, WEAPONS, HUD_BOTTOM,
  S, P, get kit() { return kit; },
  get enemies() { return enemies; }, get boss() { return boss; }, get bullets() { return bullets; }, get ebullets() { return ebullets; },
  get asteroids() { return asteroids; }, get pickups() { return pickups; }, get beams() { return beams; },
  get progress() { return progress; }, get records() { return records; },
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) { update(); kit.endStep(); } if (draw) render(); },
  startCampaign, startSurvival, startDemo, spawnEnemy, spawnBoss, startFinale, buy, useBomb, damagePlayer, showShop,
  reseed(n) { rnd = mulberry32(n); },
  bannerCss() { return cssRect(bannerRect); },
  aimAt(x, y) { mouse.x = x; mouse.y = y; mouse.lastMove = performance.now(); },
  setHeld(v) { mouse.held = v; },
};
</script>
