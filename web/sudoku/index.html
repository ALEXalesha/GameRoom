<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="application-name" content="Судоку">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Судоку</title>
<style>
  :root, [data-theme=dark] {
    --bg: #11141f; --bg2: #1a1f33; --cell: #1b2031; --cell-given: #e8ecf6; --cell-user: #8fb1ff; --cell-hint: #5fd7a0;
    --line: #2c3350; --line-strong: #7082b8; --peer: #222a42; --same: #34437a; --sel: #3c5bd6; --sel-fg: #ffffff;
    --err-bg: #4a1f2a; --err: #ff7a8a; --note: #9aa6c8; --text: #e8ecf6; --dim: #8a93b0; --btn: #232a41; --btn-hover: #2c3552; --accent: #7aa2ff;
  }
  [data-theme=light] {
    --bg: #eef1f7; --bg2: #ffffff; --cell: #ffffff; --cell-given: #1d2433; --cell-user: #2b5ce6; --cell-hint: #178a55;
    --line: #d5dae6; --line-strong: #3a4466; --peer: #eef2fb; --same: #cfdcff; --sel: #3b6ef5; --sel-fg: #ffffff;
    --err-bg: #ffe3e7; --err: #d0263b; --note: #6b7385; --text: #1d2433; --dim: #6b7385; --btn: #ffffff; --btn-hover: #eef2fb; --accent: #3b6ef5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; user-select: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  .wrap { --bs: min(calc(100vh - 56px), calc(100vw - 440px), 840px); display: flex; gap: 32px; align-items: stretch; }
  #board { width: var(--bs); height: var(--bs); min-width: 300px; min-height: 300px; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
    background: var(--cell); border: 3px solid var(--line-strong); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.25); position: relative; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--cell);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: calc(var(--bs) * 0.058); font-weight: 500; color: var(--cell-user); transition: background .12s; }
  .cell.br { border-right: 3px solid var(--line-strong); }
  .cell.bb { border-bottom: 3px solid var(--line-strong); }
  .cell.nr { border-right: none; } .cell.nb { border-bottom: none; }
  .cell.given { color: var(--cell-given); font-weight: 650; }
  .cell.hinted { color: var(--cell-hint); }
  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--same); }
  .cell.focus { background: var(--sel); color: var(--sel-fg); }
  .cell.error, .cell.conflict { color: var(--err); }
  .cell.error:not(.focus) { background: var(--err-bg); }
  .cell.focus.error, .cell.focus.conflict { background: #b3202f; color: #ffffff; }
  .cell.hintcell:not(.focus) { box-shadow: inset 0 0 0 3px var(--cell-hint); }
  .cell.pop { animation: pop .28s ease-out; }
  @keyframes pop { from { transform: scale(1.25); } to { transform: none; } }
  .notes { position: absolute; inset: 3px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-size: calc(var(--bs) * 0.022); color: var(--note); font-weight: 600; }
  .notes span { display: flex; align-items: center; justify-content: center; }
  .notes span.hl { color: var(--accent); }
  #board.hidden .cell > * , #board.hidden .cell { color: transparent !important; }
  #board.hidden::after { content: ''; position: absolute; inset: 0; background: var(--cell); }
  #side { width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--bg2); border-radius: 14px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .level { font-size: 20px; font-weight: 700; }
  .tag { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .menu-btn { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--btn); color: var(--text); cursor: pointer; }
  .stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: var(--dim); }
  .stats b { color: var(--text); font-size: 18px; display: block; font-variant-numeric: tabular-nums; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pad button, .acts button { font: inherit; border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 12px; cursor: pointer; transition: background .12s, transform .08s; }
  .pad button { font-size: 28px; font-weight: 600; padding: 6px 0 4px; color: var(--cell-user); }
  .pad button small { display: block; font-size: 11px; color: var(--dim); font-weight: 500; }
  .pad button.done { opacity: .3; }
  .pad button.padsel { outline: 3px solid var(--accent); }
  .pad button:hover, .acts button:hover, .menu-btn:hover { background: var(--btn-hover); }
  .pad button:active, .acts button:active { transform: scale(.96); }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .acts button { font-size: 13px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .acts button .ic { font-size: 20px; line-height: 1; }
  .acts button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .acts button:disabled { opacity: .35; cursor: default; }
  #hintText { font-size: 13.5px; line-height: 1.45; color: var(--text); min-height: 40px; }
  #hintText b { color: var(--cell-hint); }
  #hintText .err { color: var(--err); font-weight: 600; }
  .grow { flex: 1; overflow: auto; }
  .spinner { width: 42px; height: 42px; margin: 6px auto 10px; border-radius: 50%; border: 4px solid rgba(128,140,180,.3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #app .kit-grid.levels { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 860px) {
    .wrap { flex-direction: column; --bs: min(calc(100vw - 24px), calc(100vh - 380px)); align-items: center; }
    #side { width: var(--bs); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <div id="board" aria-label="Поле судоку"></div>
    <div id="side">
      <div class="card">
        <div class="head"><div><div class="level" id="lvl">Лёгкий</div><div class="tag" id="tag">новая игра</div></div><button class="menu-btn" id="menuBtn" title="Пауза и меню (Esc)">☰ Меню</button></div>
        <div class="stats"><span>Время<b id="time">0:00</b></span><span>Ошибки<b id="mist">0</b></span><span>Подсказки<b id="hints">0</b></span></div>
      </div>
      <div class="card pad" id="pad"></div>
      <div class="card acts" id="acts"></div>
      <div class="card grow"><div id="hintText">Выберите клетку и цифру. Подсказка объяснит следующий ход.</div></div>
    </div>
  </div>
  <canvas id="fx"></canvas>
</div>
<script src="logic.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
const L = SudokuLogic;
const params = new URLSearchParams(location.search);
const FAST = params.has('fast');
let seedBase = params.has('seed') ? Number(params.get('seed')) || 1 : Math.floor(Math.random() * 1e9);
const nextSeed = () => (seedBase = (seedBase * 1103515245 + 12345) >>> 0);
const LEVEL_NAMES = { easy: 'Лёгкий', medium: 'Средний', hard: 'Сложный', expert: 'Эксперт' };
const WEEK_LEVEL = ['expert', 'easy', 'medium', 'medium', 'hard', 'hard', 'expert'];      // по дням недели: вс..сб
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

// ================= Состояние =================
const state = {
  puzzle: [], solution: [], user: [], given: [], hinted: [], notes: [], level: 'easy', daily: null,
  selected: null, notesMode: false, mistakes: 0, hints: 0, elapsed: 0, phase: 'play', padDigit: 1, demo: false, moves: 0,
};
let history = [], future = [], autopilot = false, pilotT = 0, hintCells = [], kit, records;

function today() {
  if (params.has('date')) return params.get('date');
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dateLabel(s) { const [y, m, d] = s.split('-').map(Number); return `${d} ${MONTHS[m - 1]}`; }
function dayShift(s, k) { const [y, m, d] = s.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + k)); return t.toISOString().slice(0, 10); }
function dailyLevel(s) { const [y, m, d] = s.split('-').map(Number); return WEEK_LEVEL[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; }
function dailySeed(s) { return Number(s.replace(/-/g, '')) * 7 + 13; }
const fmt = (sec) => { sec = Math.floor(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const rc = (i) => ({ r: Math.floor(i / 9), c: i % 9 });

// ================= Начало партии =================
function setup(puzzle, solution, level, daily) {
  Object.assign(state, {
    puzzle: puzzle.slice(), solution: solution.slice(), user: puzzle.slice(), given: puzzle.map(Boolean), hinted: puzzle.map(() => false),
    notes: puzzle.map(() => new Set()), level, daily: daily || null, selected: null, notesMode: false, mistakes: 0, hints: 0,
    elapsed: 0, phase: 'play', moves: 0,
  });
  history = []; future = []; hintCells = [];
  setHint('Выберите клетку и цифру. Подсказка объяснит следующий ход.');
  render();
}
function beginPlay(demo) {
  state.demo = !!demo;
  autopilot = !!demo;
  if (!demo) {
    abandonCheck();
    const rec = records.levels[state.level]; rec.played++;
    saveRecords();
    save();
    kit.play();
  }
}
// Брошенная партия (были ходы, не решена) рвёт серию побед
function abandonCheck() { if (records.active) { records.streak.cur = 0; records.active = false; saveRecords(); } }
function newSync(level, seed) {
  const g = L.generate(level, seed === undefined ? nextSeed() : seed);
  setup(g.puzzle, g.solution, level, null);
}
function startLevel(level) {
  preparing(`Готовлю головоломку: ${LEVEL_NAMES[level]}…`);
  const t0 = performance.now();
  L.generateAsync(level, nextSeed(), (g) => afterPrep(t0, () => { setup(g.puzzle, g.solution, level, null); beginPlay(false); }));
}
function dailyPuzzle(d) { return L.generate(dailyLevel(d), dailySeed(d)); }
function startDailySync(date) {
  const d = date || today(), level = dailyLevel(d), g = L.generate(level, dailySeed(d));
  setup(g.puzzle, g.solution, level, d);
}
function startDaily() {
  const d = today(), level = dailyLevel(d);
  preparing(`Готовлю ежедневную головоломку на ${dateLabel(d)}…`);
  const t0 = performance.now();
  L.generateAsync(level, dailySeed(d), (g) => afterPrep(t0, () => { setup(g.puzzle, g.solution, level, d); beginPlay(false); }));
}
// Окно подготовки держится хотя бы 0,4 с: не мигает, когда головоломка готова мгновенно
function afterPrep(t0, go) { kit.later(go, Math.max(0, 400 - (performance.now() - t0))); }
function preparing(text) { kit.show({ id: 'preparing', title: 'Минутку', html: `<div class="spinner" aria-hidden="true"></div><p style="text-align:center">${text}</p>` }); }
function startDemo() {
  const g = L.generate('easy', nextSeed());
  setup(g.puzzle, g.solution, 'easy', null);
  // заставка: решено больше половины - меньше ждать
  const empty = state.user.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
  for (let k = 0; k < empty.length * 0.4; k++) state.user[empty[k]] = state.solution[empty[k]];
  beginPlay(true);
  render();
}

// ================= Ходы =================
// В снимок отмены счётчик ошибок не входит: ошибку нельзя «отменить», она уже сделана
function snapshot() { return { user: state.user.slice(), notes: state.notes.map((s) => new Set(s)), hinted: state.hinted.slice() }; }
function pushHistory() { history.push(snapshot()); if (history.length > 500) history.shift(); future = []; }
function restore(s) { state.user = s.user.slice(); state.notes = s.notes.map((x) => new Set(x)); state.hinted = s.hinted.slice(); }
function undo() { if (state.phase !== 'play' || !history.length) return; future.push(snapshot()); restore(history.pop()); render(); save(); }
function redo() { if (state.phase !== 'play' || !future.length) return; history.push(snapshot()); restore(future.pop()); render(); save(); checkWin(); }
const locked = (i) => state.given[i] || state.hinted[i];
function select(r, c) { state.selected = { r, c }; render(); }
function selIndex() { return state.selected ? state.selected.r * 9 + state.selected.c : -1; }
function clearPeerNotes(i, d) { for (const j of L.PEERS[i]) state.notes[j].delete(d); }
function input(d) {
  const i = selIndex();
  if (state.phase !== 'play' || i < 0 || locked(i)) return;
  if (state.notesMode) {
    if (state.user[i]) return;
    pushHistory();
    if (state.notes[i].has(d)) state.notes[i].delete(d); else state.notes[i].add(d);
    render(); save(); return;
  }
  if (state.user[i] === d) return;
  pushHistory();
  state.user[i] = d; state.notes[i].clear(); state.moves++;
  if (!state.demo) records.active = true;
  if (kit.settings.autoRemoveNotes) clearPeerNotes(i, d);
  const wrong = d !== state.solution[i];
  if (wrong && kit.settings.instantCheck) {
    state.mistakes++;
    if (!state.demo) SFX.wrong();
    const lim = kit.settings.mistakeLimit;
    if (lim > 0 && state.mistakes >= lim && !state.demo) { render(); lose(); return; }
  } else if (!state.demo) SFX.put();
  popCell(i);
  render(); save(); checkWin();
}
function erase() {
  const i = selIndex();
  if (state.phase !== 'play' || i < 0 || locked(i)) return;
  if (!state.user[i] && !state.notes[i].size) return;
  pushHistory();
  state.user[i] = 0; state.notes[i].clear();
  render(); save();
}
function toggleNotes() { state.notesMode = !state.notesMode; render(); }
function autoNotes() {
  if (state.phase !== 'play') return;
  pushHistory();
  const cand = L.candidates(state.user.map((v, i) => (v === state.solution[i] || !kit.settings.instantCheck ? v : 0)));
  const candAll = L.candidates(state.user);
  for (let i = 0; i < 81; i++) if (!state.user[i]) state.notes[i] = new Set(L.digits(candAll[i] || cand[i]));
  render(); save();
}
function moveSel(dr, dc) {
  const s = state.selected || { r: 4, c: 4 };
  select((s.r + dr + 9) % 9, (s.c + dc + 9) % 9);
}

// ================= Подсказка с объяснением =================
function setHint(html) { const el = document.getElementById('hintText'); if (el) el.innerHTML = html; }
function hint() {
  if (state.phase !== 'play') return;
  // сначала - неверные цифры игрока
  const wrong = state.user.findIndex((v, i) => v && v !== state.solution[i]);
  if (wrong >= 0) {
    state.selected = rc(wrong); hintCells = [wrong];
    setHint(`<span class="err">В клетке ${L.name(wrong)} ошибка:</span> цифра ${state.user[wrong]} здесь не подходит. Сотрите её (⌫), а потом просите подсказку снова.`);
    render(); return;
  }
  const h = L.hintFrom(state.user);
  pushHistory();
  let i, d, text;
  if (h.place) {
    [i, d] = h.place;
    const pre = h.elims.length ? `Сначала исключения: ${h.elims.map((e) => `<b>${e.tech}</b> - ${e.why}`).join(' ')} Тогда: ` : '';
    text = `${pre}<b>${h.tech}.</b> ${h.why}`;
    hintCells = h.cells || [i];
  } else {
    i = state.user.findIndex((v) => !v); d = state.solution[i];
    text = `Доступными приёмами дальше не продвинуться - открываю клетку ${L.name(i)}.`;
    hintCells = [i];
  }
  state.user[i] = d; state.hinted[i] = true; state.notes[i].clear(); clearPeerNotes(i, d);
  state.hints++; state.selected = rc(i);
  if (!state.demo) { records.active = true; SFX.hint(); }
  setHint(text);
  popCell(i);
  render(); save(); checkWin();
}
// Автопилот: те же логические шаги, что и подсказка, но ходом игрока
function pilotStep() {
  const h = L.hintFrom(state.user);
  let i, d;
  if (h.place) [i, d] = h.place;
  else { i = state.user.findIndex((v) => !v); if (i < 0) return; d = state.solution[i]; }
  const nm = state.notesMode; state.notesMode = false;
  state.selected = rc(i); input(d);
  state.notesMode = nm;
}

// ================= Итоги =================
function checkWin() {
  if (state.phase !== 'play' || state.user.some((v, i) => v !== state.solution[i])) return;
  state.phase = 'won';
  if (state.demo) { kit.later(() => { if (state.demo) startDemo(); }, 1500); confetti(); return; }
  const rec = records.levels[state.level], secs = Math.max(1, Math.floor(state.elapsed));
  rec.won++; rec.total += secs;
  const newBest = !rec.best || secs < rec.best;
  if (newBest) rec.best = secs;
  records.streak.cur++; records.streak.best = Math.max(records.streak.best, records.streak.cur);
  records.active = false;
  if (state.daily) {
    const dly = records.daily;
    if (!dly.done[state.daily]) {
      dly.streak = dly.last === dayShift(state.daily, -1) ? dly.streak + 1 : dly.last === state.daily ? dly.streak : 1;
      dly.best = Math.max(dly.best, dly.streak); dly.last = state.daily; dly.done[state.daily] = secs;
      const keys = Object.keys(dly.done).sort(); while (keys.length > 400) delete dly.done[keys.shift()];
      if (dly.streak >= 7) kit.unlock('daily7');
      kit.unlock('daily');
    }
  }
  kit.unlock('first'); kit.unlock(state.level + 'Win');
  if (!state.mistakes && !state.hints) kit.unlock('clean');
  if (state.level === 'expert' && !state.hints) kit.unlock('expertClean');
  if (state.level !== 'easy' && secs < 600) kit.unlock('fast');
  if (records.streak.cur >= 5) kit.unlock('streak5');
  saveRecords();
  kit.remove('game');
  SFX.win(); confetti();
  const secsLabel = fmt(secs);
  kit.later(() => {
    kit.mode = 'menu';
    kit.show({ id: 'win', title: 'Решено!', wide: true,
      html: `<p style="text-align:center;font-size:18px">${LEVEL_NAMES[state.level]}${state.daily ? ' · ежедневная, ' + dateLabel(state.daily) : ''} - за <b>${secsLabel}</b>${newBest ? ' · <b>новый рекорд!</b>' : ''}</p>
        <table><tr><td>Ошибок</td><td>${state.mistakes}</td></tr><tr><td>Подсказок</td><td>${state.hints}</td></tr>
        <tr><td>Рекорд уровня</td><td>${fmt(rec.best)}</td></tr><tr><td>Серия побед</td><td>${records.streak.cur} (лучшая ${records.streak.best})</td></tr>
        ${state.daily ? `<tr><td>Ежедневные подряд</td><td>${records.daily.streak} дн.</td></tr>` : ''}</table>`,
      row: true, buttons: [{ label: 'Новая игра', primary: true, id: 'new', onClick: showLevels }, { label: 'В меню', id: 'menu', onClick: () => kit.toMenu() }] });
  }, FAST ? 0 : 700);
}
function lose() {
  state.phase = 'lost';
  records.streak.cur = 0; records.active = false; saveRecords();
  SFX.lose();
  kit.later(() => {
    kit.mode = 'menu';
    kit.show({ id: 'over', title: 'Слишком много ошибок', html: `<p style="text-align:center">Ошибок: <b>${state.mistakes}</b> из ${kit.settings.mistakeLimit}. Можно продолжить с последней попыткой или начать заново. Лимит меняется в настройках.</p>`, row: true,
      buttons: [{ label: 'Ещё шанс', primary: true, id: 'again', onClick: () => { state.mistakes = kit.settings.mistakeLimit - 1; state.phase = 'play'; kit.play(); render(); save(); } },
        { label: 'Новая игра', id: 'new', onClick: showLevels }, { label: 'В меню', id: 'menu', onClick: () => kit.toMenu() }] });
  }, FAST ? 0 : 500);
}

// ================= Сохранение =================
function save() {
  if (state.demo || state.phase !== 'play' || !state.puzzle.length) return;
  kit.save('game', { puzzle: state.puzzle.join(''), solution: state.solution.join(''), user: state.user.join(''), hinted: state.hinted.map(Number).join(''),
    notes: state.notes.map((s) => [...s].sort().join('')), level: state.level, daily: state.daily, mistakes: state.mistakes, hints: state.hints, elapsed: Math.floor(state.elapsed) });
}
function loadGame() {
  const Z = GameKit.S;
  const g = kit.loadSafe('game', Z.nul(Z.obj({ puzzle: Z.str(''), solution: Z.str(''), user: Z.str(''), hinted: Z.str(''), notes: Z.arr(Z.str(''), 81), level: Z.str('easy', Object.keys(LEVEL_NAMES)),
    daily: Z.nul(Z.str('')), mistakes: Z.int(0, 0, 99), hints: Z.int(0, 0, 81), elapsed: Z.int(0, 0, 1e7) })));
  if (!g) return null;
  const arr = (s) => (/^[0-9]{81}$/.test(s) ? [...s].map(Number) : null);
  const p = arr(g.puzzle), u = arr(g.user), so = [];
  // решение не берём на веру: вычисляем по головоломке (она должна иметь ровно одно)
  if (!p || !u || L.countSolutions(p, 2, so) !== 1) return null;
  if (g.daily && !DATE_RE.test(g.daily)) g.daily = null;
  return { g, p, so, u };
}
function continueGame() {

  if (m && !e.ctrlKey && !e.metaKey) { e.preventDefault(); const d = Number(m[2]); if (d) { state.padDigit = d; input(d); } else erase(); return; }
  const a = kit.actionOf(e.code);
  if (e.repeat && (a === 'up' || a === 'down' || a === 'left' || a === 'right')) handleAction(a);   // держишь стрелку - выбор бежит
});
function handleAction(a) {
  if (a === 'up') moveSel(-1, 0); else if (a === 'down') moveSel(1, 0); else if (a === 'left') moveSel(0, -1); else if (a === 'right') moveSel(0, 1);
  else if (a === 'erase') erase(); else if (a === 'notes') toggleNotes(); else if (a === 'autonotes') autoNotes(); else if (a === 'hint') hint();
  else if (a === 'undo') undo(); else if (a === 'redo') redo();
  else if (a === 'prevDigit') { state.padDigit = state.padDigit === 1 ? 9 : state.padDigit - 1; padUsed = true; render(); }
  else if (a === 'nextDigit') { state.padDigit = state.padDigit === 9 ? 1 : state.padDigit + 1; padUsed = true; render(); }
  else if (a === 'place') input(state.padDigit);
}
const ACTION_NAMES = ['up', 'down', 'left', 'right', 'erase', 'notes', 'autonotes', 'hint', 'undo', 'redo', 'prevDigit', 'nextDigit', 'place'];
let saveT = 0;
function frame(dt) {
  if (kit.mode === 'play' && !state.demo) {
    for (const a of ACTION_NAMES) if (kit.wasPressed(a)) handleAction(a);
    if (state.phase === 'play') { state.elapsed += dt / 1000; saveT += dt; if (saveT >= 5000) { saveT = 0; save(); } }
  }
  if ((autopilot && state.phase === 'play') && (kit.mode === 'play' || (kit.mode === 'menu' && state.demo))) {
    pilotT += 1;
    if (pilotT >= (state.demo ? 22 : 1)) { pilotT = 0; pilotStep(); }
  }
  kit.endStep();
}
let last = performance.now(), timerShown = -1;
function loop(now) {
  const dt = Math.min(100, now - last); last = now;
  frame(dt);
  if (Math.floor(state.elapsed) !== timerShown) { timerShown = Math.floor(state.elapsed); document.getElementById('time').textContent = kit.settings.showTimer ? fmt(state.elapsed) : '—'; }
  boardEl.classList.toggle('hidden', kit.mode === 'paused');
  drawFx();
  kit.countFrame();
  requestAnimationFrame(loop);
}

loadRecords();
applyTheme();
startDemo();
kit.showMain();
requestAnimationFrame(loop);

// ================= Крючок для проверок =================
window.__game = {
  ready: true, state, get kit() { return kit; }, get records() { return records; }, get autopilot() { return autopilot; },
  setAutopilot(v) { autopilot = v; pilotT = 0; },
  step(n = 1) { for (let i = 0; i < n; i++) frame(1000 / 60); render(); },
  newSync(level, seed) { newSync(level, seed); beginPlay(false); kit.closeAll(); kit.mode = 'menu'; },
  startDailySync(date) { startDailySync(date); beginPlay(false); kit.closeAll(); kit.mode = 'menu'; },
  select, input, erase, toggleNotes, autoNotes, hint, undo, redo, save, importPuzzle,
  cellEl: (r, c) => cells[r * 9 + c], dailyPuzzle,
};
</script>
