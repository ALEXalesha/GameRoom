<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="application-name" content="Заглушка паузы">
<meta name="mix-protocol" content="pause">
<title>Заглушка паузы (проверочная игра для законов оболочек)</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131a; color: #fff; font: 16px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); font-size: 22px; }
  #menu.on { display: flex; }
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<div id="menu">Пауза - щёлкните, чтобы продолжить</div>
<script>
'use strict';
// Проверочная игра по протоколу из README.md: считает кадры и игровое время, на паузе всё стоит.
window.stub = { frames: 0, time: 0, paused: false };
const c = document.getElementById('c'), x = c.getContext('2d');
let last = performance.now();
function loop(t) {
  const dt = t - last; last = t;
  if (!stub.paused) {
    stub.frames++; stub.time += dt;
    x.fillStyle = '#10131a'; x.fillRect(0, 0, 320, 200);
    x.fillStyle = '#4cc2ff'; x.fillRect((stub.time / 5) % 320, 90, 20, 20);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function pause() { stub.paused = true; }
addEventListener('message', (e) => {
  const m = e.data && e.data.mix;
  if (m === 'pause') { pause(); if (parent !== window) parent.postMessage({ mix: 'paused', from: 'stub' }, '*'); }
  if (m === 'resume') document.getElementById('menu').classList.add('on');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
document.addEventListener('click', () => { if (!stub.paused) return; stub.paused = false; document.getElementById('menu').classList.remove('on'); });
</script>
</body>
</html>
