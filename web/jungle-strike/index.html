<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Огненные джунгли (фан-версия, не связана с правообладателем)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Consolas, 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    color: #ff5050;
    font-size: 22px;
    letter-spacing: 6px;
    margin-bottom: 6px;
    text-shadow: 2px 2px 0 #800;
  }
  #wrap { position: relative; border: 4px solid #444; box-shadow: 0 0 30px #000a; }
  canvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #info { margin-top: 8px; color: #aaa; font-size: 12px; text-align: center; line-height: 1.5; }
  #info b { color: #ffcc00; }
  #info .pw { color: #80ffc0; }
  #info .note { color: #666; font-size: 11px; }
</style>
</head>
<body>
<h1>ОГНЕННЫЕ ДЖУНГЛИ</h1>
<div id="wrap"><canvas id="c" width="256" height="240"></canvas></div>
<div id="info">
  <b>A/D ← →</b> ходить · <b>W ↑</b> прицел вверх · <b>S ↓</b> лечь / спрыгнуть с платформы · <b>Пробел</b> прыжок · <b>J/X</b> огонь · <b>P/Esc</b> пауза · <b>R</b> заново · <b>M</b> звук<br>
  Бонусы: <span class="pw">S</span> веер из трёх · <span class="pw">R</span> быстрый огонь · <span class="pw">щит</span> один удар<br>
  <span class="note">Фан-версия, не связана с правообладателем. Всё нарисовано в коде, звуки синтезированы.</span>
</div>

<script>
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const STEP_MS = 1000 / 60;         // шаг физики: скорость не зависит от частоты экрана
const START_LIVES = 3;
const BEST_KEY = 'jungle_best';

// ?seed=N - повторяемая игра (для проверок)
const params = new URLSearchParams(location.search);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = params.has('seed') ? mulberry32(Number(params.get('seed')) || 1) : Math.random;

function loadBest() { try { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* нет хранилища */ } }

// Звук: синтез WebAudio, без файлов
let actx = null, muted = false, lastShot = 0;
function beep(freq, dur, type = 'square', vol = 0.04, slide) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* звук недоступен */ }
}
const SFX = {
  shot: () => { const n = performance.now(); if (n - lastShot > 70) { lastShot = n; beep(700, 0.04, 'square', 0.02, 300); } },
  kill: () => beep(160, 0.15, 'sawtooth', 0.05, 60),
  hurt: () => beep(240, 0.25, 'square', 0.06, 80),
  pickup: () => { beep(600, 0.07, 'triangle', 0.06); setTimeout(() => beep(900, 0.1, 'triangle', 0.06), 60); },
  boom: () => beep(90, 0.5, 'sawtooth', 0.07, 30),
};

const W = 256, H = 240;
const GROUND_Y = 184;
const GRAVITY = 0.4;
const JUMP_V = -6.4;
const PLAYER_SPEED = 1.4;
const BULLET_SPEED = 4;
const LEVEL_W = 4200;
const BOSS_X = LEVEL_W - 200;

const keys = {};
const justPressed = {};
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyR') { startGame(); return; }
  if ((phase === 'ready' || phase === 'over' || phase === 'won') && (e.code === 'Enter' || e.code === 'Space')) {
    if (!e.repeat) startGame();
    return;
  }
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
// Потеря фокуса: пауза и отпускание клавиш (иначе герой бежит сам)
addEventListener('blur', () => { for (const c in keys) keys[c] = false; if (phase === 'play') togglePause(); });

const k = (...codes) => codes.some(c => keys[c]);
const kp = (...codes) => codes.some(c => justPressed[c]);

const palette = {
  skyTop: '#3060a0',
  skyMid: '#5090d0',
  skyLow: '#a0c0e0',
  mtnFar: '#406080',
  mtnNear: '#284060',
  jungleFar: '#1a4a2a',
  jungleNear: '#0a3018',
  ground: '#5a3820',
  groundDk: '#3a2010',
  grass: '#2a8030',
  grassDk: '#185020',
  water: '#1860a0',
  waterDk: '#0a3060',
  platform: '#806040',
  platformDk: '#503020',
  platformTop: '#a08060',
  trunk: '#4a3018',
  leaves: '#2a6028',
  leavesDk: '#184018',
  bodyA: '#d8a060',
  bodyB: '#a06038',
  pants: '#306030',
  bandana: '#c02020',
  skin: '#f0c090',
  hair: '#402010',
  enemyShirt: '#a83030',
  enemyPants: '#403028',
  droneBody: '#606878',
  droneLight: '#ff4040',
  bossBody: '#704040',
  bossDk: '#382020',
  bossEye: '#ffc040',
  bullet: '#fff080',
  bulletEnemy: '#ff6040',
  blood: '#c02020',
  spark: '#ffd040',
  uiRed: '#ff5050',
  uiYellow: '#ffd040',
  uiWhite: '#ffffff',
  uiDark: '#101820',
  pwS: '#80c0ff',
  pwR: '#ffa040',
  pwShield: '#80ff80',
  shield: '#80ffc0',
};

let cameraX = 0;

const platforms = [];
const pits = [];

function buildLevel() {
  platforms.length = 0;
  pits.length = 0;
  pits.push({ x: 600, w: 60 });
  pits.push({ x: 1100, w: 50 });
  pits.push({ x: 1700, w: 80 });
  pits.push({ x: 2400, w: 70 });
  pits.push({ x: 3100, w: 90 });

  platforms.push({ x: 380, y: 140, w: 60 });
  platforms.push({ x: 580, y: 130, w: 80 });
  platforms.push({ x: 800, y: 150, w: 50 });
  platforms.push({ x: 1080, y: 130, w: 80 });
  platforms.push({ x: 1300, y: 145, w: 60 });
  platforms.push({ x: 1500, y: 120, w: 60 });
  platforms.push({ x: 1690, y: 135, w: 90 });
  platforms.push({ x: 1900, y: 145, w: 50 });
  platforms.push({ x: 2150, y: 130, w: 70 });
  platforms.push({ x: 2380, y: 140, w: 100 });
  platforms.push({ x: 2600, y: 120, w: 60 });
  platforms.push({ x: 2820, y: 135, w: 70 });
  platforms.push({ x: 3080, y: 130, w: 110 });
  platforms.push({ x: 3300, y: 145, w: 60 });
  platforms.push({ x: 3500, y: 130, w: 80 });
}

function pitAt(x) {
  for (const p of pits) if (x > p.x && x < p.x + p.w) return p;
  return null;
}

const player = {
  x: 60, y: GROUND_Y, vx: 0, vy: 0,
  w: 12, h: 22,
  dir: 1,
  aimUp: false,
  prone: false,
  onGround: true,
  jumping: false,
  shootCooldown: 0,
  invuln: 0,
  alive: true,
  walkFrame: 0,
  walkTimer: 0,
  weapon: 'normal',
  weaponTimer: 0,
  shieldTimer: 0,
  onPlatform: null,
  dropThrough: 0,
};

const bullets = [];
const enemyBullets = [];
const enemies = [];
const particles = [];
const powerups = [];

let score = 0;
let best = loadBest();
let lives = START_LIVES;
let phase = 'ready';           // ready | play | paused | over | won
let gameOver = false;
let gameWon = false;
let spawnTimer = 0;
let levelTime = 0;
let boss = null;
let bossSpawned = false;

function spawnEnemy() {
  if (boss) return;
  const fromRight = rnd() < 0.85;
  let ex = fromRight ? cameraX + W + 20 : cameraX - 20;
  const r = rnd();
  let type;
  if (r < 0.25) type = 'turret';
  else if (r < 0.45) type = 'drone';
  else if (r < 0.6) type = 'grenadier';
  else type = 'soldier';

  // Не ставить пеших врагов в воду: сдвинуть на ближайшую сушу
  if (type !== 'drone') {
    for (let guard = 0; pitAt(ex) && guard < 20; guard++) ex += fromRight ? 12 : -12;
  }
  if (type === 'soldier') {
    enemies.push({
      type: 'soldier',
      x: ex, y: GROUND_Y, vx: fromRight ? -0.6 : 0.6,
      w: 12, h: 22, hp: 1,
      dir: fromRight ? -1 : 1,
      shootTimer: 30 + rnd() * 60,
      walkFrame: 0, walkTimer: 0,
      alive: true,
      onGround: true, vy: 0,
    });
  } else if (type === 'turret') {
    let tx = cameraX + W + rnd() * 80;
    for (let guard = 0; (pitAt(tx) || pitAt(tx - 8) || pitAt(tx + 8)) && guard < 20; guard++) tx += 16;
    enemies.push({
      type: 'turret',
      x: tx, y: GROUND_Y - 6, vx: 0,
      w: 14, h: 12, hp: 2,
      dir: -1,
      shootTimer: 60 + rnd() * 40,
      alive: true,
    });
  } else if (type === 'drone') {
    enemies.push({
      type: 'drone',
      x: ex, y: 70 + rnd()*40,
      vx: fromRight ? -1.0 : 1.0,
      w: 14, h: 10, hp: 1,
      dir: fromRight ? -1 : 1,
      shootTimer: 50 + rnd() * 30,
      bobPhase: rnd()*Math.PI*2,
      bobBase: 70 + rnd()*40,
      alive: true,
    });
  } else if (type === 'grenadier') {
    enemies.push({
      type: 'grenadier',
      x: ex, y: GROUND_Y, vx: 0,
      w: 12, h: 22, hp: 2,
      dir: fromRight ? -1 : 1,
      shootTimer: 90 + rnd() * 40,
      alive: true,
    });
  }
}

function spawnBoss() {
  boss = {
    type: 'boss',
    x: BOSS_X + 100,
    y: GROUND_Y - 4,
    w: 50, h: 56,
    hp: 30,
    maxHp: 30,
    phase: 'enter',
    dir: -1,
    shootTimer: 60,
    cannonTimer: 0,
    alive: true,
    flash: 0,
    bobPhase: 0,
  };
  enemies.push(boss);
}

function platformBelow(x, y) {
  let best = null;
  for (const p of platforms) {
    if (x >= p.x && x <= p.x + p.w && p.y >= y - 1) {
      if (!best || p.y < best.y) best = p;
    }
  }
  if (!pitAt(x) && GROUND_Y >= y - 1 && (!best || GROUND_Y < best.y)) {
    return { y: GROUND_Y, isGround: true };
  }
  return best;
}

function updatePlayer() {
  if (!player.alive) return;
  if (player.invuln > 0) player.invuln--;
  if (player.weaponTimer > 0) {
    player.weaponTimer--;
    if (player.weaponTimer === 0) player.weapon = 'normal';
  }
  if (player.shieldTimer > 0) player.shieldTimer--;
  if (player.dropThrough > 0) player.dropThrough--;

  const left = k('KeyA','ArrowLeft');
  const right = k('KeyD','ArrowRight');
  const up = k('KeyW','ArrowUp');
  const down = k('KeyS','ArrowDown');
  const downPressed = kp('KeyS','ArrowDown');
  const jump = k('Space');
  const fire = k('KeyJ','KeyX');

  player.aimUp = up && !down;

  if (downPressed && player.onGround && player.onPlatform && !player.onPlatform.isGround) {
    player.dropThrough = 8;
    player.onGround = false;
    player.onPlatform = null;
    player.y += 2;
  }

  player.prone = down && player.onGround && !player.aimUp;

  let move = 0;
  if (!player.prone) {
    if (left) move = -1;
    if (right) move = 1;
  }
  player.vx = move * PLAYER_SPEED;
  if (move !== 0) player.dir = move;

  if (move !== 0 && player.onGround) {
    player.walkTimer++;
    if (player.walkTimer > 6) {
      player.walkTimer = 0;
      player.walkFrame = (player.walkFrame + 1) % 4;
    }
  } else {
    player.walkFrame = 0;
  }

  if (jump && player.onGround && !player.jumping && !player.prone) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.jumping = true;
    player.onPlatform = null;
  }
  if (!jump) player.jumping = false;

  player.vy += GRAVITY;
  if (player.vy > 8) player.vy = 8;

  player.x += player.vx;
  player.y += player.vy;

  if (player.x < cameraX + 4) player.x = cameraX + 4;
  if (player.x > LEVEL_W - 20) player.x = LEVEL_W - 20;

  player.onGround = false;
  player.onPlatform = null;

  if (player.vy >= 0 && player.dropThrough === 0) {
    for (const p of platforms) {
      if (player.x >= p.x - 4 && player.x <= p.x + p.w + 4) {
        const prevY = player.y - player.vy;
        if (prevY <= p.y + 1 && player.y >= p.y) {
          player.y = p.y;
          player.vy = 0;
          player.onGround = true;
          player.onPlatform = p;
          break;
        }
      }
    }
  }

  if (!player.onGround) {
    if (player.y >= GROUND_Y && !pitAt(player.x)) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
      player.onPlatform = { isGround: true, y: GROUND_Y };
    } else if (player.y > H + 20) {
      // Упал в воду: жизнь теряется всегда (даже во время мигания после удара),
      // а герой встаёт на берег перед ямой, а не снова над водой.
      player.invuln = 0;
      hitPlayer(true);
      if (player.alive) {
        const pit = pitAt(player.x) || pits.find(p => player.x >= p.x - 16 && player.x <= p.x + p.w + 16);
        player.x = pit ? Math.max(cameraX + 8, pit.x - 14) : Math.max(cameraX + 30, player.x - 20);
        if (pit && pitAt(player.x)) player.x = pit.x + pit.w + 14;
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
        player.onPlatform = { isGround: true, y: GROUND_Y };
      }
    }
  }

  if (player.shootCooldown > 0) player.shootCooldown--;
  const fireRate = player.weapon === 'rapid' ? 4 : 8;
  if (fire && player.shootCooldown === 0) {
    player.shootCooldown = fireRate;
    fireBullets();
    SFX.shot();
  }

  const halfScreen = W / 2 - 30;
  const targetCam = player.x - halfScreen;
  if (targetCam > cameraX) cameraX = Math.min(targetCam, LEVEL_W - W);
  if (cameraX < 0) cameraX = 0;

  if (cameraX >= LEVEL_W - W - 1 && !bossSpawned) {
    bossSpawned = true;
    spawnBoss();
  }
}

function fireBullets() {
  let bx, by, vx, vy;
  const move = player.vx;

  if (player.prone) {
    bx = player.x + player.dir * 6;
    by = player.y - 4;
    vx = player.dir * BULLET_SPEED; vy = 0;
  } else if (player.aimUp && Math.abs(move) > 0.1) {
    bx = player.x + player.dir * 4;
    by = player.y - 18;
    vx = player.dir * BULLET_SPEED * 0.707;
    vy = -BULLET_SPEED * 0.707;
  } else if (player.aimUp) {
    bx = player.x + 1;
    by = player.y - 22;
    vx = 0; vy = -BULLET_SPEED;
  } else {
    bx = player.x + player.dir * 6;
    by = player.y - 11;
    vx = player.dir * BULLET_SPEED; vy = 0;
  }

  if (player.weapon === 'spread') {
    const speed = Math.hypot(vx, vy) || BULLET_SPEED;
    const baseAng = Math.atan2(vy, vx);
    for (const off of [-0.25, 0, 0.25]) {
      const a = baseAng + off;
      bullets.push({
        x: bx, y: by,
        vx: Math.cos(a)*speed, vy: Math.sin(a)*speed,
        life: 80, type: 'spread',
      });
    }
  } else {
    bullets.push({ x: bx, y: by, vx, vy, life: 80, type: player.weapon });
  }
}

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.life <= 0 || b.x < cameraX - 10 || b.x > cameraX + W + 10 || b.y < 0 || b.y > H) {
      bullets.splice(i, 1);
      continue;
    }
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e.alive) continue;
      const ew = e.w, eh = e.h;
      const ex0 = e.x - ew/2, ex1 = e.x + ew/2;
      const ey0 = e.y - eh, ey1 = e.y;
      if (b.x > ex0 && b.x < ex1 && b.y > ey0 && b.y < ey1) {
        e.hp--;
        if (e.type === 'boss') e.flash = 4;
        hit = true;
        for (let p = 0; p < 3; p++) {
          particles.push({
            x: b.x, y: b.y,
            vx: -b.vx*0.2 + (rnd()-0.5),
            vy: (rnd()-0.5)*1.5,
            life: 10, color: palette.spark,
          });
        }
        if (e.hp <= 0) {
          e.alive = false;
          if (e.type === 'boss') {
            score += 5000;
            SFX.boom();
            finish('won');
            for (let p = 0; p < 30; p++) {
              particles.push({
                x: e.x + (rnd()-0.5)*40,
                y: e.y - 20 + (rnd()-0.5)*40,
                vx: (rnd()-0.5)*4,
                vy: -rnd()*3 - 1,
                life: 40 + rnd()*20,
                color: rnd()<0.5 ? palette.spark : palette.bulletEnemy,
              });
            }
          } else {
            score += e.type === 'turret' ? 200 : (e.type === 'grenadier' ? 250 : (e.type === 'drone' ? 150 : 100));
            SFX.kill();
            for (let p = 0; p < 6; p++) {
              particles.push({
                x: e.x, y: e.y - e.h/2,
                vx: (rnd()-0.5)*2,
                vy: -rnd()*2 - 0.5,
                life: 20 + rnd()*10,
                color: palette.blood,
              });
            }
            if (rnd() < 0.18) dropPowerup(e.x, e.y - 10);
          }
        }
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.gravity) b.vy += 0.15;
    b.life--;

    if (b.gravity && b.y >= GROUND_Y && !pitAt(b.x)) {
      enemyBullets.splice(i, 1);
      for (let p = 0; p < 10; p++) {
        particles.push({
          x: b.x, y: GROUND_Y - 2,
          vx: (rnd()-0.5)*3,
          vy: -rnd()*2.5 - 0.5,
          life: 15 + rnd()*10,
          color: palette.spark,
        });
      }
      if (player.alive && player.invuln === 0) {
        const dx = player.x - b.x;
        const dy = (player.y - 10) - GROUND_Y;
        if (Math.hypot(dx, dy) < 22) hitPlayer();
      }
      continue;
    }

    if (b.life <= 0 || b.x < cameraX - 10 || b.x > cameraX + W + 10 || b.y > H + 10) {
      enemyBullets.splice(i, 1);
      continue;
    }
    if (player.alive && player.invuln === 0) {
      const ph = player.prone ? 8 : 22;
      const pTop = player.y - ph;
      if (b.x > player.x - 5 && b.x < player.x + 5 && b.y > pTop && b.y < player.y) {
        enemyBullets.splice(i, 1);
        hitPlayer();
      }
    }
  }
}

function dropPowerup(x, y) {
  const r = rnd();
  let kind;
  if (r < 0.45) kind = 'spread';
  else if (r < 0.8) kind = 'rapid';
  else kind = 'shield';
  powerups.push({ x, y, vy: -2, kind, life: 600, onGround: false });
}

function updatePowerups() {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.life--;
    if (!p.onGround) {
      p.vy += GRAVITY * 0.7;
      p.y += p.vy;
      const surf = platformBelow(p.x, p.y);
      if (surf && p.y >= surf.y - 1) {
        p.y = surf.y - 1;
        p.vy = 0;
        p.onGround = true;
      }
    }
    if (p.life <= 0 || p.x < cameraX - 30) {
      powerups.splice(i, 1);
      continue;
    }
    if (player.alive) {
      const dx = p.x - player.x;
      const dy = (p.y - 4) - (player.y - 11);
      if (Math.abs(dx) < 10 && Math.abs(dy) < 14) {
        applyPowerup(p.kind);
        SFX.pickup();
        powerups.splice(i, 1);
        score += 50;
      }
    }
  }
}

function applyPowerup(kind) {
  if (kind === 'spread') {
    player.weapon = 'spread';
    player.weaponTimer = 600;
  } else if (kind === 'rapid') {
    player.weapon = 'rapid';
    player.weaponTimer = 600;
  } else if (kind === 'shield') {
    player.shieldTimer = 480;
  }
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.alive) {
      enemies.splice(i, 1);
      if (e === boss) boss = null;
      continue;
    }
    if (e.flash > 0) e.flash--;

    if (e.type === 'soldier') {
      e.x += e.vx;
      e.walkTimer++;
      if (e.walkTimer > 8) { e.walkTimer = 0; e.walkFrame = (e.walkFrame + 1) % 4; }
      if (pitAt(e.x)) {
        e.vx = -e.vx;
        e.dir = -e.dir;
        e.x += e.vx * 2;
      }
      e.shootTimer--;
      if (e.shootTimer <= 0 && Math.abs(e.x - player.x) < W) {
        e.shootTimer = 70 + rnd()*50;
        const dx = player.x - e.x;
        const dy = (player.y - 10) - (e.y - 12);
        const d = Math.hypot(dx, dy) || 1;
        enemyBullets.push({
          x: e.x + e.dir * 6, y: e.y - 12,
          vx: (dx/d)*2, vy: (dy/d)*2,
          life: 100,
        });
      }
    } else if (e.type === 'turret') {
      e.shootTimer--;
      if (e.shootTimer <= 0 && Math.abs(e.x - player.x) < W) {
        e.shootTimer = 90 + rnd()*40;
        const dx = player.x - e.x;
        const dy = (player.y - 10) - (e.y - 6);
        const d = Math.hypot(dx, dy) || 1;
        enemyBullets.push({
          x: e.x, y: e.y - 6,
          vx: (dx/d)*1.8, vy: (dy/d)*1.8,
          life: 120,
        });
      }
    } else if (e.type === 'drone') {
      e.x += e.vx;
      e.bobPhase += 0.08;
      e.y = e.bobBase + Math.sin(e.bobPhase) * 8;
      e.shootTimer--;
      if (e.shootTimer <= 0 && Math.abs(e.x - player.x) < W) {
        e.shootTimer = 60 + rnd()*30;
        const dx = player.x - e.x;
        const dy = (player.y - 10) - e.y;
        const d = Math.hypot(dx, dy) || 1;
        enemyBullets.push({
          x: e.x, y: e.y + 4,
          vx: (dx/d)*2.2, vy: (dy/d)*2.2,
          life: 100,
        });
      }
    } else if (e.type === 'grenadier') {
      e.dir = player.x < e.x ? -1 : 1;
      e.shootTimer--;
      if (e.shootTimer <= 0 && Math.abs(e.x - player.x) < W) {
        e.shootTimer = 110 + rnd()*40;
        const dx = player.x - e.x;
        const horiz = Math.sign(dx) * Math.min(2.4, Math.abs(dx) / 50);
        enemyBullets.push({
          x: e.x + e.dir * 6, y: e.y - 18,
          vx: horiz, vy: -3.2,
          life: 200, gravity: true, grenade: true,
        });
      }
    } else if (e.type === 'boss') {
      updateBoss(e);
    }

    if (e.type !== 'boss' && (e.x < cameraX - 60 || e.x > cameraX + W + 200)) {
      enemies.splice(i, 1);
      continue;
    }
    if (player.alive && player.invuln === 0 && e.type === 'soldier') {
      const ph = player.prone ? 8 : 22;
      if (Math.abs(e.x - player.x) < 10 && Math.abs((e.y - 11) - (player.y - ph/2)) < 14) {
        hitPlayer();
      }
    }
    if (player.alive && player.invuln === 0 && e.type === 'drone') {
      const ph = player.prone ? 8 : 22;
      if (Math.abs(e.x - player.x) < 10 && Math.abs((e.y + 4) - (player.y - ph/2)) < 14) {
        hitPlayer();
      }
    }
  }
}

function updateBoss(b) {
  b.bobPhase += 0.04;
  if (b.phase === 'enter') {
    b.x -= 0.6;
    if (b.x <= BOSS_X) {
      b.x = BOSS_X;
      b.phase = 'fight';
    }
  } else if (b.phase === 'fight') {
    b.x = BOSS_X + Math.sin(b.bobPhase) * 6;
    b.shootTimer--;
    if (b.shootTimer <= 0) {
      b.shootTimer = 35;
      const cx = b.x - 18, cy = b.y - 30;
      const dx = player.x - cx;
      const dy = (player.y - 10) - cy;
      const d = Math.hypot(dx, dy) || 1;
      enemyBullets.push({
        x: cx, y: cy,
        vx: (dx/d)*2.4, vy: (dy/d)*2.4,
        life: 120,
      });
    }
    b.cannonTimer--;
    if (b.cannonTimer <= 0) {
      b.cannonTimer = 140;
      for (let i = -1; i <= 1; i++) {
        const ang = Math.PI + i*0.35;
        enemyBullets.push({
          x: b.x - 22, y: b.y - 18,
          vx: Math.cos(ang)*2.6, vy: Math.sin(ang)*2.6,
          life: 140,
        });
      }
    }
  }
  if (player.alive && player.invuln === 0) {
    if (player.x > b.x - b.w/2 - 4 && player.x < b.x + b.w/2 + 4 &&
        player.y > b.y - b.h - 4 && player.y < b.y + 4) {
      hitPlayer();
    }
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function hitPlayer(fromPit) {
  if (player.invuln > 0) return;
  if (player.shieldTimer > 0 && !fromPit) {
    player.shieldTimer = 0;
    player.invuln = 30;
    for (let p = 0; p < 12; p++) {
      particles.push({
        x: player.x, y: player.y - 12,
        vx: (rnd()-0.5)*4,
        vy: (rnd()-0.5)*4,
        life: 20, color: palette.shield,
      });
    }
    return;
  }
  lives--;
  SFX.hurt();
  player.invuln = 90;
  player.vy = -3;
  player.weapon = 'normal';
  player.weaponTimer = 0;
  for (let p = 0; p < 8; p++) {
    particles.push({
      x: player.x, y: player.y - 10,
      vx: (rnd()-0.5)*3,
      vy: -rnd()*2 - 1,
      life: 25, color: palette.blood,
    });
  }
  // Жизней ровно столько, сколько значков в углу: на нуле - конец (раньше была лишняя четвёртая)
  if (lives <= 0) {
    lives = 0;
    player.alive = false;
    finish('over');
  }
}

function drawSky() {
  ctx.fillStyle = palette.skyTop;
  ctx.fillRect(0, 0, W, 60);
  ctx.fillStyle = palette.skyMid;
  ctx.fillRect(0, 60, W, 40);
  ctx.fillStyle = palette.skyLow;
  ctx.fillRect(0, 100, W, 20);
}

function drawMountains() {
  const off1 = -Math.floor(cameraX * 0.15) % 80;
  ctx.fillStyle = palette.mtnFar;
  for (let i = -1; i < 5; i++) {
    const bx = i * 80 + off1;
    ctx.beginPath();
    ctx.moveTo(bx, 120);
    ctx.lineTo(bx + 30, 80);
    ctx.lineTo(bx + 50, 95);
    ctx.lineTo(bx + 70, 75);
    ctx.lineTo(bx + 90, 120);
    ctx.fill();
  }
  const off2 = -Math.floor(cameraX * 0.3) % 100;
  ctx.fillStyle = palette.mtnNear;
  for (let i = -1; i < 5; i++) {
    const bx = i * 100 + off2;
    ctx.beginPath();
    ctx.moveTo(bx, 130);
    ctx.lineTo(bx + 25, 100);
    ctx.lineTo(bx + 45, 110);
    ctx.lineTo(bx + 65, 95);
    ctx.lineTo(bx + 90, 115);
    ctx.lineTo(bx + 110, 130);
    ctx.fill();
  }
}

function drawJungle() {
  const off1 = -Math.floor(cameraX * 0.5) % 32;
  ctx.fillStyle = palette.jungleFar;
  ctx.fillRect(0, 130, W, 30);
  for (let i = -1; i < 10; i++) {
    const bx = i * 32 + off1;
    ctx.beginPath();
    ctx.arc(bx + 10, 130, 14, 0, Math.PI*2);
    ctx.arc(bx + 22, 128, 12, 0, Math.PI*2);
    ctx.fill();
  }
  const off2 = -Math.floor(cameraX * 0.75) % 40;
  ctx.fillStyle = palette.jungleNear;
  for (let i = -1; i < 8; i++) {
    const bx = i * 40 + off2;
    ctx.beginPath();
    ctx.arc(bx + 12, 152, 16, 0, Math.PI*2);
    ctx.arc(bx + 28, 150, 14, 0, Math.PI*2);
    ctx.fill();
  }
  // Подлесок до самой земли: раньше между кустами и травой оставалась чёрная полоса
  ctx.fillRect(0, 158, W, GROUND_Y - 158);
}

function drawGround() {
  for (let x = 0; x < W; x++) {
    const wx = x + cameraX;
    if (pitAt(wx)) continue;
    ctx.fillStyle = palette.grass;
    ctx.fillRect(x, GROUND_Y, 1, 4);
    if ((wx % 8) < 2) {
      ctx.fillStyle = palette.grassDk;
      ctx.fillRect(x, GROUND_Y, 1, 2);
    }
    ctx.fillStyle = palette.ground;
    ctx.fillRect(x, GROUND_Y + 4, 1, H - GROUND_Y - 4);
    if ((wx % 16) < 4 && (wx % 32) < 16) {
      ctx.fillStyle = palette.groundDk;
      const yOff = ((wx * 7) % 24) + 8;
      ctx.fillRect(x, GROUND_Y + yOff, 1, 1);
    }
  }
  for (const p of pits) {
    const sx = p.x - cameraX;
    if (sx + p.w < 0 || sx > W) continue;
    const drawX = Math.max(0, sx);
    const drawW = Math.min(W, sx + p.w) - drawX;
    ctx.fillStyle = palette.water;
    ctx.fillRect(drawX, GROUND_Y + 2, drawW, H - GROUND_Y - 2);
    ctx.fillStyle = palette.waterDk;
    const off = (Math.floor(levelTime/4)) % 8;
    for (let x = drawX + off; x < drawX + drawW; x += 8) {
      ctx.fillRect(x, GROUND_Y + 6, 4, 1);
      ctx.fillRect(x + 4, GROUND_Y + 14, 3, 1);
      ctx.fillRect(x, GROUND_Y + 22, 4, 1);
    }
    ctx.fillStyle = palette.groundDk;
    ctx.fillRect(drawX - (sx >= 0 ? 1 : 0), GROUND_Y, 1, 4);
    if (sx + p.w < W) ctx.fillRect(sx + p.w, GROUND_Y, 1, 4);
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    const sx = p.x - cameraX;
    if (sx + p.w < 0 || sx > W) continue;
    ctx.fillStyle = palette.platform;
    ctx.fillRect(sx, p.y, p.w, 6);
    ctx.fillStyle = palette.platformTop;
    ctx.fillRect(sx, p.y, p.w, 1);
    ctx.fillStyle = palette.platformDk;
    ctx.fillRect(sx, p.y + 5, p.w, 1);
    for (let i = 4; i < p.w - 2; i += 8) {
      ctx.fillRect(sx + i, p.y + 2, 1, 3);
    }
  }
}

function drawTreesForeground() {
  for (let i = 0; i < 22; i++) {
    const tx = 200 + i * 200 + (i*73)%80;
    if (Math.abs(tx - BOSS_X) < 80) continue;
    const sx = tx - cameraX;
    if (sx < -40 || sx > W + 40) continue;
    ctx.fillStyle = palette.trunk;
    ctx.fillRect(sx, 100, 6, 88);
    ctx.fillStyle = palette.leavesDk;
    ctx.beginPath();
    ctx.arc(sx + 3, 100, 18, 0, Math.PI*2);
    ctx.arc(sx - 8, 105, 14, 0, Math.PI*2);
    ctx.arc(sx + 14, 105, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = palette.leaves;
    ctx.beginPath();
    ctx.arc(sx + 3, 96, 14, 0, Math.PI*2);
    ctx.arc(sx - 6, 102, 10, 0, Math.PI*2);
    ctx.arc(sx + 12, 102, 10, 0, Math.PI*2);
    ctx.fill();
  }
}

function px(x, y, c, w=1, h=1) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawPlayer() {
  if (!player.alive) return;
  if (player.invuln > 0 && Math.floor(player.invuln/4) % 2 === 0) return;

  const sx = Math.floor(player.x - cameraX);
  const sy = Math.floor(player.y);
  const d = player.dir;

  if (player.shieldTimer > 0) {
    const a = (Math.floor(levelTime/3)) % 2 === 0 ? 1 : 0.5;
    ctx.globalAlpha = a;
    ctx.strokeStyle = palette.shield;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(sx, sy - 11, 14, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (player.prone) {
    px(sx - 7 + (d>0?0:1), sy - 6, palette.pants, 14, 4);
    px(sx - 3 + (d>0?0:1), sy - 10, palette.bodyA, 12, 4);
    px(sx + (d>0?7:-6), sy - 12, palette.skin, 4, 4);
    px(sx + (d>0?7:-6), sy - 13, palette.bandana, 4, 1);
    px(sx + (d>0?9:-4), sy - 11, palette.uiDark, 1, 1);
    px(sx + (d>0?11:-16), sy - 10, palette.uiDark, 6, 1);
    return;
  }

  const f = player.walkFrame;
  const legA = (f === 1) ? 1 : (f === 3 ? -1 : 0);
  px(sx - 2, sy - 4, palette.pants, 3, 4);
  px(sx + 1, sy - 4, palette.pants, 3, 4);
  if (player.onGround && Math.abs(player.vx) > 0.1) {
    px(sx - 2, sy - 1 + Math.abs(legA), palette.pants, 3, 1);
    px(sx + 1, sy - 1 - Math.abs(legA), palette.pants, 3, 1);
  }
  px(sx - 3, sy - 14, palette.bodyA, 8, 10);
  px(sx - 3, sy - 14, palette.bodyB, 8, 1);
  px(sx - 1, sy - 18, palette.skin, 4, 4);
  px(sx - 1, sy - 19, palette.bandana, 4, 1);
  px(sx + (d>0?4:-2), sy - 19, palette.bandana, 1, 1);
  px(sx + (d>0?-2:5), sy - 17, palette.hair, 1, 1);
  px(sx + (d>0?2:0), sy - 16, palette.uiDark, 1, 1);

  if (player.aimUp && Math.abs(player.vx) > 0.1) {
    px(sx + d*3, sy - 16, palette.uiDark, 2, 2);
    px(sx + d*5, sy - 18, palette.uiDark, 2, 2);
    px(sx + d*6, sy - 20, palette.bullet, 1, 1);
  } else if (player.aimUp) {
    px(sx + 1, sy - 22, palette.uiDark, 2, 4);
    px(sx + 1, sy - 24, palette.bullet, 2, 1);
  } else {
    if (d > 0) {
      px(sx + 3, sy - 11, palette.uiDark, 6, 2);
      px(sx + 9, sy - 11, palette.bullet, 1, 2);
    } else {
      px(sx - 8, sy - 11, palette.uiDark, 6, 2);
      px(sx - 9, sy - 11, palette.bullet, 1, 2);
    }
  }
}

function drawEnemy(e) {
  const sx = Math.floor(e.x - cameraX);
  const sy = Math.floor(e.y);
  if (e.type === 'soldier') {
    const dirSign = e.dir;
    px(sx - 2, sy - 4, palette.enemyPants, 3, 4);
    px(sx + 1, sy - 4, palette.enemyPants, 3, 4);
    px(sx - 3, sy - 14, palette.enemyShirt, 8, 10);
    px(sx - 1, sy - 18, palette.skin, 4, 4);
    px(sx - 2, sy - 19, palette.uiDark, 6, 1);
    px(sx + (dirSign>0?2:0), sy - 16, palette.uiDark, 1, 1);
    if (dirSign > 0) px(sx + 3, sy - 11, palette.uiDark, 5, 2);
    else px(sx - 7, sy - 11, palette.uiDark, 5, 2);
  } else if (e.type === 'turret') {
    px(sx - 7, sy - 4, palette.uiDark, 14, 4);
    px(sx - 7, sy - 4, '#404040', 14, 1);
    px(sx - 4, sy - 10, palette.enemyShirt, 8, 6);
    px(sx - 4, sy - 11, '#601010', 8, 1);
    px(sx + (e.dir>0?4:-8), sy - 8, palette.uiDark, 4, 2);
    px(sx - 5, sy - 5, palette.bullet, 1, 1);
    px(sx + 4, sy - 5, palette.bullet, 1, 1);
  } else if (e.type === 'drone') {
    px(sx - 6, sy, palette.droneBody, 12, 5);
    px(sx - 6, sy, '#808898', 12, 1);
    px(sx - 6, sy + 4, palette.bossDk, 12, 1);
    px(sx - 4, sy + 5, palette.uiDark, 2, 2);
    px(sx + 2, sy + 5, palette.uiDark, 2, 2);
    const blink = (Math.floor(levelTime/8)) % 2;
    if (blink) px(sx, sy + 1, palette.droneLight, 2, 1);
    const propOff = (Math.floor(levelTime/3)) % 2;
    px(sx - 6 + propOff, sy - 1, '#a0a8b8', 4, 1);
    px(sx + 2 + propOff, sy - 1, '#a0a8b8', 4, 1);
  } else if (e.type === 'grenadier') {
    px(sx - 2, sy - 4, palette.bossDk, 3, 4);
    px(sx + 1, sy - 4, palette.bossDk, 3, 4);
    px(sx - 4, sy - 14, '#406048', 9, 10);
    px(sx - 1, sy - 18, palette.skin, 4, 4);
    px(sx - 3, sy - 19, '#508058', 8, 2);
    px(sx + (e.dir>0?2:0), sy - 16, palette.uiDark, 1, 1);
    if (e.dir > 0) {
      px(sx + 3, sy - 13, palette.uiDark, 7, 3);
      px(sx + 10, sy - 14, palette.bossDk, 2, 4);
    } else {
      px(sx - 9, sy - 13, palette.uiDark, 7, 3);
      px(sx - 11, sy - 14, palette.bossDk, 2, 4);
    }
  } else if (e.type === 'boss') {
    drawBoss(e, sx, sy);
  }
}

function drawBoss(e, sx, sy) {
  const flashCol = e.flash > 0 ? palette.uiWhite : null;
  ctx.fillStyle = flashCol || palette.bossDk;
  ctx.fillRect(sx - 25, sy - 56, 50, 56);
  ctx.fillStyle = flashCol || palette.bossBody;
  ctx.fillRect(sx - 22, sy - 53, 44, 50);
  ctx.fillStyle = flashCol || '#503030';
  ctx.fillRect(sx - 22, sy - 53, 44, 4);
  ctx.fillStyle = flashCol || palette.bossDk;
  ctx.fillRect(sx - 22, sy - 8, 44, 4);

  ctx.fillStyle = flashCol || palette.uiDark;
  ctx.fillRect(sx - 14, sy - 42, 12, 10);
  ctx.fillRect(sx + 2, sy - 42, 12, 10);
  ctx.fillStyle = flashCol || palette.bossEye;
  ctx.fillRect(sx - 11, sy - 39, 6, 4);
  ctx.fillRect(sx + 5, sy - 39, 6, 4);
  ctx.fillStyle = flashCol || '#ff8000';
  ctx.fillRect(sx - 9, sy - 38, 2, 2);
  ctx.fillRect(sx + 7, sy - 38, 2, 2);

  ctx.fillStyle = flashCol || palette.bossDk;
  ctx.fillRect(sx - 26, sy - 25, 4, 12);
  ctx.fillRect(sx - 30, sy - 22, 6, 8);
  ctx.fillStyle = flashCol || palette.uiDark;
  ctx.fillRect(sx - 38, sy - 20, 8, 4);

  ctx.fillStyle = flashCol || palette.bossBody;
  ctx.fillRect(sx + 22, sy - 25, 4, 12);
  ctx.fillStyle = flashCol || palette.uiDark;
  ctx.fillRect(sx + 24, sy - 32, 6, 6);

  ctx.fillStyle = flashCol || palette.bossDk;
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(sx - 20 + i*9, sy - 18, 6, 6);
  }
}

function drawPowerup(p) {
  const sx = Math.floor(p.x - cameraX);
  const sy = Math.floor(p.y);
  const blink = (Math.floor(levelTime/4)) % 2;
  let fill;
  if (p.kind === 'spread') fill = palette.pwS;
  else if (p.kind === 'rapid') fill = palette.pwR;
  else fill = palette.pwShield;
  ctx.fillStyle = palette.uiDark;
  ctx.fillRect(sx - 5, sy - 9, 10, 10);
  ctx.fillStyle = blink ? palette.uiWhite : fill;
  ctx.fillRect(sx - 4, sy - 8, 8, 8);
  ctx.fillStyle = palette.uiDark;
  if (p.kind === 'spread') {
    ctx.fillRect(sx - 3, sy - 7, 6, 1);
    ctx.fillRect(sx - 3, sy - 6, 1, 2);
    ctx.fillRect(sx - 3, sy - 4, 6, 1);
    ctx.fillRect(sx + 2, sy - 3, 1, 2);
    ctx.fillRect(sx - 3, sy - 1, 6, 1);
  } else if (p.kind === 'rapid') {
    ctx.fillRect(sx - 3, sy - 7, 5, 1);
    ctx.fillRect(sx - 3, sy - 6, 1, 5);
    ctx.fillRect(sx - 3, sy - 4, 4, 1);
    ctx.fillRect(sx, sy - 3, 1, 4);
    ctx.fillRect(sx + 2, sy - 3, 1, 4);
  } else {
    ctx.fillRect(sx - 1, sy - 7, 2, 1);
    ctx.fillRect(sx - 2, sy - 6, 1, 1);
    ctx.fillRect(sx + 1, sy - 6, 1, 1);
    ctx.fillRect(sx - 3, sy - 5, 1, 2);
    ctx.fillRect(sx + 2, sy - 5, 1, 2);
    ctx.fillRect(sx - 1, sy - 3, 2, 1);
    ctx.fillRect(sx, sy - 2, 1, 2);
  }
}

function drawBullet(b, color) {
  const sx = Math.floor(b.x - cameraX);
  const sy = Math.floor(b.y);
  if (b.grenade) {
    ctx.fillStyle = palette.bossDk;
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
    ctx.fillStyle = palette.spark;
    ctx.fillRect(sx - 1, sy - 1, 1, 1);
    return;
  }
  ctx.fillStyle = color;
  ctx.fillRect(sx - 1, sy - 1, 3, 2);
}

function drawParticle(p) {
  const sx = Math.floor(p.x - cameraX);
  const sy = Math.floor(p.y);
  ctx.fillStyle = p.color;
  ctx.fillRect(sx, sy, 2, 2);
}

function drawUI() {
  ctx.fillStyle = palette.uiDark;
  ctx.fillRect(0, 0, W, 14);
  ctx.fillStyle = palette.uiRed;
  ctx.fillRect(0, 13, W, 1);

  ctx.fillStyle = palette.uiYellow;
  ctx.font = '8px "Courier New", monospace';
  ctx.textBaseline = 'top';
  ctx.fillText('ОЧКИ', 6, 3);
  ctx.fillStyle = palette.uiWhite;
  ctx.fillText(String(score).padStart(6, '0'), 36, 3);

  ctx.fillStyle = palette.uiYellow;
  ctx.fillText('ЖИЗНИ', 96, 3);
  for (let i = 0; i < Math.max(0, lives); i++) {
    ctx.fillStyle = palette.uiRed;
    ctx.fillRect(126 + i*8, 4, 4, 6);
    ctx.fillStyle = palette.bandana;
    ctx.fillRect(126 + i*8, 3, 4, 1);
  }

  if (player.weapon !== 'normal') {
    const col = player.weapon === 'spread' ? palette.pwS : palette.pwR;
    ctx.fillStyle = col;
    ctx.fillText(player.weapon === 'spread' ? 'ВЕЕР' : 'БЫСТР', 168, 3);
    const t = Math.ceil(player.weaponTimer / 60);
    ctx.fillStyle = palette.uiWhite;
    ctx.fillText(t+'s', 210, 3);
  }
  if (player.shieldTimer > 0) {
    ctx.fillStyle = palette.shield;
    ctx.fillText('Щ'+Math.ceil(player.shieldTimer/60), 232, 3);
  }

  if (boss && boss.phase === 'fight') {
    ctx.fillStyle = palette.uiDark;
    ctx.fillRect(40, 22, W - 80, 6);
    ctx.fillStyle = palette.bossDk;
    ctx.fillRect(41, 23, W - 82, 4);
    const w = Math.floor((W - 82) * (boss.hp / boss.maxHp));
    ctx.fillStyle = palette.uiRed;
    ctx.fillRect(41, 23, w, 4);
    ctx.fillStyle = palette.bossEye;
    ctx.fillText('БОСС', 8, 22);
  }
}

function drawMessage(text, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 80, W, 80);
  ctx.fillStyle = palette.uiRed;
  ctx.font = '16px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, W/2, 100);
  if (sub) {
    ctx.fillStyle = palette.uiWhite;
    ctx.font = '8px "Courier New", monospace';
    ctx.fillText(sub, W/2, 130);
  }
  ctx.textAlign = 'left';
}

function reset() {
  player.x = 60; player.y = GROUND_Y;
  player.vx = 0; player.vy = 0;
  player.dir = 1; player.alive = true;
  player.invuln = 60;
  player.weapon = 'normal';
  player.weaponTimer = 0;
  player.shieldTimer = 0;
  player.onGround = true;
  player.onPlatform = { isGround: true, y: GROUND_Y };
  bullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  powerups.length = 0;
  score = 0;
  lives = START_LIVES;
  cameraX = 0;
  gameOver = false;
  gameWon = false;
  spawnTimer = 0;
  levelTime = 0;
  boss = null;
  bossSpawned = false;
  for (const c in keys) keys[c] = false;
  buildLevel();
}

function startGame() {
  reset();
  phase = 'play';
}

function finish(kind) {
  if (kind === 'won') gameWon = true; else gameOver = true;
  phase = kind;
  if (score > best) { best = score; saveBest(best); }
}

function togglePause() {
  if (phase === 'play') phase = 'paused';
  else if (phase === 'paused') phase = 'play';
  for (const c in keys) keys[c] = false;
}

// Один шаг мира (1/60 секунды)
function update() {
  if (phase === 'play') {
    levelTime++;
    if (!boss) {
      spawnTimer--;
      if (spawnTimer <= 0 && enemies.length < 5) {
        spawnTimer = 80 + rnd() * 60;
        spawnEnemy();
      }
    }
    updatePlayer();
    updateBullets();
    updateEnemies();
    updatePowerups();
    updateParticles();
  } else if (phase === 'over' || phase === 'won') {
    updateParticles();
  }
  for (const code in justPressed) justPressed[code] = false;
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawMountains();
  drawJungle();
  drawTreesForeground();
  drawGround();
  drawPlatforms();

  for (const e of enemies) drawEnemy(e);
  for (const p of powerups) drawPowerup(p);
  if (phase !== 'ready') drawPlayer();
  for (const b of bullets) drawBullet(b, palette.bullet);
  for (const b of enemyBullets) drawBullet(b, palette.bulletEnemy);
  for (const p of particles) drawParticle(p);

  drawUI();

  if (phase === 'ready') drawMessage('ОГНЕННЫЕ ДЖУНГЛИ', 'Пробел или Enter - в бой. Дойди до крепости');
  else if (phase === 'paused') drawMessage('ПАУЗА', 'P или Esc - продолжить');
  else if (phase === 'over') drawMessage('КОНЕЦ ИГРЫ', 'Очки ' + score + ' · рекорд ' + best + ' · Enter - заново');
  else if (phase === 'won') drawMessage('ЗАДАНИЕ ВЫПОЛНЕНО', 'Очки ' + score + ' · рекорд ' + best + ' · Enter - ещё');
  if (muted) { ctx.fillStyle = palette.uiWhite; ctx.font = '8px Consolas, monospace'; ctx.textBaseline = 'top'; ctx.fillText('звук выкл', 4, H - 10); }
}

// Холст 256x240 масштабируется под окно (раньше был прибит к 768x720 и не влезал в 800 по высоте)
function fitCanvas() {
  const header = 34, info = 76, pad = 16;
  const maxW = Math.min(window.innerWidth - 2 * pad, (window.innerHeight - header - info - pad) * W / H);
  const cssW = Math.max(256, Math.floor(maxW));
  cv.style.width = cssW + 'px';
  cv.style.height = Math.round(cssW * H / W) + 'px';
  // Внутреннее разрешение - целое кратное 256x240: пиксели остаются квадратными,
  // а мелкий текст (кириллица 8px) рисуется чётко, а не размытой кашей.
  const k = Math.max(1, Math.round(cssW * (window.devicePixelRatio || 1) / W));
  cv.width = W * k;
  cv.height = H * k;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  render();
  requestAnimationFrame(loop);
}

addEventListener('resize', fitCanvas);
reset();
fitCanvas();
requestAnimationFrame(loop);

// Крючок для проверок: не влияет на обычную игру
window.__game = {
  ready: true,
  W, H, GROUND_Y, LEVEL_W, keys, justPressed, player, enemies, bullets, enemyBullets, powerups, pits, platforms,
  get phase() { return phase; },
  get score() { return score; }, set score(v) { score = v; },
  get lives() { return lives; }, get best() { return best; },
  get cameraX() { return cameraX; }, set cameraX(v) { cameraX = v; },
  get boss() { return boss; },
  step(n = 1) { for (let i = 0; i < n; i++) update(); render(); },
  start: startGame, spawnEnemy, spawnBoss, hitPlayer, pitAt, togglePause,
  press(code) { justPressed[code] = true; keys[code] = true; },
};
</script>
</body>
