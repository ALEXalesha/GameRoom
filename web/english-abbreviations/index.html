<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарь английских сокращений</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#171a35; --card:#1e2243; --card2:#262b52;
    --accent:#7c8cff; --accent2:#54d6c4; --text:#e8eaff; --muted:#9aa0d4;
    --border:#2e3460; --chip:#2a2f59; --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:linear-gradient(160deg,#0f1226,#15173a 60%,#1a1340);
    color:var(--text);min-height:100vh;padding:24px 16px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{text-align:center;margin-bottom:24px}
  h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:.5px;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin-top:8px;font-size:15px}
  .controls{position:sticky;top:0;z-index:20;padding:14px 0 10px;
    background:linear-gradient(180deg,rgba(15,18,38,.96),rgba(15,18,38,.85));
    backdrop-filter:blur(8px)}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  #search{flex:1;min-width:220px;padding:14px 18px;border-radius:14px;
    border:1px solid var(--border);background:var(--card);color:var(--text);
    font-size:16px;outline:none;transition:.2s}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
  .count{align-self:center;color:var(--muted);font-size:14px;white-space:nowrap}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .cat{padding:7px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--chip);color:var(--muted);cursor:pointer;font-size:13px;
    transition:.15s;user-select:none}
  .cat:hover{color:var(--text);border-color:var(--accent)}
  .cat.active{background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f1226;font-weight:700;border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;margin-top:18px}
  .card{background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--border);border-radius:16px;padding:16px 18px;
    box-shadow:0 6px 18px var(--shadow);transition:.18s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .abbr{font-size:22px;font-weight:800;color:var(--accent2);letter-spacing:.5px}
  .full{font-size:14px;color:var(--text);margin-top:4px;font-weight:600}
  .ru{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.45}
  .ru b{color:var(--text)}
  .tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:8px;
    background:var(--chip);color:var(--accent);font-size:11px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:18px}
  mark{background:rgba(84,214,196,.35);color:var(--text);border-radius:3px;padding:0 2px}
  footer{text-align:center;color:var(--muted);margin-top:40px;font-size:13px}
  .toolbar{display:flex;justify-content:flex-end;margin-top:8px}
  .print-btn{background:none;border:1px solid var(--border);color:var(--muted);
    padding:6px 14px;border-radius:10px;cursor:pointer;font-size:13px}
  .print-btn:hover{color:var(--text);border-color:var(--accent)}
  @media print{
    body{background:#fff;color:#000}
    .controls,footer,.toolbar{display:none}
    .card{break-inside:avoid;border:1px solid #ccc;box-shadow:none;background:#fff}
    .abbr{color:#1a4}.ru{color:#333}.full{color:#000}
    h1{color:#222;-webkit-text-fill-color:#222}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📖 Словарь английских сокращений</h1>
    <p class="sub">Интернет-сленг, переписка, бизнес и игры — расшифровка + перевод на русский</p>
  </header>

  <div class="controls">
    <div class="search-row">
      <input id="search" type="text" placeholder="🔍 Поиск: btw, перевод, кстати…" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div class="cats" id="cats"></div>
  </div>

  <div class="toolbar">
    <button class="print-btn" onclick="window.print()">🖨 Печать / сохранить в PDF</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Ничего не найдено 🤷</div>

  <footer>Всего сокращений: <span id="total"></span> · Нажми на категорию или начни печатать</footer>
</div>

const CATS = {
  all:"🌐 Все", chat:"💬 Переписка", emotion:"😂 Эмоции", social:"📱 Соцсети",
  love:"❤️ Отношения", biz:"💼 Бизнес", tech:"⚙️ IT", game:"🎮 Игры", misc:"🧩 Прочее"
};

let activeCat = "all", query = "";
const grid = document.getElementById('grid');
const catsEl = document.getElementById('cats');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
document.getElementById('total').textContent = DATA.length;

// строим кнопки категорий
Object.entries(CATS).forEach(([k,v])=>{
  const b=document.createElement('div');
  b.className='cat'+(k==='all'?' active':'');
  b.textContent=v; b.dataset.cat=k;
  b.onclick=()=>{activeCat=k;[...catsEl.children].forEach(c=>c.classList.toggle('active',c.dataset.cat===k));render();};
  catsEl.appendChild(b);
});

function hl(text,q){
  if(!q) return text;
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}

function render(){
  const q=query.trim().toLowerCase();
  const list=DATA.filter(([a,f,r,c])=>{
    if(activeCat!=='all' && c!==activeCat) return false;
    if(!q) return true;
    return (a+' '+f+' '+r).toLowerCase().includes(q);
  });
  grid.innerHTML='';
  list.forEach(([a,f,r,c])=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<div class="abbr">${hl(a,q)}</div>
      <div class="full">${hl(f,q)}</div>
      <div class="ru">🇷🇺 ${hl(r,q)}</div>
      <span class="tag">${CATS[c].replace(/^\S+\s/,'')}</span>`;
    grid.appendChild(d);
  });
  emptyEl.style.display=list.length?'none':'block';
  countEl.textContent=`Найдено: ${list.length}`;
}

document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
render();
</script>
</body>
</html>
