<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарь английских сокращений</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#171a35; --card:#1e2243; --card2:#262b52;
    --accent:#7c8cff; --accent2:#54d6c4; --text:#e8eaff; --muted:#9aa0d4;
    --border:#2e3460; --chip:#2a2f59; --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:linear-gradient(160deg,#0f1226,#15173a 60%,#1a1340) fixed;
    color:var(--text);min-height:100vh;padding:24px 16px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{text-align:center;margin-bottom:16px}
  h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:.5px;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin-top:8px;font-size:15px}
  .controls{position:sticky;top:0;z-index:20;padding:14px 0 10px;
    background:linear-gradient(180deg,rgba(15,18,38,.97),rgba(15,18,38,.9));
    backdrop-filter:blur(8px)}
  .search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search-box{flex:1;min-width:220px;position:relative}
  #search{width:100%;padding:14px 44px 14px 18px;border-radius:14px;
    border:1px solid var(--border);background:var(--card);color:var(--text);
    font-size:16px;outline:none;transition:.2s}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
  #search::-webkit-search-cancel-button{display:none}
  .clear-q{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:50%;border:none;background:transparent;
    color:var(--muted);font-size:18px;cursor:pointer;display:none}
  .clear-q.show{display:block}
  .clear-q:hover{background:var(--chip);color:var(--text)}
  .count{color:var(--muted);font-size:14px;white-space:nowrap}
  .layout-hint{color:var(--accent2);font-size:13px;margin-top:8px;min-height:0}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .cat{padding:7px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--chip);color:var(--muted);cursor:pointer;font-size:13px;
    font-family:inherit;transition:.15s}
  .cat .n{opacity:.7;margin-left:4px;font-size:12px}
  .cat:hover{color:var(--text);border-color:var(--accent)}
  .cat:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .cat[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f1226;font-weight:700;border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;margin-top:18px}
  .card{background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--border);border-radius:16px;padding:16px 18px;
    box-shadow:0 6px 18px var(--shadow);transition:transform .18s,border-color .18s;
    position:relative;overflow:hidden;cursor:pointer;text-align:left;color:inherit;
    font:inherit;width:100%}
  .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
  .abbr{font-size:22px;font-weight:800;color:var(--accent2);letter-spacing:.5px}
  .full{font-size:14px;color:var(--text);margin-top:4px;font-weight:600}
  .ru{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.45}
  .ru .lang{font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--border);
    border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:1px}
  .tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:8px;
    background:var(--chip);color:var(--accent);font-size:11px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:18px}
  mark{background:rgba(84,214,196,.35);color:var(--text);border-radius:3px;padding:0 1px}
  footer{text-align:center;color:var(--muted);margin-top:40px;font-size:13px;line-height:1.6}
  kbd{border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:12px;background:var(--chip)}
  .toolbar{display:flex;justify-content:flex-end;margin-top:8px}
  .print-btn{background:none;border:1px solid var(--border);color:var(--muted);
    padding:6px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}
  .print-btn:hover{color:var(--text);border-color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--accent2);color:#0f1226;padding:10px 18px;border-radius:12px;font-weight:600;
    opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media print{
    body{background:#fff;color:#000;padding:0}
    .controls,footer,.toolbar,.toast{display:none}
    .card{break-inside:avoid;border:1px solid #ccc;box-shadow:none;background:#fff}
    .abbr{color:#1a4}.ru{color:#333}.full{color:#000}
    h1{color:#222;-webkit-text-fill-color:#222}
  }
</style>
</head>

<div class="wrap">
  <header>

    </div>
    <div class="layout-hint" id="layoutHint"></div>
    <div class="cats" id="cats" role="group" aria-label="Категории"></div>
  </div>

  <div class="toolbar">
    <button class="print-btn" onclick="window.print()">Печать / сохранить в PDF</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ничего не найдено. Попробуйте другое слово или категорию «Все».</div>

  <footer>Всего сокращений: <span id="total"></span><br>
    <kbd>/</kbd> - к поиску · <kbd>Esc</kbd> - очистить · щелчок по карточке копирует её текст</footer>
</div>
<div class="toast" id="toast" role="status"></div>

function norm(s) { return s.toLowerCase().replace(/[^a-z0-9а-яё]/g, ''); }

const EN = 'qwertyuiop[]asdfghjkl;\'zxcvbnm,.';
function swapLayout(s) {
  let out = '', changed = false;
  for (const ch of s.toLowerCase()) {
    const k = RU.indexOf(ch);
    if (k >= 0) { out += EN[k]; changed = true; } else out += ch;
  }
  return changed ? out : null;
}

let activeCat = 'all', query = '';
const grid = document.getElementById('grid');
const catsEl = document.getElementById('cats');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const clearEl = document.getElementById('clearQ');
const hintEl = document.getElementById('layoutHint');
document.getElementById('total').textContent = ITEMS.length;

Object.entries(CATS).forEach(([k, v]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'cat';
  b.dataset.cat = k;
  const n = k === 'all' ? ITEMS.length : ITEMS.filter(x => x.cat === k).length;
  b.innerHTML = `${v}<span class="n">${n}</span>`;
  b.onclick = () => { activeCat = k; render(); saveState(); };
  catsEl.appendChild(b);
});

// Оценка совпадения записи со словами запроса: меньше - выше в списке, null - не подходит.
function score(item, words) {
  let total = 0;
  for (const w of words) {
    const wk = norm(w);
    if (wk && item.key === wk) { total += 0; continue; }
    if (wk && item.key.startsWith(wk)) { total += 1; continue; }
    const pos = item.text.indexOf(w);
    if (pos < 0) {
      if (wk && item.key.includes(wk) && wk.length > 1) { total += 4; continue; }
      return null;
    }
    const atWordStart = pos === 0 || /[\s(/«"-]/.test(item.text[pos - 1]);
    total += atWordStart ? 2 : 3;
  }
  return total;
}

function search(q, cat) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const res = [];
  for (const it of ITEMS) {
    if (cat !== 'all' && it.cat !== cat) continue;
    if (!words.length) { res.push({ it, s: 0 }); continue; }
    const s = score(it, words);
    if (s !== null) res.push({ it, s });
  }
  res.sort((a, b) => a.s - b.s || a.it.i - b.it.i);
  return res.map(r => r.it);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Подсветка всех вхождений всех слов; текст экранируется.
function hl(text, words) {
  const ws = words.filter(w => w.length > 0).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!ws.length) return esc(text);
  const re = new RegExp('(' + ws.join('|') + ')', 'gi');
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (m[0] === '') { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function render() {
  const q = query.trim();
  let list = search(q, activeCat);
  let words = q.toLowerCase().split(/\s+/).filter(Boolean);
  hintEl.textContent = '';
  if (!list.length && q) {
    const swapped = swapLayout(q);
    if (swapped) {
      const alt = search(swapped, activeCat);
      if (alt.length) {
        list = alt;
        words = swapped.split(/\s+/).filter(Boolean);
        hintEl.textContent = `Показаны результаты для «${swapped}» (похоже, включена русская раскладка)`;
      }
    }
  }
  [...catsEl.children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === activeCat)));
  clearEl.classList.toggle('show', !!query);

  const frag = document.createDocumentFragment();
  for (const it of list) {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'card';
    d.dataset.abbr = it.abbr;
    d.title = 'Скопировать';
    d.innerHTML = `<div class="abbr">${hl(it.abbr, words)}</div>
      <div class="full">${hl(it.full, words)}</div>
      <div class="ru"><span class="lang">RU</span>${hl(it.ru, words)}</div>
      <span class="tag">${esc(CATS[it.cat])}</span>`;
    d.onclick = () => copyItem(it);
    frag.appendChild(d);
  }
  grid.replaceChildren(frag);
  emptyEl.hidden = list.length > 0;
  countEl.textContent = `Найдено: ${list.length}`;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyItem(it) {
  const text = `${it.abbr} - ${it.full} - ${it.ru}`;
  try {
    await navigator.clipboard.writeText(text);
    toast(`Скопировано: ${it.abbr}`);
  } catch (e) {
    toast('Не удалось скопировать: браузер запретил доступ к буферу');
  }
}

// Поиск и категория живут в адресе (#q=...&cat=...): переживают перезагрузку, ссылкой можно поделиться.
function saveState() {
  const p = new URLSearchParams();
  if (query) p.set('q', query);
  if (activeCat !== 'all') p.set('cat', activeCat);
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function loadState() {
  const p = new URLSearchParams(location.hash.slice(1));
  query = p.get('q') || '';
  const c = p.get('cat');
  activeCat = c && CATS[c] ? c : 'all';
  searchEl.value = query;
}

let inputTimer;
searchEl.addEventListener('input', e => {
  query = e.target.value;
  clearTimeout(inputTimer);
  render();
  inputTimer = setTimeout(saveState, 300);
});
clearEl.onclick = () => { query = ''; searchEl.value = ''; render(); saveState(); searchEl.focus(); };

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); searchEl.select(); }
  else if (e.key === 'Escape') { if (query) clearEl.onclick(); else searchEl.blur(); }
});
window.addEventListener('hashchange', () => { loadState(); render(); });

loadState();
render();
</script>
</body>
