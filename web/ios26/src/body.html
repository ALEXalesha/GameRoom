<body>
<div class="stage" id="stage">
<div class="device" id="device">
  <div class="side-btn" id="power-btn" title="Кнопка блокировки"></div>
  <div class="screen" id="screen">
    <div class="dynamic-island"></div>
    <div id="torch-glow"></div>
    <div id="dim-layer"></div>

    <!-- ===== ЭКРАН БЛОКИРОВКИ ===== -->
    <div class="page active" id="lock-page">
      <div class="wallpaper" id="lock-wall"></div>
      <div class="status-bar" data-sb></div>
      <div class="lock-clock">
        <div class="lock-date" id="lock-date"></div>
        <div class="lock-time" id="lock-time"></div>
      </div>
      <div class="lock-widgets">
        <div class="widget">
          <div class="widget-title">Погода</div>
          <div class="widget-value" id="w-temp">+18°</div>
          <div class="widget-sub">Лиссабон · облачно</div>
        </div>
        <div class="widget">
          <div class="widget-title">Календарь</div>
          <div class="widget-value" id="w-events"></div>
          <div class="widget-sub" id="w-next"></div>
        </div>
      </div>
      <div class="lock-bottom">
        <div class="lock-circle" data-lock="torch" role="button" aria-label="Фонарик" title="Фонарик">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8v4l-2 3v13h-4V9L8 6z"/></svg>
        </div>
        <div class="lock-circle" data-lock="camera" role="button" aria-label="Камера" title="Камера">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 4l-1.5 2H4a1 1 0 00-1 1v11a1 1 0 001 1h16a1 1 0 001-1V7a1 1 0 00-1-1h-3.5L15 4zm3 5a4 4 0 110 8 4 4 0 010-8z"/></svg>
        </div>
      </div>
      <div class="swipe-hint">Нажмите или смахните вверх, чтобы открыть</div>
      <div class="home-indicator"></div>
    </div>

    <!-- ===== ДОМАШНИЙ ЭКРАН ===== -->
    <div class="page" id="home-page">
      <div class="home-wallpaper" id="home-wall"></div>
      <div class="status-bar" data-sb></div>
      <div class="home-grid" id="home-grid"></div>
      <div class="home-search" id="home-search" role="button" tabindex="0" aria-label="Поиск"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Поиск</span></div>
      <div class="dock" id="dock"></div>
      <div class="home-indicator"></div>
      <div class="control-center" id="control-center" role="dialog" aria-label="Пункт управления">
        <div class="cc-back"></div>
        <div class="cc-grid">
          <div class="cc-tile large">
            <div class="cc-conn">
              <div class="cc-conn-item" data-cc="airplane" title="Авиарежим" role="button" aria-label="Авиарежим"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
              <div class="cc-conn-item green" data-cc="cellular" title="Сотовые данные" role="button" aria-label="Сотовые данные"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h2v-4H2zm4 0h2v-7H6zm4 0h2v-10h-2zm4 0h2v-13h-2zm4 0h2V6h-2z"/></svg></div>
              <div class="cc-conn-item" data-cc="wifi" title="Wi-Fi" role="button" aria-label="Wi-Fi"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18a2 2 0 100 4 2 2 0 000-4zm0-4c-1.5 0-2.9.5-4 1.4l1.4 1.4c.7-.5 1.6-.8 2.6-.8s1.9.3 2.6.8l1.4-1.4c-1.1-.9-2.5-1.4-4-1.4zm0-4c-2.7 0-5.2 1-7 2.7l1.4 1.4c1.5-1.3 3.5-2.1 5.6-2.1s4.1.8 5.6 2.1l1.4-1.4c-1.8-1.7-4.3-2.7-7-2.7zm0-4C8.4 6 5.1 7.4 2.6 9.7L4 11.1C6.1 9.2 8.9 8 12 8s5.9 1.2 8 3.1l1.4-1.4C18.9 7.4 15.6 6 12 6z"/></svg></div>
              <div class="cc-conn-item" data-cc="bt" title="Bluetooth" role="button" aria-label="Bluetooth"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2v8.6L7.4 6 6 7.4l5.6 4.6L6 16.6 7.4 18l4.6-4.6V22l5-5-3.6-3 3.6-3-5-5zm2 4.4l1.6 1.6L14 9.6V6.4zm0 9.2L15.6 17 14 18.6v-3z"/></svg></div>
            </div>
          </div>
          <div class="cc-tile large cc-music" role="group" aria-label="Музыка"><div class="ccm-art"></div><div><div class="ccm-t" id="ccm-title">Не исполняется</div><div class="ccm-a">Музыка</div></div><div class="ccm-row"><button data-cc-music="prev" title="Назад" aria-label="Предыдущая"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L20 18V6z"/></svg></button><button data-cc-music="play" title="Играть" aria-label="Играть или пауза"><svg viewBox="0 0 24 24" fill="currentColor"><path class="ccm-icon" d="M8 5v14l11-7L8 5z"/></svg></button><button data-cc-music="next" title="Вперёд" aria-label="Следующая"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 18l10.5-6L4 6z"/></svg></button></div></div>
          <div class="cc-slider tall" data-slider="brightness" style="grid-column: span 1; grid-row: span 2;" role="slider" aria-label="Яркость"><div class="cc-slider-fill"></div><div></div><svg class="cc-slider-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div class="cc-slider tall" data-slider="volume" style="grid-column: span 1; grid-row: span 2;" role="slider" aria-label="Громкость"><div class="cc-slider-fill"></div><div></div><svg class="cc-slider-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9.5v5h3.5L11 19V5L6.5 9.5z"/><path d="M14.5 8.5a5 5 0 010 7M17 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <button class="cc-tile" data-cc="rotation" title="Блокировка поворота"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 014 4v3h1a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2v-9a2 2 0 012-2h1V6a4 4 0 014-4zm0 2a2 2 0 00-2 2v3h4V6a2 2 0 00-2-2z"/></svg><span class="cc-label">Поворот</span></button>
          <button class="cc-tile" data-open="clock" title="Часы"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/></svg><span class="cc-label">Часы</span></button>
          <button class="cc-tile" data-cc="dnd" title="Не беспокоить"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span class="cc-label">Не беспок.</span></button>
          <button class="cc-tile" data-cc="dark" title="Тёмная тема"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 010 16z"/></svg><span class="cc-label">Тёмная</span></button>
          <button class="cc-tile" data-open="camera" title="Камера"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M9 4l-1.5 2H4a1 1 0 00-1 1v11a1 1 0 001 1h16a1 1 0 001-1V7a1 1 0 00-1-1h-3.5L15 4zm3 5a4 4 0 110 8 4 4 0 010-8z"/></svg><span class="cc-label">Камера</span></button>
          <button class="cc-tile" data-cc="torch" title="Фонарик"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8v4l-2 3v13h-4V9L8 6z"/></svg><span class="cc-label">Фонарик</span></button>
          <button class="cc-tile" data-open="calc" title="Калькулятор"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="2" width="14" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 6h8v3H8zM8 12h2v2H8zm4 0h2v2h-2zm-4 4h2v2H8zm4 0h2v2h-2z"/></svg><span class="cc-label">Кальк.</span></button>
          <button class="cc-tile" data-action="lock" title="Заблокировать"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 014 4v3h1a2 2 0 012 2v9a2 2 0 01-2 2H7a2 2 0 01-2-2v-9a2 2 0 012-2h1V6a4 4 0 014-4zm0 2a2 2 0 00-2 2v3h4V6a2 2 0 00-2-2z"/></svg><span class="cc-label">Блок.</span></button>
        </div>
        <div class="cc-note">Смахните вверх или нажмите Esc, чтобы закрыть</div>
      </div>
    </div>

    <div id="apps"></div>
  </div>
</div>
</div>
<button class="reset-btn" id="lock-btn">Заблокировать</button>

<script>
'use strict';
// ================================================================
// Телефон «Стекло»: фан-концепт интерфейса, не связан с Microsoft/Apple/Samsung.
// Всё работает без сети; состояние хранится в localStorage под префиксом «ios26.».
// ================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('ios26.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ios26.' + k, JSON.stringify(v)); } catch (e) { /* нет хранилища */ } },
  clear() { try { Object.keys(localStorage).filter(k => k.startsWith('ios26.')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* нет доступа */ } },
};
const listeners = {};
const on = (ev, fn) => (listeners[ev] = listeners[ev] || new Set()).add(fn);
const emit = ev => (listeners[ev] || []).forEach(fn => fn());
const DAYS = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const dayKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

// ===== Настройки =====
const WALLS = {
  liquid: { name: 'Стекло', lock: 'radial-gradient(ellipse at 80% 15%, #2f5bd8 0%, transparent 55%), radial-gradient(ellipse at 20% 85%, #0e7490 0%, transparent 55%), linear-gradient(180deg, #060c2a 0%, #0a1c52 55%, #02040e 100%)',
    home: 'radial-gradient(ellipse at 80% 15%, #2f5bd8 0%, transparent 55%), radial-gradient(ellipse at 20% 85%, #0e7490 0%, transparent 55%), linear-gradient(180deg, #060c2a 0%, #0a1c52 55%, #02040e 100%)' },
  pearl: { name: 'Жемчуг', lock: 'radial-gradient(ellipse at 20% 15%, #ffffff 0%, transparent 55%), radial-gradient(ellipse at 85% 80%, #fed7aa 0%, transparent 55%), linear-gradient(180deg, #fff7fb 0%, #f6f1ff 55%, #fff6ec 100%)',
    home: 'radial-gradient(ellipse at 20% 15%, #ffffff 0%, transparent 55%), radial-gradient(ellipse at 85% 80%, #fed7aa 0%, transparent 55%), linear-gradient(180deg, #fff7fb 0%, #f6f1ff 55%, #fff6ec 100%)' },
  aurora: { name: 'Сияние', lock: 'radial-gradient(ellipse at 30% 20%, #ff7eb3 0%, transparent 50%), radial-gradient(ellipse at 70% 60%, #7873f5 0%, transparent 50%), radial-gradient(ellipse at 40% 90%, #4ac1ff 0%, transparent 50%), linear-gradient(135deg, #1a0033 0%, #0d0d2b 100%)',
    home: 'radial-gradient(ellipse at 50% 0%, #ffa07a 0%, transparent 40%), radial-gradient(ellipse at 0% 50%, #ff6b9d 0%, transparent 40%), radial-gradient(ellipse at 100% 80%, #5e72eb 0%, transparent 50%), linear-gradient(180deg, #2d1b69 0%, #11052c 100%)' },
  ocean: { name: 'Океан', lock: 'radial-gradient(ellipse at 50% 30%, #67e8f9 0%, transparent 50%), linear-gradient(180deg, #0c4a6e 0%, #082f49 100%)', home: 'radial-gradient(ellipse at 20% 80%, #22d3ee 0%, transparent 50%), linear-gradient(180deg, #075985 0%, #0c1a33 100%)' },
  sunset: { name: 'Закат', lock: 'radial-gradient(ellipse at 50% 90%, #fde68a 0%, transparent 50%), linear-gradient(180deg, #312e81 0%, #be185d 70%, #fb923c 100%)', home: 'linear-gradient(180deg, #4c1d95 0%, #be185d 60%, #f97316 100%)' },
  forest: { name: 'Лес', lock: 'radial-gradient(ellipse at 70% 30%, #86efac 0%, transparent 45%), linear-gradient(160deg, #064e3b 0%, #14532d 60%, #1a2e05 100%)', home: 'radial-gradient(ellipse at 30% 20%, #4ade80 0%, transparent 45%), linear-gradient(180deg, #14532d 0%, #052e16 100%)' },
};
const DEF = { airplane: false, cellular: true, wifi: true, bt: true, dnd: false, dark: false, torch: false, rotation: false, brightness: 100, volume: 60, wallpaper: 'liquid', glass: true };
const S = Object.assign({}, DEF, store.get('settings', {}));
function applySettings() {
  const w = WALLS[S.wallpaper] || WALLS.liquid;
  $('lock-wall').style.background = w.lock;
  $('home-wall').style.background = w.home;
  document.body.classList.toggle('dark', S.dark);
  document.body.classList.toggle('no-glass', !S.glass);
  $('torch-glow').style.display = S.torch ? 'block' : 'none';
  $('dim-layer').style.opacity = String((100 - S.brightness) / 100 * 0.7);
  document.querySelectorAll('[data-cc]').forEach(t => { const on = !!S[t.dataset.cc]; t.classList.toggle(t.classList.contains('cc-conn-item') ? 'on' : 'active', on); if (t.classList.contains('cc-conn-item')) t.classList.toggle('off', !on); });
  document.querySelectorAll('[data-lock="torch"]').forEach(b => b.classList.toggle('on', S.torch));
  document.querySelectorAll('[data-slider]').forEach(sl => { sl.querySelector('.cc-slider-fill').style.height = S[sl.dataset.slider] + '%'; sl.setAttribute('aria-valuenow', S[sl.dataset.slider]); });
  renderStatusBars();
  emit('settings');
}
function setS(k, v) {
  S[k] = v;
  if (k === 'airplane' && v) { S.wifi = false; S.bt = false; S.cellular = false; }
  if (['wifi', 'bt', 'cellular'].includes(k) && v) S.airplane = false;
  store.set('settings', S);
  applySettings();
}

// ===== Строка состояния =====
function statusHTML() {
  const d = new Date();
  // значки строки состояния в пропорциях телефона: полоски связи 18x12, веер Wi-Fi 16x12, батарея 27x13
  const moon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.6 8.6 0 019.8 3.5a8.6 8.6 0 1010.7 10.7z"/></svg>';
  const net = S.airplane ? '<svg width="16" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>'
    : (S.cellular ? '<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3.2" height="4" rx="0.9"/><rect x="4.9" y="5.6" width="3.2" height="6.4" rx="0.9"/><rect x="9.8" y="3" width="3.2" height="9" rx="0.9"/><rect x="14.7" y="0" width="3.2" height="12" rx="0.9"/></svg>' : '') +
      (S.wifi ? '<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.7 10.7 0 008 .6 10.7 10.7 0 00.5 3.6l1.2 1.3A9 9 0 018 2.4z"/><path d="M8 5.9c1.5 0 2.9.6 3.9 1.5l1.2-1.3A7.4 7.4 0 008 4.1c-2 0-3.8.8-5.1 2l1.2 1.3c1-.9 2.4-1.5 3.9-1.5z"/><path d="M8 9.3c.6 0 1.2.2 1.6.6L8 11.6 6.4 9.9c.4-.4 1-.6 1.6-.6z"/></svg>' : '');
  return '<span class="time">' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + '</span><span class="right" title="Пункт управления">' + (S.dnd ? moon : '') + net +
    '<svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.6" y="0.6" width="23.4" height="11.8" rx="3.6" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.1"/><rect x="2.4" y="2.4" width="19.8" height="8.2" rx="2.2" fill="currentColor"/><path d="M25.5 4.6v3.8c.8-.3 1.3-1 1.3-1.9s-.5-1.6-1.3-1.9z" fill="currentColor" fill-opacity="0.45"/></svg></span>';
}
function renderStatusBars() { const h = statusHTML(); document.querySelectorAll('[data-sb]').forEach(sb => { if (sb.innerHTML !== h) sb.innerHTML = h; }); }
document.addEventListener('click', e => { if (e.target.closest('.status-bar .right') && $('home-page').classList.contains('active') && !document.querySelector('.app-screen.active')) openCC(); });

// ===== Значки =====
// Значки: суперэллипс (форма в CSS), насыщенный градиент с бликом сверху и объёмный белый знак.
// Нарисованы заново в духе телефона, без чужих логотипов.
const G60 = (inner) => '<svg width="100%" height="100%" viewBox="0 0 60 60">' + inner + '</svg>';
const ICONS = {
  phone: ['icon-phone', G60('<path fill="#fff" d="M21.6 15.4c1-.6 2.3-.3 3 .6l3.3 4.6c.6.9.6 2.1-.1 2.9l-2 2.4c1.6 3.4 4.3 6.1 7.7 7.7l2.4-2c.8-.7 2-.7 2.9-.1l4.6 3.3c.9.7 1.2 2 .6 3l-1.6 2.6c-.8 1.3-2.4 2-3.9 1.6C28.9 39.6 20.4 31.1 17.9 21.5c-.4-1.5.3-3.1 1.6-3.9z"/>')],
  messages: ['icon-messages', G60('<path fill="#fff" d="M30 14.5c-9.7 0-17.5 6.4-17.5 14.3 0 4.6 2.7 8.7 6.9 11.3-.4 2.2-1.6 4.2-3.3 5.6 3.2.2 6.3-.9 8.7-2.9 1.7.4 3.4.6 5.2.6 9.7 0 17.5-6.4 17.5-14.3S39.7 14.5 30 14.5z"/>')],
  mail: ['icon-mail', G60('<rect x="11" y="17" width="38" height="26" rx="4.5" fill="#fff"/><path d="M12.5 19.5L30 32l17.5-12.5" fill="none" stroke="#2f7bff" stroke-width="2.4" stroke-linejoin="round"/>')],
  browser: ['icon-browser', G60('<circle cx="30" cy="30" r="19" fill="url(#ic-cmp)"/><defs><linearGradient id="ic-cmp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#29c8ff"/><stop offset="1" stop-color="#1060ff"/></linearGradient></defs>' +
    Array.from({ length: 24 }, (_, i) => '<rect x="29.4" y="12.5" width="1.2" height="' + (i % 6 ? 2.4 : 4) + '" fill="#fff" opacity="0.85" transform="rotate(' + i * 15 + ' 30 30)"/>').join('') +
    '<path d="M30 30l9-11-11 9z" fill="#ff3b30"/><path d="M30 30l-9 11 11-9z" fill="#fff"/>')],
  camera: ['icon-camera', G60('<rect x="10" y="19" width="40" height="26" rx="6" fill="#3a3a3c"/><path d="M22 19l2.5-4h11l2.5 4z" fill="#3a3a3c"/><circle cx="30" cy="32" r="9.5" fill="#1c1c1e" stroke="#c7c7cc" stroke-width="2"/><circle cx="30" cy="32" r="5" fill="#2c4a7a"/><circle cx="28" cy="30" r="1.6" fill="#9cc2ff"/><circle cx="43" cy="24" r="1.6" fill="#ffd60a"/>')],
  photos: ['icon-photos', G60('<g transform="translate(30 30)" style="mix-blend-mode:multiply">' +
    ['#ff9f0a', '#ffd60a', '#a2d939', '#30d158', '#40c8e0', '#0a84ff', '#bf5af2', '#ff375f'].map((c, i) => '<ellipse cx="0" cy="-10" rx="6.2" ry="10.5" fill="' + c + '" opacity="0.82" transform="rotate(' + i * 45 + ')"/>').join('') + '</g>')],
  music: ['icon-music', G60('<path fill="#fff" d="M38.5 13.5v20.6a5.6 5.6 0 11-2.6-4.7V20.4l-12.4 2.9v14.1a5.6 5.6 0 11-2.6-4.7V18.5z"/>')],

// Жесты: смахнуть вверх - домой, смахнуть вниз от верхнего края - пункт управления
let g = null;
$('device').addEventListener('pointerdown', e => {
  const r = $('device').getBoundingClientRect(), k = r.height / $('device').offsetHeight;
  g = { x: e.clientX, y: e.clientY, localY: (e.clientY - r.top) / k, localX: (e.clientX - r.left) / k, t: e.target };
});
$('device').addEventListener('pointerup', e => {
  if (!g) return;
  const k = $('device').getBoundingClientRect().height / $('device').offsetHeight;
  const dy = (g.y - e.clientY) / k, dx = (e.clientX - g.x) / k, start = g; g = null;
  if (Math.abs(dx) > Math.abs(dy) || Math.abs(dy) < 70) return;
  if (start.t.closest('input, textarea, button, .cc-slider, .calc-btn, [data-scroll], .scr-body, .msg-list, .settings-list, .read-view, .note-edit')) return;
  if ($('lock-page').classList.contains('active')) return;
  const ccOpen = $('control-center').classList.contains('open');
  // сверху слева - центр уведомлений, сверху справа - пункт управления (и в программах тоже)
  if (dy < 0 && start.localY < 70 && !ccOpen && !$('nc').classList.contains('open')) { if (start.localX < $('device').offsetWidth * 0.45) openNC(); else openCC(); }
  else if (dy > 0 && $('nc').classList.contains('open')) closeNC();
  else if (dy > 0 && ccOpen) closeCC();
  else if (dy > 0 && current && start.localY > $('device').offsetHeight - 120) showHome();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('control-center').classList.contains('open')) closeCC();
    else if (current && screens[current].onKey && screens[current].onKey(e)) return;
    else if (current) showHome();
    return;
  }
  if ($('lock-page').classList.contains('active') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showHome(); return; }
  if (current && screens[current].onKey && !(e.target.closest && e.target.closest('input, textarea'))) screens[current].onKey(e);
});

// ===== Калькулятор =====
function initCalc(sc) {
  const keys = [['AC', 'gray', 'C'], ['±', 'gray'], ['%', 'gray'], ['÷', 'orange', '/'], ['7'], ['8'], ['9'], ['×', 'orange', '*'], ['4'], ['5'], ['6'], ['−', 'orange', '-'], ['1'], ['2'], ['3'], ['+', 'orange', '+'], ['0', 'zero'], [',', '', '.'], ['=', 'orange', '=']];
  shell('calc', '<div class="calc-display" id="calc-display">0</div><div class="calc-buttons">' + keys.map(k => '<button class="calc-btn ' + (k[1] || '') + '" data-calc="' + (k[2] || k[0]) + '">' + k[0] + '</button>').join('') + '</div>');
  const disp = sc.el.querySelector('#calc-display');
  let cur = '0', prev = null, op = null, fresh = false, err = false;
  const num = x => String(parseFloat(x.toPrecision(10)));
  const fmt = s => { if (err) return 'Ошибка'; const n = parseFloat(s); if (Math.abs(n) >= 1e9 || (n !== 0 && Math.abs(n) < 1e-7)) return n.toExponential(4).replace('.', ','); const [a, b] = s.split('.'); return a.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (b !== undefined ? ',' + b : ''); };
  function show() { disp.textContent = fmt(cur); disp.style.fontSize = Math.min(80, Math.floor(340 / Math.max(4, disp.textContent.length * 0.62))) + 'px'; }
  function compute() { const a = parseFloat(prev), b = parseFloat(cur); const r = op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : b === 0 ? NaN : a / b; if (!isFinite(r)) { err = true; return '0'; } return num(r); }
  function press(k) {
    if (err && k !== 'C') { err = false; cur = '0'; prev = null; op = null; }
    if (/^\d$/.test(k)) { if (fresh || cur === '0') { cur = k; fresh = false; } else if (cur.replace(/[-.]/g, '').length < 9) cur += k; }
    else if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
    else if (k === 'C') { cur = '0'; prev = null; op = null; fresh = false; err = false; }
    else if (k === '±') { if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
    else if (k === '%') cur = num(parseFloat(cur) / 100);
    else if (k === 'back') { if (!fresh) cur = cur.length > 1 && !/^-\d$/.test(cur) ? cur.slice(0, -1) : '0'; }
    else if ('+-*/'.includes(k)) { if (op && !fresh) cur = compute(); prev = cur; op = k; fresh = true; }
    else if (k === '=') { if (op) { cur = compute(); op = null; prev = null; fresh = true; } }
    show();
  }
  sc.el.addEventListener('click', e => { const b = e.target.closest('[data-calc]'); if (b) press(b.dataset.calc); });
  sc.onKey = e => {
    const map = { Enter: '=', '=': '=', Backspace: 'back', Delete: 'C', ',': '.', '.': '.', '+': '+', '-': '-', '*': '*', '/': '/', '%': '%' };
    const k = /^\d$/.test(e.key) ? e.key : map[e.key];
    if (k) { e.preventDefault(); press(k); return true; }
  };
  show();
}

// ===== Телефон =====
function initPhone(sc) {
  const keys = [['1', ''], ['2', 'АБВГ'], ['3', 'ДЕЖЗ'], ['4', 'ИЙКЛ'], ['5', 'МНОП'], ['6', 'РСТУ'], ['7', 'ФХЦЧ'], ['8', 'ШЩЪЫ'], ['9', 'ЬЭЮЯ'], ['*', ''], ['0', '+'], ['#', '']];
  shell('phone', '<div class="app-header"><div class="app-title">Клавиши</div></div><div class="dial-num" id="dial-num"></div><div class="dial-pad">' +
    keys.map(k => '<button class="dial-key" data-key="' + k[0] + '">' + k[0] + '<small>' + k[1] + '</small></button>').join('') + '</div>' +
    '<div class="dial-actions"><span style="width:50px"></span><button class="dial-call" data-call title="Позвонить"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C9.4 21 3 14.6 3 6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg></button><button class="dial-del" data-del title="Стереть">⌫</button></div>', true);
  let number = '', timer = null;
  const numEl = sc.el.querySelector('#dial-num');
  const show = () => { numEl.textContent = number; sc.el.querySelector('[data-del]').style.visibility = number ? 'visible' : 'hidden'; };
  function endCall() { clearInterval(timer); const c = sc.el.querySelector('.call-screen'); if (c) c.remove(); }
  function call() {
    if (!number) return;
    const start = Date.now();
    const cs = document.createElement('div');
    cs.className = 'call-screen';
    cs.innerHTML = '<div class="cs-name"></div><div class="cs-time">вызов…</div><button class="cs-end" data-end title="Завершить"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff" transform="rotate(135)"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C9.4 21 3 14.6 3 6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg></button>';
    cs.querySelector('.cs-name').textContent = number;
    sc.el.appendChild(cs);
    timer = setInterval(() => { const s = Math.floor((Date.now() - start) / 1000); cs.querySelector('.cs-time').textContent = s < 2 ? 'вызов…' : pad2(Math.floor((s - 2) / 60)) + ':' + pad2((s - 2) % 60) + ' (демо-звонок)'; }, 500);
  }
  sc.el.addEventListener('click', e => {
    const k = e.target.closest('[data-key]'); if (k && number.length < 16) { number += k.dataset.key; show(); return; }
    if (e.target.closest('[data-del]')) { number = number.slice(0, -1); show(); return; }
    if (e.target.closest('[data-call]')) { call(); return; }
    if (e.target.closest('[data-end]')) endCall();
  });
  sc.onKey = e => {
    if (e.key === 'Escape' && sc.el.querySelector('.call-screen')) { endCall(); return true; }
    if (/^[\d*#]$/.test(e.key) && number.length < 16) { number += e.key; show(); return true; }
    if (e.key === 'Backspace') { number = number.slice(0, -1); show(); return true; }
    if (e.key === 'Enter') { call(); return true; }
  };
  sc.onHide = endCall;
  show();
}

  const TRACKS = [{ title: 'Стеклянные сны', artist: 'Синтезатор', art: 'linear-gradient(135deg, #a855f7, #3b82f6)' }, { title: 'Полуночное преломление', artist: 'Неоновые волны', art: 'linear-gradient(135deg, #0ea5e9, #5e0a8a)' }, { title: 'Северная дорога', artist: 'Полярные огни', art: 'linear-gradient(135deg, #34c759, #0ea5e9)' }];

    '<div class="music-controls"><button class="music-btn" data-m="prev" title="Предыдущий"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6v12h2V6H6zm3 6l9 6V6l-9 6z"/></svg></button>' +

    '<div class="music-volume"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9v6h4l5 5V4L9 9H5z"/></svg><div class="music-vol-bar" data-vol role="slider" aria-label="Громкость"><div class="music-vol-fill"></div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 9v6h4l5 5V4L9 9H5zm11.5 3a4 4 0 00-2.5-3.7v7.4a4 4 0 002.5-3.7z"/></svg></div>' +
    '<div class="music-list">Мелодии собираются прямо в телефоне, без файлов и без сети</div>');

    }
  }
  function render() {
    const tr = TRACKS[idx];
    sc.el.querySelector('#music-art').style.background = tr.art;
    sc.el.querySelector('#music-title').textContent = tr.title;
    sc.el.querySelector('#music-artist').textContent = tr.artist;
    sc.el.querySelector('#music-play-icon').setAttribute('d', playing ? 'M6 4h4v16H6V4zm8 0h4v16h-4V4z' : 'M8 5v14l11-7L8 5z');

  }
  function progress() {
    const x = playing ? Math.min(LEN, now() - startAt) : offset;

  render(); progress();
}

    '<div class="weather-forecast">' + days.map(x => '<div class="forecast-row"><span>' + x.n + '</span><span>' + x.ic + '</span><div class="forecast-bar"></div><span class="forecast-low">' + x.lo + '°</span><span>' + x.hi + '°</span></div>').join('') + '</div>' +
    '<div style="text-align:center;font-size:12px;opacity:0.7;margin-top:10px">Демо-данные: интернет не используется</div>');
}

// ===== Часы =====
function initClock(sc) {
  const ZONES = [['Москва', 'Europe/Moscow'], ['Лондон', 'Europe/London'], ['Нью-Йорк', 'America/New_York'], ['Токио', 'Asia/Tokyo']];
  let tab = 'world', alarms = store.get('alarms', [{ t: '07:00', label: 'Будильник', on: true }, { t: '09:30', label: 'Выходные', on: false }]);
  let sw = { run: false, start: 0, acc: 0, laps: [] }, swTimer = null, worldTimer = null;
  const swFmt = ms => { const cs = Math.floor(ms / 10); return pad2(Math.floor(cs / 6000)) + ':' + pad2(Math.floor(cs / 100) % 60) + ',' + pad2(cs % 100); };
  const swNow = () => sw.acc + (sw.run ? Date.now() - sw.start : 0);
  const offsetText = tz => { const now = new Date(); const local = now.getTimezoneOffset(); const there = new Date(now.toLocaleString('en-US', { timeZone: tz })); const here = new Date(now.toLocaleString('en-US')); const diff = Math.round((there - here) / 3600000); return diff === 0 ? 'Сегодня, ±0 ч' : 'Сегодня, ' + (diff > 0 ? '+' : '') + diff + ' ч'; };
  function body() {
    if (tab === 'world') return '<div style="font-size:32px;font-weight:700;margin-bottom:14px">Мировые часы</div><div class="alarm-list">' + ZONES.map(([n, tz]) => '<div class="alarm-item"><div><div class="alarm-label" style="font-size:13px;margin-bottom:2px">' + offsetText(tz) + '</div><div style="font-size:18px">' + n + '</div></div><div class="alarm-time">' + new Date().toLocaleTimeString('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit' }) + '</div></div>').join('') + '</div>';
    if (tab === 'alarms') return '<div style="font-size:32px;font-weight:700;margin-bottom:6px">Будильник</div><form class="clock-add"><input type="time" name="t" value="08:00" aria-label="Время"><input name="label" placeholder="Подпись" maxlength="20" aria-label="Подпись"><button>Добавить</button></form><div class="alarm-list">' +
      (alarms.length ? alarms.map((a, i) => '<div class="alarm-item"><div><div class="alarm-time" style="opacity:' + (a.on ? 1 : 0.45) + '">' + a.t + '</div><div class="alarm-label">' + esc(a.label) + '</div></div><div class="alarm-right"><button class="alarm-del" data-del="' + i + '" title="Удалить">×</button><div class="toggle' + (a.on ? '' : ' off') + '" data-al="' + i + '" role="switch" aria-checked="' + a.on + '"></div></div></div>').join('') : '<div class="empty-note">Будильников нет</div>') + '</div>';
    return '<div class="clock-bigtime" id="sw-display">' + swFmt(swNow()) + '</div><div class="stopwatch-controls"><button class="sw-btn stop" data-sw="lap">' + (sw.run ? 'Круг' : 'Сброс') + '</button><button class="sw-btn ' + (sw.run ? 'stop' : 'start') + '" data-sw="toggle">' + (sw.run ? 'Стоп' : 'Старт') + '</button></div><div class="laps">' +
      sw.laps.map((l, i) => '<div><span>Круг ' + (sw.laps.length - i) + '</span><span>' + swFmt(l) + '</span></div>').join('') + '</div>';
  }
  function render() {
    shell('clock', '<div class="clock-content">' + body() + '</div><div class="clock-tabs glass-bar"><i class="tab-lens" style="--i:' + ['world', 'alarms', 'stopwatch'].indexOf(tab) + '"></i>' + [['world', 'Мировые', '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/>'], ['alarms', 'Будильник', '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M5 4L2.5 6.5M19 4l2.5 2.5"/>'], ['stopwatch', 'Секундомер', '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9M10 2.5h4M18.5 7l1.5-1.5"/>']].map(([k, n, g]) => '<button class="clock-tab' + (k === tab ? ' active' : '') + '" data-tab="' + k + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' + g + '</svg><span>' + n + '</span></button>').join('') + '</div>');
  }
  const saveAl = () => store.set('alarms', alarms);
  sc.el.addEventListener('click', e => {
    const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; render(); return; }
    const al = e.target.closest('[data-al]'); if (al) { alarms[+al.dataset.al].on = !alarms[+al.dataset.al].on; saveAl(); render(); return; }
    const dl = e.target.closest('[data-del]'); if (dl) { alarms.splice(+dl.dataset.del, 1); saveAl(); render(); return; }
    const s = e.target.closest('[data-sw]'); if (!s) return;
    if (s.dataset.sw === 'toggle') { if (sw.run) { sw.acc += Date.now() - sw.start; sw.run = false; clearInterval(swTimer); } else { sw.start = Date.now(); sw.run = true; swTimer = setInterval(() => { const d = sc.el.querySelector('#sw-display'); if (d) d.textContent = swFmt(swNow()); }, 40); } }
    else if (sw.run) sw.laps.unshift(swNow());
    else { sw.acc = 0; sw.laps = []; }
    render();
  });
  sc.el.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, t = f.t.value; if (!t) return;
    alarms.push({ t, label: f.label.value.trim() || 'Будильник', on: true }); alarms.sort((a, b) => a.t.localeCompare(b.t)); saveAl(); render();
  });
  sc.onShow = () => { render(); clearInterval(worldTimer); worldTimer = setInterval(() => { if (tab === 'world' && current === 'clock') render(); }, 15000); };
  sc.onHide = () => clearInterval(worldTimer);
  sc.onKill = () => { if (sw.run) { sw.acc += Date.now() - sw.start; sw.run = false; clearInterval(swTimer); } };   // закрытые «Часы» не считают секундомер
  sc.state = () => ({ tab, sw: swNow() });
  render();
}

// ===== Заметки =====
function initNotes(sc) {
  let notes = store.get('notes', [{ id: 1, text: 'Идеи проектов\nИгра на Qt, свой калькулятор, оболочка с вкладками', t: Date.now() }, { id: 2, text: 'Покупки\nХлеб, молоко, кофе', t: Date.now() - 86400000 }]);
  let open = null;
  const save = () => store.set('notes', notes);
  const title = n => (n.text.split('\n')[0] || 'Новая заметка').slice(0, 40);
  function render() {
    if (open === null) {
      notes.sort((a, b) => b.t - a.t);
      shell('notes', '<div class="app-header"><div class="app-title">Заметки</div></div><div class="scr-body">' + (notes.length ? '<div class="settings-group">' + notes.map(n => '<div class="list-row" data-note="' + n.id + '"><div class="lr-main"><div class="lr-title">' + esc(title(n)) + '</div><div class="lr-sub">' +
        new Date(n.t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ' · ' + esc(n.text.split('\n').slice(1).join(' ').slice(0, 40)) + '</div></div><div class="chevron">›</div></div>').join('') + '</div>' : '<div class="empty-note">Заметок нет</div>') +
        '</div><button class="fab" data-new title="Новая заметка">＋</button>', true);
      return;
    }
    const n = notes.find(x => x.id === open);
    shell('notes', '<div class="nav-bar"><button class="nav-btn glass-btn" data-back>‹ Заметки</button><button class="nav-btn" data-delnote style="color:#ff3b30">Удалить</button></div><div class="note-edit"><textarea aria-label="Текст заметки" placeholder="Первая строка - заголовок"></textarea></div>', true);
    const ta = sc.el.querySelector('textarea');
    ta.value = n.text;
    ta.addEventListener('input', () => { n.text = ta.value; n.t = Date.now(); save(); });
    ta.focus();
  }
  function back() { const n = notes.find(x => x.id === open); if (n && !n.text.trim()) notes = notes.filter(x => x !== n); save(); open = null; render(); }
  sc.el.addEventListener('click', e => {
    const r = e.target.closest('[data-note]'); if (r) { open = +r.dataset.note; render(); return; }
    if (e.target.closest('[data-new]')) { const n = { id: Date.now(), text: '', t: Date.now() }; notes.unshift(n); open = n.id; render(); return; }
    if (e.target.closest('[data-back]')) { back(); return; }
    if (e.target.closest('[data-delnote]')) { notes = notes.filter(x => x.id !== open); save(); open = null; render(); }
  });
  sc.onKey = e => { if (e.key === 'Escape' && open !== null) { back(); return true; } };
  sc.onHide = () => { if (open !== null) back(); };
  render();
}

// ===== Календарь =====
function loadEvents() {
  const ev = store.get('events', null);
  if (ev) return ev;
  const d = n => { const x = new Date(); x.setDate(x.getDate() + n); return dayKey(x); };
  return { [d(0)]: [{ title: 'Прогулка', time: '18:00' }], [d(2)]: [{ title: 'Встреча с друзьями', time: '15:00' }] };
}
function initCalendar(sc) {
  let month = new Date(); month.setDate(1);
  let sel = dayKey(new Date());
  let events = loadEvents();
  const save = () => { store.set('events', events); updateWidgets(); };
  function render() {
    const first = new Date(month), shift = (first.getDay() + 6) % 7, start = new Date(first); start.setDate(1 - shift);
    const cells = [];
    for (let i = 0; i < 42; i++) { const x = new Date(start); x.setDate(start.getDate() + i); if (i >= 35 && x.getMonth() !== month.getMonth()) break; cells.push(x); }
    const today = dayKey(new Date()), list = (events[sel] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
    const selDate = new Date(sel + 'T12:00');
    shell('calendar', '<div class="cal-month"><div class="cal-header"><button data-m="-1" title="Предыдущий месяц">‹</button><span>' + MONTHS[month.getMonth()] + ' ' + month.getFullYear() + '</span><button data-m="1" title="Следующий месяц">›</button></div>' +
      '<div class="cal-weekdays"><div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div></div><div class="cal-grid">' +
      cells.map(x => { const k = dayKey(x); return '<div class="cal-day' + (x.getMonth() !== month.getMonth() ? ' outside' : '') + (k === today ? ' today' : '') + (k === sel ? ' sel' : '') + ((events[k] || []).length ? ' has-event' : '') + '" data-day="' + k + '">' + x.getDate() + '</div>'; }).join('') + '</div></div>' +
      '<div class="cal-events"><div style="font-size:14px;font-weight:600;color:#8e8e93;text-transform:uppercase">' + selDate.getDate() + ' ' + MONTHS_GEN[selDate.getMonth()] + ' · ' + DAYS[selDate.getDay()] + '</div>' +
      '<form class="cal-add"><input name="title" placeholder="Новое событие" maxlength="40" aria-label="Название события"><input type="time" name="time" value="12:00" aria-label="Время"><button title="Добавить">+</button></form>' +
      (list.length ? list.map(ev => '<div class="cal-event"><div class="cal-event-bar"></div><div class="cal-event-time">' + ev.time + '</div><div class="cal-event-title">' + esc(ev.title) + '</div><button class="ev-del" data-evdel="' + events[sel].indexOf(ev) + '" title="Удалить">×</button></div>').join('') : '<div style="color:#8e8e93;padding:8px 0">Событий нет</div>') + '</div>');
  }
  sc.el.addEventListener('click', e => {
    const m = e.target.closest('[data-m]'); if (m) { month.setMonth(month.getMonth() + +m.dataset.m); render(); return; }
    const d = e.target.closest('[data-day]'); if (d) { sel = d.dataset.day; const x = new Date(sel + 'T12:00'); if (x.getMonth() !== month.getMonth()) { month = new Date(x); month.setDate(1); } render(); return; }
    const del = e.target.closest('[data-evdel]'); if (del) { events[sel].splice(+del.dataset.evdel, 1); if (!events[sel].length) delete events[sel]; save(); render(); }
  });
  sc.el.addEventListener('submit', e => {
    e.preventDefault();
    const title = e.target.title.value.trim(); if (!title) { e.target.title.focus(); return; }
    (events[sel] = events[sel] || []).push({ title, time: e.target.time.value || '12:00' }); save(); render();
  });
  sc.onShow = () => { month = new Date(); month.setDate(1); sel = dayKey(new Date()); render(); };
  render();
}

// ===== Настройки =====
function initSettings(sc) {
  let page = 'main', q = '';
  const tog = k => '<div class="toggle' + (S[k] ? '' : ' off') + '" data-set="' + k + '" role="switch" aria-checked="' + !!S[k] + '"></div>';
  const G = p => '<svg viewBox="0 0 24 24" fill="#fff">' + p + '</svg>';
  const ROWS = [
    { grp: 1, k: 'airplane', name: 'Авиарежим', color: '#ff9500', toggle: true, g: G('<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>') },
    { grp: 1, k: 'wifi', name: 'Wi-Fi', color: '#007aff', toggle: true, g: G('<path d="M12 18a2 2 0 100 4 2 2 0 000-4zm0-8c-2.7 0-5.2 1-7 2.7l1.4 1.4c1.5-1.3 3.5-2.1 5.6-2.1s4.1.8 5.6 2.1l1.4-1.4c-1.8-1.7-4.3-2.7-7-2.7zm0-4C8.4 6 5.1 7.4 2.6 9.7L4 11.1C6.1 9.2 8.9 8 12 8s5.9 1.2 8 3.1l1.4-1.4C18.9 7.4 15.6 6 12 6z"/>') },
    { grp: 1, k: 'bt', name: 'Bluetooth', color: '#007aff', toggle: true, g: G('<path d="M12 2v8.6L7.4 6 6 7.4l5.6 4.6L6 16.6 7.4 18l4.6-4.6V22l5-5-3.6-3 3.6-3z"/>') },
    { grp: 1, k: 'cellular', name: 'Сотовые данные', color: '#34c759', toggle: true, g: G('<path d="M2 22h3v-5H2zm5 0h3v-9H7zm5 0h3V9h-3zm5 0h3V4h-3z"/>') },
    { grp: 2, k: 'dnd', name: 'Не беспокоить', color: '#5856d6', toggle: true, g: G('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>') },
    { grp: 3, p: 'display', name: 'Экран и яркость', color: '#007aff', g: G('<circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="#fff" stroke-width="2"/>') },
    { grp: 3, p: 'wall', name: 'Обои', color: '#a855f7', g: G('<path d="M4 5h16v14H4z" fill="none" stroke="#fff" stroke-width="2"/><path d="M5 18l5-6 4 4 2-2 3 4z"/>') },
    { grp: 2, p: 'sound', name: 'Звуки', color: '#ff3b30', g: G('<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="#fff" stroke-width="1.8"/>') },
    { grp: 4, p: 'about', name: 'Об устройстве', color: '#8e8e93', g: G('<circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M11 10h2v7h-2zM11 7h2v2h-2z"/>') },
  ];
  const PAGES = {
    display: () => '<div class="settings-group"><div class="settings-row"><div class="settings-label">Тёмное оформление</div>' + tog('dark') + '</div><div class="settings-row"><div class="settings-label">Меньше стекла</div><div class="toggle' + (S.glass ? ' off' : '') + '" data-set="glass-inv" role="switch" aria-checked="' + !S.glass + '"></div></div></div>' +
      '<div class="settings-group"><div class="settings-row"><span>☀️</span><input type="range" min="30" max="100" value="' + S.brightness + '" data-range="brightness" aria-label="Яркость"></div></div>',
    wall: () => '<div class="walls">' + Object.entries(WALLS).map(([k, w]) => '<div class="wall-opt' + (S.wallpaper === k ? ' on' : '') + '" data-wall="' + k + '" style="background:' + w.home + '"><canvas class="wall-th" data-th="' + k + '"></canvas><span>' + w.name + '</span></div>').join('') + '</div>',
    sound: () => '<div class="settings-group"><div class="settings-row"><span>🔈</span><input type="range" min="0" max="100" value="' + S.volume + '" data-range="volume" aria-label="Громкость"><span>🔊</span></div></div><div class="about-note">Громкость действует на «Музыку».</div>',
    about: () => '<div class="settings-group"><div class="settings-row"><div class="settings-label">Название</div><div class="settings-value">Телефон «Стекло»</div></div><div class="settings-row"><div class="settings-label">Версия</div><div class="settings-value">2.0</div></div></div>' +
      '<div class="about-note"><b>Фан-концепт интерфейса, не связан с Microsoft/Apple/Samsung.</b> Значки и обои нарисованы заново, шрифты системные, сеть не нужна.</div><button class="sheet-btn" data-reset>Сбросить всё</button>',
  };
  function render() {
    if (page === 'main') {
      const rows = ROWS.filter(r => !q || r.name.toLowerCase().includes(q));
      const row = r => '<div class="settings-row"' + (r.p ? ' data-page="' + r.p + '"' : '') + '><div class="settings-icon" style="background:' + r.color + '">' + r.g + '</div><div class="settings-label">' + r.name + '</div>' + (r.k === 'wifi' ? '<div class="settings-value">' + (S.wifi ? 'Дом' : 'Выкл.') + '</div>' : '') + (r.toggle ? tog(r.k) : '<div class="chevron">›</div>') + '</div>';
      const groups = q ? [rows] : [1, 2, 3, 4].map(n => rows.filter(r => r.grp === n));
      const profile = q ? '' : '<div class="settings-group settings-profile"><div class="settings-row"><div class="sp-avatar">Г</div><div class="settings-label"><b>Гость</b><small>Локальный профиль, всё хранится в браузере</small></div><div class="chevron">›</div></div></div>';
      shell('settings', '<div class="app-header"><div class="app-title">Настройки</div></div><div class="settings-list"><label class="settings-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input placeholder="Поиск" aria-label="Поиск настроек"></label>' + profile +
        (rows.length ? groups.filter(g => g.length).map(g => '<div class="settings-group">' + g.map(row).join('') + '</div>').join('') : '<div class="settings-group"><div class="settings-row"><div class="settings-label" style="color:#8e8e93">Ничего не найдено</div></div></div>') + '</div>', true);
      const inp = sc.el.querySelector('.settings-search input'); inp.value = q;
      inp.addEventListener('input', () => { q = inp.value.trim().toLowerCase(); const pos = inp.selectionStart; render(); const i2 = sc.el.querySelector('.settings-search input'); i2.focus(); i2.setSelectionRange(pos, pos); });
      return;
    }
    shell('settings', '<div class="nav-bar"><button class="nav-btn glass-btn" data-back>‹ Настройки</button><div class="nb-title">' + ROWS.find(r => r.p === page).name + '</div></div><div class="scr-body">' + PAGES[page]() + '</div>', true);
  }
  let own = false;
  sc.el.addEventListener('click', e => {
    const p = e.target.closest('[data-page]'); if (p) { page = p.dataset.page; render(); return; }
    if (e.target.closest('[data-back]')) { page = 'main'; render(); return; }
    const t = e.target.closest('[data-set]'); if (t) { if (t.dataset.set === 'glass-inv') setS('glass', !S.glass); else setS(t.dataset.set, !S[t.dataset.set]); return; }
    const w = e.target.closest('[data-wall]'); if (w) { setS('wallpaper', w.dataset.wall); return; }
    if (e.target.closest('[data-reset]')) {
      // сброс трогает и файлы в IndexedDB: ждём удаления базы, потом перезагрузка
      store.clear();
      if (typeof fdb !== 'undefined' && fdb) { fdb.close(); fdb = null; }
      let r; try { r = indexedDB.deleteDatabase('ios26'); } catch (er) { location.reload(); return; }
      r.onsuccess = r.onerror = r.onblocked = () => location.reload();
    }
  });
  sc.el.addEventListener('input', e => { const r = e.target.closest('[data-range]'); if (r) { own = true; setS(r.dataset.range, +r.value); own = false; } });
  on('settings', () => { if (sc.inited && !own && current === 'settings' && !sc.el.querySelector('.settings-search input:focus')) render(); });
  sc.onKey = e => { if (e.key === 'Escape' && page !== 'main') { page = 'main'; render(); return true; } };
  sc.onShow = () => { page = 'main'; q = ''; render(); };
  render();
}

// ===== Масштаб: телефон целиком помещается в окно любой высоты =====
function fit() {
  const d = $('device');
  if (innerWidth <= 420) { d.style.transform = ''; return; }
  const k = Math.min(1, (innerHeight - 40) / (852 + 28), (innerWidth - 40) / (393 + 28));
  d.style.transform = 'scale(' + k + ')';
}
addEventListener('resize', fit);

// ===== Запуск =====
buildHome();
buildScreens();
applySettings();
tick();
updateWidgets();
fit();
</script>
