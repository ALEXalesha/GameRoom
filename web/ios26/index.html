  const offsetText = tz => { const now = new Date(); const local = now.getTimezoneOffset(); const there = new Date(now.toLocaleString('en-US', { timeZone: tz })); const here = new Date(now.toLocaleString('en-US')); const diff = Math.round((there - here) / 3600000); return diff === 0 ? 'Сегодня, ±0 ч' : 'Сегодня, ' + (diff > 0 ? '+' : '') + diff + ' ч'; };
  function body() {
    if (tab === 'world') return '<div style="font-size:32px;font-weight:700;margin-bottom:14px">Мировые часы</div><div class="alarm-list">' + ZONES.map(([n, tz]) => '<div class="alarm-item"><div><div class="alarm-label" style="font-size:13px;margin-bottom:2px">' + offsetText(tz) + '</div><div style="font-size:18px">' + n + '</div></div><div class="alarm-time">' + new Date().toLocaleTimeString('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit' }) + '</div></div>').join('') + '</div>';
    if (tab === 'alarms') return '<div style="font-size:32px;font-weight:700;margin-bottom:6px">Будильник</div><form class="clock-add"><input type="time" name="t" value="08:00" aria-label="Время"><input name="label" placeholder="Подпись" maxlength="20" aria-label="Подпись"><button>Добавить</button></form><div class="alarm-list">' +
      (alarms.length ? alarms.map((a, i) => '<div class="alarm-item"><div><div class="alarm-time" style="opacity:' + (a.on ? 1 : 0.45) + '">' + a.t + '</div><div class="alarm-label">' + esc(a.label) + '</div></div><div class="alarm-right"><button class="alarm-del" data-del="' + i + '" title="Удалить">×</button><div class="toggle' + (a.on ? '' : ' off') + '" data-al="' + i + '" role="switch" aria-checked="' + a.on + '"></div></div></div>').join('') : '<div class="empty-note">Будильников нет</div>') + '</div>';
    return '<div class="clock-bigtime" id="sw-display">' + swFmt(swNow()) + '</div><div class="stopwatch-controls"><button class="sw-btn stop" data-sw="lap">' + (sw.run ? 'Круг' : 'Сброс') + '</button><button class="sw-btn ' + (sw.run ? 'stop' : 'start') + '" data-sw="toggle">' + (sw.run ? 'Стоп' : 'Старт') + '</button></div><div class="laps">' +
      sw.laps.map((l, i) => '<div><span>Круг ' + (sw.laps.length - i) + '</span><span>' + swFmt(l) + '</span></div>').join('') + '</div>';
  }
  function render() {
    shell('clock', '<div class="clock-content">' + body() + '</div><div class="clock-tabs">' + [['world', 'Мировые'], ['alarms', 'Будильник'], ['stopwatch', 'Секундомер']].map(([k, n]) => '<button class="clock-tab' + (k === tab ? ' active' : '') + '" data-tab="' + k + '">' + n + '</button>').join('') + '</div>');
  }
  const saveAl = () => store.set('alarms', alarms);
  sc.el.addEventListener('click', e => {
    const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; render(); return; }
    const al = e.target.closest('[data-al]'); if (al) { alarms[+al.dataset.al].on = !alarms[+al.dataset.al].on; saveAl(); render(); return; }
    const dl = e.target.closest('[data-del]'); if (dl) { alarms.splice(+dl.dataset.del, 1); saveAl(); render(); return; }
    const s = e.target.closest('[data-sw]'); if (!s) return;
    if (s.dataset.sw === 'toggle') { if (sw.run) { sw.acc += Date.now() - sw.start; sw.run = false; clearInterval(swTimer); } else { sw.start = Date.now(); sw.run = true; swTimer = setInterval(() => { const d = sc.el.querySelector('#sw-display'); if (d) d.textContent = swFmt(swNow()); }, 40); } }
    else if (sw.run) sw.laps.unshift(swNow());
    else { sw.acc = 0; sw.laps = []; }
    render();
  });
  sc.el.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, t = f.t.value; if (!t) return;
    alarms.push({ t, label: f.label.value.trim() || 'Будильник', on: true }); alarms.sort((a, b) => a.t.localeCompare(b.t)); saveAl(); render();
  });
  sc.onShow = () => { render(); clearInterval(worldTimer); worldTimer = setInterval(() => { if (tab === 'world' && current === 'clock') render(); }, 15000); };
  sc.onHide = () => clearInterval(worldTimer);
  sc.state = () => ({ tab, sw: swNow() });
  render();
}

// ===== Заметки =====
function initNotes(sc) {
  let notes = store.get('notes', [{ id: 1, text: 'Идеи проектов\nИгра на Qt, свой калькулятор, оболочка с вкладками', t: Date.now() }, { id: 2, text: 'Покупки\nХлеб, молоко, кофе', t: Date.now() - 86400000 }]);
  let open = null;
  const save = () => store.set('notes', notes);
  const title = n => (n.text.split('\n')[0] || 'Новая заметка').slice(0, 40);
  function render() {
    if (open === null) {
      notes.sort((a, b) => b.t - a.t);
      shell('notes', '<div class="app-header"><div class="app-title">Заметки</div></div><div class="scr-body">' + (notes.length ? '<div class="settings-group">' + notes.map(n => '<div class="list-row" data-note="' + n.id + '"><div class="lr-main"><div class="lr-title">' + esc(title(n)) + '</div><div class="lr-sub">' +
        new Date(n.t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ' · ' + esc(n.text.split('\n').slice(1).join(' ').slice(0, 40)) + '</div></div><div class="chevron">›</div></div>').join('') + '</div>' : '<div class="empty-note">Заметок нет</div>') +
        '</div><button class="fab" data-new title="Новая заметка">＋</button>', true);
      return;
    }
    const n = notes.find(x => x.id === open);
    shell('notes', '<div class="nav-bar"><button class="nav-btn" data-back>‹ Заметки</button><button class="nav-btn" data-delnote style="color:#ff3b30">Удалить</button></div><div class="note-edit"><textarea aria-label="Текст заметки" placeholder="Первая строка - заголовок"></textarea></div>', true);
    const ta = sc.el.querySelector('textarea');
    ta.value = n.text;
    ta.addEventListener('input', () => { n.text = ta.value; n.t = Date.now(); save(); });
    ta.focus();
  }
  function back() { const n = notes.find(x => x.id === open); if (n && !n.text.trim()) notes = notes.filter(x => x !== n); save(); open = null; render(); }
  sc.el.addEventListener('click', e => {
    const r = e.target.closest('[data-note]'); if (r) { open = +r.dataset.note; render(); return; }
    if (e.target.closest('[data-new]')) { const n = { id: Date.now(), text: '', t: Date.now() }; notes.unshift(n); open = n.id; render(); return; }
    if (e.target.closest('[data-back]')) { back(); return; }
    if (e.target.closest('[data-delnote]')) { notes = notes.filter(x => x.id !== open); save(); open = null; render(); }
  });
  sc.onKey = e => { if (e.key === 'Escape' && open !== null) { back(); return true; } };
  sc.onHide = () => { if (open !== null) back(); };
  render();
}

// ===== Календарь =====
function loadEvents() {
  const ev = store.get('events', null);
  if (ev) return ev;
  const d = n => { const x = new Date(); x.setDate(x.getDate() + n); return dayKey(x); };
  return { [d(0)]: [{ title: 'Прогулка', time: '18:00' }], [d(2)]: [{ title: 'Встреча с друзьями', time: '15:00' }] };
}
function initCalendar(sc) {
  let month = new Date(); month.setDate(1);
  let sel = dayKey(new Date());
  let events = loadEvents();
  const save = () => { store.set('events', events); updateWidgets(); };
  function render() {
    const first = new Date(month), shift = (first.getDay() + 6) % 7, start = new Date(first); start.setDate(1 - shift);
    const cells = [];
    for (let i = 0; i < 42; i++) { const x = new Date(start); x.setDate(start.getDate() + i); if (i >= 35 && x.getMonth() !== month.getMonth()) break; cells.push(x); }
    const today = dayKey(new Date()), list = (events[sel] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
    const selDate = new Date(sel + 'T12:00');
    shell('calendar', '<div class="cal-month"><div class="cal-header"><button data-m="-1" title="Предыдущий месяц">‹</button><span>' + MONTHS[month.getMonth()] + ' ' + month.getFullYear() + '</span><button data-m="1" title="Следующий месяц">›</button></div>' +
      '<div class="cal-weekdays"><div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div></div><div class="cal-grid">' +
      cells.map(x => { const k = dayKey(x); return '<div class="cal-day' + (x.getMonth() !== month.getMonth() ? ' outside' : '') + (k === today ? ' today' : '') + (k === sel ? ' sel' : '') + ((events[k] || []).length ? ' has-event' : '') + '" data-day="' + k + '">' + x.getDate() + '</div>'; }).join('') + '</div></div>' +
      '<div class="cal-events"><div style="font-size:14px;font-weight:600;color:#8e8e93;text-transform:uppercase">' + selDate.getDate() + ' ' + MONTHS_GEN[selDate.getMonth()] + ' · ' + DAYS[selDate.getDay()] + '</div>' +
      '<form class="cal-add"><input name="title" placeholder="Новое событие" maxlength="40" aria-label="Название события"><input type="time" name="time" value="12:00" aria-label="Время"><button title="Добавить">+</button></form>' +
      (list.length ? list.map(ev => '<div class="cal-event"><div class="cal-event-bar"></div><div class="cal-event-time">' + ev.time + '</div><div class="cal-event-title">' + esc(ev.title) + '</div><button class="ev-del" data-evdel="' + events[sel].indexOf(ev) + '" title="Удалить">×</button></div>').join('') : '<div style="color:#8e8e93;padding:8px 0">Событий нет</div>') + '</div>');
  }
  sc.el.addEventListener('click', e => {
    const m = e.target.closest('[data-m]'); if (m) { month.setMonth(month.getMonth() + +m.dataset.m); render(); return; }
    const d = e.target.closest('[data-day]'); if (d) { sel = d.dataset.day; const x = new Date(sel + 'T12:00'); if (x.getMonth() !== month.getMonth()) { month = new Date(x); month.setDate(1); } render(); return; }
    const del = e.target.closest('[data-evdel]'); if (del) { events[sel].splice(+del.dataset.evdel, 1); if (!events[sel].length) delete events[sel]; save(); render(); }
  });
  sc.el.addEventListener('submit', e => {
    e.preventDefault();
    const title = e.target.title.value.trim(); if (!title) { e.target.title.focus(); return; }
    (events[sel] = events[sel] || []).push({ title, time: e.target.time.value || '12:00' }); save(); render();
  });
  sc.onShow = () => { month = new Date(); month.setDate(1); sel = dayKey(new Date()); render(); };
  render();
}

// ===== Настройки =====
function initSettings(sc) {
  let page = 'main', q = '';
  const tog = k => '<div class="toggle' + (S[k] ? '' : ' off') + '" data-set="' + k + '" role="switch" aria-checked="' + !!S[k] + '"></div>';
  const G = p => '<svg viewBox="0 0 24 24" fill="#fff">' + p + '</svg>';
  const ROWS = [
    { k: 'airplane', name: 'Авиарежим', color: '#ff9500', toggle: true, g: G('<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>') },
    { k: 'wifi', name: 'Wi-Fi', color: '#007aff', toggle: true, g: G('<path d="M12 18a2 2 0 100 4 2 2 0 000-4zm0-8c-2.7 0-5.2 1-7 2.7l1.4 1.4c1.5-1.3 3.5-2.1 5.6-2.1s4.1.8 5.6 2.1l1.4-1.4c-1.8-1.7-4.3-2.7-7-2.7zm0-4C8.4 6 5.1 7.4 2.6 9.7L4 11.1C6.1 9.2 8.9 8 12 8s5.9 1.2 8 3.1l1.4-1.4C18.9 7.4 15.6 6 12 6z"/>') },
    { k: 'bt', name: 'Bluetooth', color: '#007aff', toggle: true, g: G('<path d="M12 2v8.6L7.4 6 6 7.4l5.6 4.6L6 16.6 7.4 18l4.6-4.6V22l5-5-3.6-3 3.6-3z"/>') },
    { k: 'cellular', name: 'Сотовые данные', color: '#34c759', toggle: true, g: G('<path d="M2 22h3v-5H2zm5 0h3v-9H7zm5 0h3V9h-3zm5 0h3V4h-3z"/>') },
    { k: 'dnd', name: 'Не беспокоить', color: '#5856d6', toggle: true, g: G('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>') },
    { p: 'display', name: 'Экран и яркость', color: '#007aff', g: G('<circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="#fff" stroke-width="2"/>') },
    { p: 'wall', name: 'Обои', color: '#a855f7', g: G('<path d="M4 5h16v14H4z" fill="none" stroke="#fff" stroke-width="2"/><path d="M5 18l5-6 4 4 2-2 3 4z"/>') },
    { p: 'sound', name: 'Звуки', color: '#ff3b30', g: G('<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="#fff" stroke-width="1.8"/>') },
    { p: 'about', name: 'Об устройстве', color: '#8e8e93', g: G('<circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M11 10h2v7h-2zM11 7h2v2h-2z"/>') },
  ];
  const PAGES = {
    display: () => '<div class="settings-group"><div class="settings-row"><div class="settings-label">Тёмное оформление</div>' + tog('dark') + '</div><div class="settings-row"><div class="settings-label">Меньше стекла</div><div class="toggle' + (S.glass ? ' off' : '') + '" data-set="glass-inv" role="switch" aria-checked="' + !S.glass + '"></div></div></div>' +
      '<div class="settings-group"><div class="settings-row"><span>☀️</span><input type="range" min="30" max="100" value="' + S.brightness + '" data-range="brightness" aria-label="Яркость"></div></div>',
    wall: () => '<div class="walls">' + Object.entries(WALLS).map(([k, w]) => '<div class="wall-opt' + (S.wallpaper === k ? ' on' : '') + '" data-wall="' + k + '" style="background:' + w.home + '"><span>' + w.name + '</span></div>').join('') + '</div>',
    sound: () => '<div class="settings-group"><div class="settings-row"><span>🔈</span><input type="range" min="0" max="100" value="' + S.volume + '" data-range="volume" aria-label="Громкость"><span>🔊</span></div></div><div class="about-note">Громкость действует на «Музыку».</div>',
    about: () => '<div class="settings-group"><div class="settings-row"><div class="settings-label">Название</div><div class="settings-value">Телефон «Стекло»</div></div><div class="settings-row"><div class="settings-label">Версия</div><div class="settings-value">2.0</div></div></div>' +
      '<div class="about-note"><b>Фан-концепт интерфейса, не связан с Microsoft/Apple/Samsung.</b> Значки и обои нарисованы заново, шрифты системные, сеть не нужна.</div><button class="sheet-btn" data-reset>Сбросить всё</button>',
  };
  function render() {
    if (page === 'main') {
      const rows = ROWS.filter(r => !q || r.name.toLowerCase().includes(q));
      shell('settings', '<div class="app-header"><div class="app-title">Настройки</div></div><div class="settings-list"><label class="settings-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input placeholder="Поиск" aria-label="Поиск настроек"></label><div class="settings-group">' +
        (rows.length ? rows.map(r => '<div class="settings-row"' + (r.p ? ' data-page="' + r.p + '"' : '') + '><div class="settings-icon" style="background:' + r.color + '">' + r.g + '</div><div class="settings-label">' + r.name + '</div>' + (r.toggle ? tog(r.k) : '<div class="chevron">›</div>') + '</div>').join('') : '<div class="settings-row"><div class="settings-label" style="color:#8e8e93">Ничего не найдено</div></div>') + '</div></div>', true);
      const inp = sc.el.querySelector('.settings-search input'); inp.value = q;
      inp.addEventListener('input', () => { q = inp.value.trim().toLowerCase(); const pos = inp.selectionStart; render(); const i2 = sc.el.querySelector('.settings-search input'); i2.focus(); i2.setSelectionRange(pos, pos); });
      return;
    }
    shell('settings', '<div class="nav-bar"><button class="nav-btn" data-back>‹ Настройки</button><div class="nb-title">' + ROWS.find(r => r.p === page).name + '</div></div><div class="scr-body">' + PAGES[page]() + '</div>', true);
  }
  let own = false;
  sc.el.addEventListener('click', e => {
    const p = e.target.closest('[data-page]'); if (p) { page = p.dataset.page; render(); return; }
    if (e.target.closest('[data-back]')) { page = 'main'; render(); return; }
    const t = e.target.closest('[data-set]'); if (t) { if (t.dataset.set === 'glass-inv') setS('glass', !S.glass); else setS(t.dataset.set, !S[t.dataset.set]); return; }
    const w = e.target.closest('[data-wall]'); if (w) { setS('wallpaper', w.dataset.wall); return; }
    if (e.target.closest('[data-reset]')) { store.clear(); location.reload(); }
  });
  sc.el.addEventListener('input', e => { const r = e.target.closest('[data-range]'); if (r) { own = true; setS(r.dataset.range, +r.value); own = false; } });
  on('settings', () => { if (sc.inited && !own && current === 'settings' && !sc.el.querySelector('.settings-search input:focus')) render(); });
  sc.onKey = e => { if (e.key === 'Escape' && page !== 'main') { page = 'main'; render(); return true; } };
  sc.onShow = () => { page = 'main'; q = ''; render(); };
  render();
}

// ===== Масштаб: телефон целиком помещается в окно любой высоты =====
function fit() {
  const d = $('device');
  if (innerWidth <= 420) { d.style.transform = ''; return; }
  const k = Math.min(1, (innerHeight - 40) / (852 + 28), (innerWidth - 40) / (393 + 28));
  d.style.transform = 'scale(' + k + ')';
}
addEventListener('resize', fit);

// ===== Запуск =====
buildHome();
buildScreens();
applySettings();
tick();
updateWidgets();
fit();
</script>
